<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#1d3a6e" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="投资工作台" />
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'%3E%3Crect width='180' height='180' rx='40' fill='%231d3a6e'/%3E%3Cpath d='M38 120l26-32 22 17 26-38 28 26' fill='none' stroke='%23fff' stroke-width='11' stroke-linecap='round' stroke-linejoin='round'/%3E%3Cpath d='M32 138h116' stroke='%23fff' stroke-width='9' stroke-linecap='round' opacity='.45'/%3E%3C/svg%3E" />
<title>投资工作台 · Investment Desk</title>
<style>
:root{
  --bg:#f4f6fa; --surface:#fff; --surface-2:#fafbfd;
  --line:#e6eaf1; --line-strong:#d5dbe6;
  --text:#0e1726; --text-2:#3d4a5c; --muted:#7a8798;
  --accent:#1d3a6e; --accent-2:#2f5da8; --accent-soft:#eef3fb;
  --up:#d2373a; --up-soft:#fdeeee; --down:#0d8a5f; --down-soft:#e9f7f1;
  --warn:#b26a00; --warn-soft:#fdf5e6; --violet:#6d4aa8; --violet-soft:#f3eefb;
  --sidebar-w:236px; --radius:12px;
  --shadow:0 1px 2px rgba(16,29,54,.04), 0 8px 24px -12px rgba(16,29,54,.10);
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-size:13.5px;line-height:1.62;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  -webkit-font-smoothing:antialiased}
::selection{background:#d8e3f7}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
.num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1}

.sidebar{position:fixed;top:0;left:0;bottom:0;width:var(--sidebar-w);background:var(--surface);
  border-right:1px solid var(--line);display:flex;flex-direction:column;z-index:40;
  transition:transform .24s cubic-bezier(.4,0,.2,1)}
.brand{padding:18px 18px 14px;border-bottom:1px solid var(--line)}
.brand-row{display:flex;align-items:center;gap:10px}
.logo{width:32px;height:32px;border-radius:9px;flex:0 0 auto;background:linear-gradient(145deg,#1d3a6e,#3a63a8);
  display:grid;place-items:center;color:#fff;box-shadow:0 4px 10px -4px rgba(29,58,110,.55)}
.brand-title{font-size:14.5px;font-weight:650;letter-spacing:.2px}
.brand-sub{font-size:10.5px;color:var(--muted);letter-spacing:1.4px;text-transform:uppercase;margin-top:1px}
.brand-meta{margin-top:12px;display:flex;align-items:center;justify-content:space-between;font-size:11px;color:var(--muted)}
.dot-live{display:inline-flex;align-items:center;gap:5px}
.dot-live i{width:5px;height:5px;border-radius:50%;background:var(--up);display:block;box-shadow:0 0 0 3px var(--up-soft)}
.nav{padding:10px;overflow-y:auto;flex:1}
.nav-label{font-size:10px;letter-spacing:1.2px;color:#a3adbb;padding:8px 8px 6px;text-transform:uppercase}
.nav-item{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:8px;color:var(--text-2);
  font-size:13px;cursor:pointer;position:relative;transition:.15s}
.nav-item svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;opacity:.75;flex:0 0 auto}
.nav-item:hover{background:var(--surface-2);color:var(--text)}
.nav-item.active{background:var(--accent-soft);color:var(--accent);font-weight:600}
.nav-item.active svg{opacity:1}
.nav-item.active::before{content:"";position:absolute;left:-10px;top:50%;transform:translateY(-50%);
  width:3px;height:18px;background:var(--accent);border-radius:0 2px 2px 0}
.nav-item .idx{margin-left:auto;font-size:10px;color:#b6bfcc;font-variant-numeric:tabular-nums}
.nav-item .soon{margin-left:auto;font-size:9px;padding:1px 5px;border-radius:4px;background:#f1f3f7;color:#98a2b3}
.side-foot{padding:10px 14px 12px;border-top:1px solid var(--line);font-size:10.5px;color:var(--muted);line-height:1.65}
.side-foot b{color:var(--text-2);font-weight:600}

.main{margin-left:var(--sidebar-w);min-height:100vh;display:flex;flex-direction:column}
.topbar{position:sticky;top:0;z-index:30;background:rgba(255,255,255,.9);backdrop-filter:blur(12px);
  border-bottom:1px solid var(--line);padding:12px 28px;display:flex;align-items:center;gap:18px}
.topbar h1{font-size:17px;font-weight:650}
.topbar .desc{font-size:11.5px;color:var(--muted);margin-top:1px}
.topbar-right{margin-left:auto;display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.menu-btn{display:none;width:34px;height:34px;border-radius:9px;border:1px solid var(--line);background:var(--surface);
  place-items:center;flex:0 0 auto;color:var(--text-2)}
.menu-btn:active{background:var(--accent-soft);color:var(--accent)}
.menu-btn svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round}
.mask{display:none;position:fixed;inset:0;background:rgba(14,23,38,.42);z-index:38}
.pill{display:inline-flex;align-items:center;gap:6px;padding:5px 10px;border:1px solid var(--line);
  border-radius:7px;font-size:11.5px;color:var(--text-2);background:var(--surface);font-variant-numeric:tabular-nums}
.pill b{font-weight:600;color:var(--text)}
.pill.warn{border-color:#f0d9b0;background:var(--warn-soft);color:var(--warn)}
.btn-ghost{padding:6px 11px;border:1px solid var(--line);border-radius:7px;background:var(--surface);font-size:11.5px;color:var(--text-2);transition:.15s}
.btn-ghost:hover{border-color:var(--line-strong);background:var(--surface-2);color:var(--text)}
.view{padding:18px 28px 60px;max-width:1500px;width:100%;animation:fade .26s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

.feedbar{display:flex;align-items:center;gap:9px;padding:8px 12px;margin-bottom:16px;
  background:#fff7f7;border:1px solid #f3d6d6;border-radius:9px;font-size:11.5px;color:#a33;line-height:1.5}
.feedbar .ic{width:16px;height:16px;flex:0 0 auto;display:grid;place-items:center;border-radius:50%;
  background:#d2373a;color:#fff;font-size:10px;font-weight:700}
.feedbar b{color:#8f2424}
.feedbar.ok{background:#f4faf6;border-color:#cfe7d8;color:#1f5c3d}
.feedbar.ok .ic{background:#0d8a5f}
.feedbar.ok b{color:#134d32}
.feedbar.warn{background:#fffbf0;border-color:#f0dfb8;color:#8a5a12}
.feedbar.warn .ic{background:#c98a15}
.feedbar.warn b{color:#6d4508}
.feedbar a{color:inherit;text-decoration:underline;font-weight:600}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
.sec{margin-bottom:22px}
.sec-head{display:flex;align-items:baseline;gap:10px;margin:0 0 9px;padding-left:2px;flex-wrap:wrap}
.sec-num{font-size:10.5px;font-weight:700;color:var(--accent-2);letter-spacing:.5px;background:var(--accent-soft);
  padding:2px 6px;border-radius:5px;font-variant-numeric:tabular-nums}
.sec-title{font-size:13.5px;font-weight:650}
.sec-sub{font-size:11.5px;color:var(--muted)}
.sec-head .right{margin-left:auto;font-size:11px;color:var(--muted);display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.upd{display:inline-flex;align-items:center;gap:5px;padding:2px 7px;border-radius:5px;background:var(--surface-2);
  border:1px solid var(--line);font-size:10.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.upd b{color:var(--text-2);font-weight:600}
.upd.hot{border-color:#f4d9c2;background:#fff8f2;color:#a4622a}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g-auto{grid-template-columns:repeat(auto-fill,minmax(272px,1fr))}
.up{color:var(--up)}.down{color:var(--down)}.flat{color:var(--muted)}
.chg{display:inline-block;text-align:right;font-variant-numeric:tabular-nums;font-weight:600;font-size:12.5px}
.tag{display:inline-block;padding:1px 7px;border-radius:5px;font-size:10.5px;line-height:1.7;
  background:var(--surface-2);color:var(--text-2);border:1px solid var(--line);white-space:nowrap}
.tag.blue{background:var(--accent-soft);color:var(--accent);border-color:#dbe6f6}
.tag.red{background:var(--up-soft);color:var(--up);border-color:#f6dcdc}
.tag.green{background:var(--down-soft);color:var(--down);border-color:#d6efe5}
.tag.amber{background:var(--warn-soft);color:var(--warn);border-color:#f6e6c9}
.tag.violet{background:var(--violet-soft);color:var(--violet);border-color:#e4dcf5}
.tag.dash{border-style:dashed;color:#98a2b3}
.muted{color:var(--muted)}.small{font-size:11.5px}.tiny{font-size:10.5px}
.pending{font-size:10.5px;color:#98a2b3;border:1px dashed #d5dbe6;border-radius:5px;padding:1px 6px;display:inline-block;background:#fcfdfe}

.tbl-wrap{overflow-x:auto;border-radius:var(--radius);-webkit-overflow-scrolling:touch}
table.tbl{width:100%;border-collapse:collapse;font-size:12.5px}
table.tbl th{text-align:left;font-weight:600;font-size:10.5px;letter-spacing:.5px;color:var(--muted);
  text-transform:uppercase;padding:9px 12px;background:var(--surface-2);border-bottom:1px solid var(--line);white-space:nowrap}
table.tbl td{padding:9px 12px;border-bottom:1px solid #f1f4f8;vertical-align:top;color:var(--text-2)}
table.tbl tr:last-child td{border-bottom:none}
table.tbl tbody tr:hover{background:#fbfcfe}
table.tbl td.strong{color:var(--text);font-weight:600}
table.tbl td.num,table.tbl th.num{text-align:right;font-variant-numeric:tabular-nums}
table.tbl tr.grp td{background:#f7f9fc;font-size:10px;letter-spacing:1px;color:#94a0b0;text-transform:uppercase;padding:6px 12px;font-weight:600}
.tk{font-weight:700;color:var(--text);letter-spacing:.2px;font-size:12.5px}
.tk-sub{font-size:10.5px;color:var(--muted);margin-top:1px}
.read{font-size:11.5px;color:var(--text-2);line-height:1.62}

.hero{display:grid;grid-template-columns:1.5fr 1fr;border:1px solid var(--line);border-radius:var(--radius);
  overflow:hidden;background:var(--surface);box-shadow:var(--shadow);margin-bottom:20px}
.hero-left{padding:18px 22px 14px;border-right:1px solid var(--line)}
.hero-kicker{display:flex;align-items:center;gap:8px;margin-bottom:8px;flex-wrap:wrap}
.hero-kicker .date{font-size:10.5px;letter-spacing:1.4px;color:var(--muted);text-transform:uppercase;font-variant-numeric:tabular-nums}
.hero h2{font-size:15px;font-weight:650;margin-bottom:2px}
.hero .stance{font-size:12px;color:var(--text-2);margin-bottom:10px}
.hero .stance b{color:var(--up)}
ol.concl{list-style:none;counter-reset:c}
ol.concl li{counter-increment:c;position:relative;padding:6px 0 6px 26px;font-size:12.5px;color:var(--text-2);border-top:1px dashed #eef1f6}
ol.concl li:first-child{border-top:none}
ol.concl li::before{content:counter(c,decimal-leading-zero);position:absolute;left:0;top:7px;font-size:10px;
  font-weight:700;color:var(--accent-2);font-variant-numeric:tabular-nums}
ol.concl li b{color:var(--text);font-weight:650}
.hero-right{padding:16px 18px;background:linear-gradient(180deg,#fcfdff,#f8fafd);display:flex;flex-direction:column;gap:12px}
.senti{border-bottom:1px solid var(--line);padding-bottom:10px}
.senti:last-of-type{border-bottom:none;padding-bottom:0}
.senti-top{display:flex;align-items:baseline;gap:8px}
.senti-top .k{font-size:11px;color:var(--muted)}
.senti-top .v{margin-left:auto;font-size:19px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.3px}
.senti-top .lb{font-size:10.5px;font-weight:600}
.gauge{height:6px;border-radius:3px;background:#e9edf4;overflow:hidden;margin-top:6px;position:relative}
.gauge span{display:block;height:100%;border-radius:3px}
.gscale{display:flex;justify-content:space-between;font-size:9.5px;color:#aeb7c4;margin-top:3px}
.comp{display:grid;grid-template-columns:1fr 1fr;gap:4px 12px;margin-top:8px}
.comp-row{display:flex;align-items:center;gap:6px;font-size:10px;color:var(--muted)}
.comp-row .bar{flex:1;height:4px;border-radius:2px;background:#edf0f6;overflow:hidden}
.comp-row .bar i{display:block;height:100%;border-radius:2px;background:#9db0cc}
.comp-row .n{font-variant-numeric:tabular-nums;color:var(--text-2);font-weight:600;width:22px;text-align:right}

.mv{font-weight:700;font-variant-numeric:tabular-nums;font-size:13px}
.state{font-size:9.5px;padding:1px 5px;border-radius:4px;font-weight:600;white-space:nowrap}
.state.done{background:var(--down-soft);color:var(--down)}
.gap{font-size:11px;font-variant-numeric:tabular-nums;line-height:1.7}
.gap b{font-weight:600}

.subtabs{display:flex;gap:2px;flex-wrap:wrap;border-bottom:1px solid var(--line);margin-bottom:16px}
.subtab{padding:8px 13px;font-size:12.5px;color:var(--muted);border-bottom:2px solid transparent;
  margin-bottom:-1px;transition:.15s;white-space:nowrap;cursor:pointer}
.subtab:hover{color:var(--text)}
.subtab.on{color:var(--accent);border-color:var(--accent);font-weight:650}
.subtab .c{font-size:10px;color:#b6bfcc;margin-left:4px}

.track-ico{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;flex:0 0 auto;font-size:11px;font-weight:700}
.track h3{font-size:14px;font-weight:650}
.track .sub{font-size:10.5px;color:var(--muted)}
.thesis{font-size:12px;color:var(--text-2);line-height:1.7;border-left:2px solid #dbe6f6;padding-left:10px}
.kpi-row{display:flex;flex-wrap:wrap;gap:6px}
.kpi{font-size:10.5px;padding:3px 7px;border-radius:6px;background:var(--surface-2);border:1px solid var(--line);color:var(--text-2)}
.kpi b{color:var(--text);font-weight:600;font-variant-numeric:tabular-nums}

.tl{margin-top:4px}
.tl-item{position:relative;padding:0 0 16px 18px;border-left:1px solid #e6eaf1;margin-left:5px}
.tl-item:last-child{border-left-color:transparent;padding-bottom:2px}
.tl-item::before{content:"";position:absolute;left:-4px;top:5px;width:7px;height:7px;border-radius:50%;background:#fff;border:2px solid #c9d4e4}
.tl-item.new::before{border-color:var(--up);background:var(--up)}
.tl-meta{font-size:10.5px;color:var(--muted);display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-variant-numeric:tabular-nums}
.tl-title{font-size:12.5px;font-weight:600;margin:2px 0 3px;line-height:1.55}
.tl-title.new{color:var(--up)}
.tl-body{font-size:11.5px;color:var(--text-2);line-height:1.65}
.src{color:#94a0b0;font-size:10.5px}

.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr))}
.cal-day{border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:8px 9px;min-height:138px;background:#fff}
.cal-day:nth-child(7n){border-right:none}
.cal-day.today{background:#fbfcff;box-shadow:inset 0 2px 0 var(--accent-2)}
.cal-day.weekend{background:#fbfcfe}
.cal-dow{font-size:9.5px;color:#a0aaba;letter-spacing:.8px}
.cal-date{font-size:14px;font-weight:650;margin:1px 0 5px;font-variant-numeric:tabular-nums}
.cal-day.today .cal-date{color:var(--accent-2)}
.cal-ev{font-size:10.5px;line-height:1.45;padding:4px 0;border-top:1px dashed #f0f3f8;display:flex;gap:5px}
.cal-ev:first-of-type{border-top:none}
.cal-ev .t{color:#a0aaba;font-variant-numeric:tabular-nums;flex:0 0 auto;font-size:9.5px;padding-top:1px}
.cal-ev .x{color:var(--text-2)}
.imp{width:5px;height:5px;border-radius:50%;margin-top:5px;flex:0 0 auto}
.imp.h{background:var(--up)}.imp.m{background:#e0a33a}.imp.l{background:#c3cbd8}

.quote{border-left:2px solid #d8dee9;padding:8px 12px;background:var(--surface-2);border-radius:0 8px 8px 0;margin-bottom:8px}
.quote .q-meta{font-size:10px;color:var(--muted);margin-bottom:3px;font-variant-numeric:tabular-nums}
.quote .o{font-size:12px;color:var(--text);line-height:1.62}
.quote .zh{font-size:11px;color:var(--muted);margin-top:3px;line-height:1.55}
.quote .r{font-size:11.5px;color:var(--text-2);margin-top:5px;padding-top:5px;border-top:1px dashed #e7ebf2;line-height:1.6}
.quote .r b{color:var(--accent-2)}
.hi{color:var(--up);font-weight:600}
.hi-b{color:var(--up);font-weight:700}
.q-new{display:inline-block;width:5px;height:5px;border-radius:50%;background:var(--up);vertical-align:middle;margin-right:5px}
.quote.isnew{border-left-color:var(--up);background:#fffafa}
.quote.isnew .q-meta{color:var(--up)}
.chip-src{font-size:9.5px;color:#98a2b3;border:1px solid var(--line);border-radius:4px;padding:0 4px;white-space:nowrap}
.empty{padding:22px;text-align:center;font-size:11.5px;color:var(--muted)}
.mrow{display:flex;gap:8px;font-size:11.5px;padding:6px 0;border-top:1px dashed #eef1f6;line-height:1.62}
.mrow .mk{flex:0 0 60px;color:#98a2b3;font-size:10.5px;padding-top:2px;letter-spacing:.3px}
.mrow .mv2{flex:1;color:var(--text-2)}
.verdict{display:flex;align-items:center;gap:12px;padding:12px 16px;border-radius:10px;
  background:linear-gradient(96deg,#f7f9fd,#fff);border:1px solid var(--line);margin-bottom:12px}
.verdict .vt{font-size:19px;font-weight:700;letter-spacing:.4px}
.verdict .vn{font-size:11.5px;color:var(--muted);line-height:1.6}
.tbl tr.isupd td{background:#fffbfb}
.tbl tr.isupd td:first-child{box-shadow:inset 3px 0 0 var(--up)}
.sel-sum{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.sub-h{display:flex;align-items:center;gap:8px;margin:16px 0 9px;padding-top:2px}
.sub-h .sn{font-size:10px;font-weight:700;color:#fff;background:var(--accent-2);border-radius:4px;padding:1px 5px;letter-spacing:.4px}
.sub-h b{font-size:12.5px;font-weight:650}
.sub-h .d{font-size:11px;color:var(--muted)}
.srcbar{display:flex;gap:18px;flex-wrap:wrap;padding:9px 13px;margin-bottom:16px;border:1px solid var(--line);
  border-radius:9px;background:var(--surface);font-size:11px;color:var(--text-2);align-items:center}
.srcbar .si{display:flex;align-items:center;gap:5px}
.srcbar .dot{width:6px;height:6px;border-radius:50%;display:block}
.srcbar .dot.on{background:var(--down);box-shadow:0 0 0 3px var(--down-soft)}
.srcbar .dot.off{background:#c9d0da;box-shadow:0 0 0 3px #f2f4f8}
.srcbar b{font-weight:600;color:var(--text)}

.filters{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.fchip{padding:5px 11px;border-radius:7px;border:1px solid var(--line);background:var(--surface);font-size:11.5px;color:var(--text-2);transition:.15s}
.fchip:hover{border-color:var(--line-strong);color:var(--text)}
.fchip.on{background:var(--accent);border-color:var(--accent);color:#fff}
.stock-card{border:1px solid var(--line);border-radius:var(--radius);background:var(--surface);padding:13px 14px;
  cursor:pointer;transition:.16s;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:7px}
.stock-card:hover{transform:translateY(-2px);border-color:#cfdbef;box-shadow:0 12px 28px -16px rgba(16,29,54,.28)}
.sc-top{display:flex;align-items:flex-start;gap:8px}
.sc-tk{font-size:14px;font-weight:750;letter-spacing:.3px}
.sc-name{font-size:11px;color:var(--muted);margin-top:-1px}
.sc-px{margin-left:auto;text-align:right}
.sc-px .p{font-size:13px;font-weight:650;font-variant-numeric:tabular-nums}
.sc-px .d{font-size:11px;font-variant-numeric:tabular-nums;font-weight:600}
.sc-logic{font-size:11.5px;color:var(--text-2);line-height:1.6;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}

function fmtCap(v){ if(!v) return "—";
  if(v>=1e12) return "$"+(v/1e12).toFixed(2)+"T";
  if(v>=1e9) return "$"+(v/1e9).toFixed(1)+"B";
  return "$"+(v/1e6).toFixed(0)+"M"; }
function pstr(v,d){ return (v===null||v===undefined)?"—":((v>0?"+":"")+Number(v).toFixed(d==null?2:d)+"%"); }
function pp(v,d){ return (v===null||v===undefined)?"—":((v>0?"+":"")+Number(v).toFixed(d==null?2:d)+"%"); }
function clamp(v,lo,hi){ return Math.max(lo,Math.min(hi,v)); }

const CODE_OF = {TSLA:"TSLA.O",META:"META.O",IREN:"IREN.O",NBIS:"NBIS.O",CRWV:"CRWV.O",BE:"BE.N",
  AMD:"AMD.O",TSM:"TSM.N",TER:"TER.O",ONTO:"ONTO.N",NET:"NET.N",RBRK:"RBRK.N",OKTA:"OKTA.O",CHKP:"CHKP.O"};

/* ---- 数据更新时间：双时区时间戳 + 下一场更新（北京时间动态推算） ---- */
function syncStamps(iso){
  const d=new Date(iso);
  const etParts=Object.fromEntries(new Intl.DateTimeFormat("en-CA",{timeZone:"America/New_York",month:"2-digit",day:"2-digit",hour:"2-digit",minute:"2-digit",hourCycle:"h23"}).formatToParts(d).map(x=>[x.type,x.value]));
  return {
    bj:d.toLocaleString("zh-CN",{timeZone:"Asia/Shanghai",month:"2-digit",day:"2-digit",hour:"2-digit",minute:"2-digit",hour12:false,hourCycle:"h23"}),
    et:etParts.month+"-"+etParts.day+" "+etParts.hour+":"+etParts.minute
  };
}
function nextSession(){
  const bjDate=new Intl.DateTimeFormat("en-CA",{timeZone:"Asia/Shanghai"}).format(new Date());
  const wd=new Date(bjDate+"T12:00:00").getDay();
  const f=(o)=>+new Intl.DateTimeFormat("en",{timeZone:"Asia/Shanghai",hourCycle:"h23",hour12:false,...o}).format(new Date());
  const cur=f({hour:"numeric"})*60+f({minute:"numeric"});
  if(wd===0||wd===6) return "周一 07:00";
  if(cur<7*60) return "今日 07:00";
  if(cur<20*60+30) return "今日 20:30";
  return wd===5?"周一 07:00":"明日 07:00";
}
const asOfFmt=(s)=>s&&s.length===8?s.slice(4,6)+"-"+s.slice(6,8):(s||"—");

/* ---- 上一场是否漏跑：数据比“本应到位的时刻”还旧，就在首页顶部示警 ----
   交易日两场：北京 07:00 与 20:30。GRACE 用来容忍 GitHub 定时任务的实际延迟。 */
function staleGuard(iso){
  if(!iso) return null;
  const now=Date.now();
  const p=Object.fromEntries(new Intl.DateTimeFormat("en-CA",{timeZone:"Asia/Shanghai",
    year:"numeric",month:"2-digit",day:"2-digit",hour:"2-digit",minute:"2-digit",hourCycle:"h23"})
    .formatToParts(new Date(now)).map(x=>[x.type,x.value]));
  const ymd=p.year+"-"+p.month+"-"+p.day;
  const dow=new Date(ymd+"T00:00:00Z").getUTCDay();        /* 0=周日 */
  const cur=(+p.hour)*60+(+p.minute);
  const mk=(off,h,m)=>{
    const day=new Date(new Date(ymd+"T00:00:00Z").getTime()+off*864e5).toISOString().slice(0,10);
    return new Date(day+"T"+String(h).padStart(2,"0")+":"+String(m).padStart(2,"0")+":00+08:00");
  };
  const isWD=dow>=1&&dow<=5;
  let last,label;
  if(isWD&&cur>=20*60+30){ last=mk(0,20,30);  label="今日 20:30"; }
  else if(isWD&&cur>=7*60){ last=mk(0,7,0);   label="今日 07:00"; }
  else if(dow===1){         last=mk(-3,20,30); label="上周五 20:30"; }
  else if(isWD){            last=mk(-1,20,30); label="昨日 20:30"; }
  else if(dow===6){         last=mk(-1,20,30); label="周五 20:30"; }
  else{                     last=mk(-2,20,30); label="周五 20:30"; }
  const synced=new Date(iso).getTime();
  const lagH=(last.getTime()-synced)/36e5;   /* >0 表示数据比上一场还旧 */
  const ageH=(now-synced)/36e5;
  const GRACE=1.5;                           /* 容忍定时任务延迟 1.5 小时 */
  return { stale:lagH>GRACE, lagH:lagH, ageH:ageH, lastLabel:label };
}

function hydrate(L){
  FEED.connected = true;
  const d = new Date(L.meta.syncedAt);
  FEED.lastSync = d.toLocaleString("zh-CN",{month:"2-digit",day:"2-digit",hour:"2-digit",minute:"2-digit"});
  const st = syncStamps(L.meta.syncedAt);
  FEED.lastSyncBJ = st.bj;
  FEED.lastSyncET = st.et;
  DATA.meta.syncedISO = L.meta.syncedAt;
  DATA.meta.dataAsOf = L.meta.stockDate;
  DATA.meta.updatedPT = st.bj;
  DATA.meta.nextPT = nextSession();

  /* 1. 标的行情 */
  DATA.stocks.forEach(function(s){
    const c = CODE_OF[s.t], q = c && L.stocks[c];
    if(!q) return;
    s.px = "$" + q.price.toFixed(2);
    s.mv = q.chg;
    s.d20 = q.d20;
    s.cap = fmtCap(q.mcap);
    s.live = {price:q.price, chg:q.chg, d20:q.d20, mcap:q.mcap, date:q.date,
              pre:q.pre, post:q.post, prev:q.prev};
  });

  /* 2. 市场色彩 */
  const I = L.indices, X = L.cross;
  const g = function(k){ return I[k] || {}; };
  const spx=g("SPX.GI"), ixic=g("IXIC.GI"), dji=g("DJI.GI"), ndx=g("NDX.GI"), sox=g("SOX.GI"), vix=g("VIX.GI");
  const growthGap = (ndx.d20!=null && dji.d20!=null) ? (ndx.d20-dji.d20) : null;
  const soxGap = (sox.d20!=null && spx.d20!=null) ? (sox.d20-spx.d20) : null;

  DATA.meta.spxChg = spx.chg;
  const up = (v)=> v!=null && v>0;
  DATA.brief.color = [
    {dim:"指数",
     perf:"标普 " + fmtNum(spx.level,2) + "（" + pstr(spx.chg) + "）／纳指 " + fmtNum(ixic.level,2) + "（" + pstr(ixic.chg) + "）／道指 " + fmtNum(dji.level,2) + "（" + pstr(dji.chg) + "）；20 日 " + pstr(spx.d20) + " / " + pstr(ixic.d20) + " / " + pstr(dji.d20),
     note: up(spx.chg)
       ? "三大指数同向收涨，但要看是谁在涨：<b>广度与量能</b>决定这是修复还是反转，单日方向本身不构成结论。"
       : "三大指数同日小幅收跌，<b>跌幅都在 0.5% 以内</b>——水位没变；真正变化的是内部结构（半导体与高贝塔显著弱于道指）。<b>浅跌 + 深分化</b>，不是新一轮下跌的开始。"},
    {dim:"风格",
     perf:"纳指 100 20 日 " + pstr(ndx.d20) + "　vs　道指 20 日 " + pstr(dji.d20) + "　→ 成长" + ((growthGap||0)<0?"跑输":"跑赢") + "价值 " + (growthGap==null?"—":Math.abs(growthGap).toFixed(1)+" 个百分点"),
     note: (growthGap||0)<0
       ? "成长 20 日仍大幅跑输价值，<b>风格切换没有被单日行情逆转</b>；道指 20 日仍为正，说明资金在往“现金流确定”的方向挪，不是在全面撤退。"
       : "成长重新占优，防御与价值落后——风险偏好在修复，但要确认是<b>增量资金</b>还是存量博弈，看量能与广度。"},
    {dim:"半导体",
     perf:"费城半导体 " + fmtNum(sox.level,2) + "（" + pstr(sox.chg) + "），20 日 " + pstr(sox.d20) + "；相对标普 " + (soxGap==null?"—":pstr(soxGap,1)),
     note: (sox.d20!=null && sox.d20<-5)
       ? "费半 20 日 <b>" + pstr(sox.d20) + "</b>，是全场最弱的一档——但<b>弱的是估值，不是订单</b>：CoWoS 仍满产、设备交期仍 18 个月、GPU 租金仍在涨。同一天 AMD 创历史新高、TSM/TER/ONTO 收跌，说明这是<b>选股行情而非板块行情</b>。"
       : "费半相对标普 " + (soxGap==null?"—":pstr(soxGap,1)) + "，半导体重新领跑；需要确认是<b>全线扩散</b>还是只由少数权重带动。"},
    {dim:"波动",
     perf:"VIX " + fmtNum(vix.level,2) + "（" + pstr(vix.chg) + "），20 日 " + pstr(vix.d20),
     note: up(vix.chg)
       ? "指数小跌而 <b>VIX 逆势上行</b>——<b>指数不动、波动率抬升</b>，是分歧放大与对冲需求上升的信号，通常出现在“结构切换”而不是“单边下跌”里。对冲成本在变贵，保护要提前买，不要等。"
       : "VIX 回落、指数上行，恐慌在解除；但若<b>缩量</b>，更像“卖压真空”而不是风险出清，对冲仓位不急着全撤。"},
    {dim:"量能",
     perf:"标普成交额 " + (spx.amount ? fmtNum(spx.amount/1e8,0) + " 亿美元" : "待接入") +
           "；道指 " + (dji.amount ? fmtNum(dji.amount/1e8,0) + " 亿美元" : "待接入") + "（仅当日绝对值，20 日均量待接入）",
     note:"放量下跌与缩量下跌含义完全不同。目前只有绝对量、没有均量对比，这一项暂时不能下结论——不做猜测。"},
    {dim:"板块",
     perf:"待接入（需 11 个 GICS 板块行情）",
     note:"没有板块数据就不编板块结论。接入后可看：是全面回撤，还是仅信息技术/通信服务拖累。"},
    {dim:"个股分化",
     perf:"待接入（需涨跌家数与中位数涨幅）",
     note:"指数与个股的背离程度是判断“结构性”还是“系统性”的关键，目前缺这一块，先标注待补。"}
  ];

  /* 3. 全球跨资产 */
  const row = function(k, opts){
    const c = X[k]; if(!c) return null;
    opts = opts || {};
    const isPct = c.unit === "%";
    let close, d1, u1, d20, u20;
    if(isPct){
      close = c.value.toFixed(2) + "%";
      d1 = c.dbp1; u1 = "bp"; d20 = opts.block20 ? null : c.dbp20; u20 = "bp";
    } else {
      const dec = c.value >= 1000 ? 0 : (c.value >= 100 ? 1 : 2);
      close = fmtNum(c.value, dec);
      d1 = c.d1; u1 = "%"; d20 = opts.block20 ? null : c.d20; u20 = "%";
    }
    return {n: opts.name || c.name.replace(/^.*[:：]/, ""), close: close, d1: d1, u1: u1, d20: d20, u20: u20, note: opts.note || ""};

    {group:"利率与汇率", rows:[
      row("UST10Y", {name:"10Y 美债收益率", note: t10>=5
        ? "<b>"+t10.toFixed(3)+"%</b>，站在 5% 之上——这是全篇最重要的数字。<b>分母端压制未解除</b>，长久期成长股的估值上限被系统性下移；12/8-9 FOMC 前不会有缓解。"
        : "<b>"+t10.toFixed(3)+"%</b>，在 5% 下方震荡；<b>离 5% 越近，成长股的估值弹性越小</b>。"}),
      row("DXY", {name:"美元指数", note:"汇率不是这轮美股调整的驱动，<b>利率才是</b>；美元走强会额外压制新兴市场与大宗。"}),
      null
    ]},
    {group:"大宗商品", rows:[
      row("WTI", {name:"WTI 原油", note:"油价与通胀预期同向：<b>油价反弹会直接顶住降息预期</b>，是分母端的反向变量，不能只看 10Y。"}),
      row("BRENT", {name:"布伦特原油", block20:true, note:"20 日序列与 WTI 明显不一致，疑为换月或数据断点，已屏蔽，待核"}),
      row("GOLD", {name:"黄金", note:"实际利率在 5% 附近而金价仅温和回撤——<b>央行购金与去美元化</b>仍是底仓逻辑；金价大跌才是流动性冲击的信号。"}),
      row("SILVER", {name:"白银", note:"工业属性强于黄金，<b>跟随铜而不是跟随金</b>；银强于金 = 风险偏好回升。"}),
      row("COPPER", {name:"LME 铜", note:"铜的 20 日跌幅远小于费半——<b>AI 用电与电网需求是真的，被杀的是估值</b>。这是全篇最重要的区分。"})
    ]},
    {group:"加密资产", rows:[
      {n:"BTC", close:"—", d1:null, u1:"%", d20:null, u20:"%", note:"由 Yahoo 辅助层补入；不填估值"}
    ]},
    {group:"亚太股市", rows:[
      row2("N225.GI", "日经 225", "与费半同步波动——日本 AI 设备权重高，反弹与回撤弹性都最大"),
      row2("KS11.GI", "KOSPI", "存储双雄主导弹性，超跌反弹阶段领先，但 20 日仍是主要市场中偏弱的"),
      row2("HSI.HI", "恒生指数", "全球主要市场里相对抗跌，AI 算力与电力主题活跃"),
      row2("000001.SH", "上证指数", "低估值与内需权重提供韧性，属于跟随性波动")
    ]},
    {group:"欧洲股市", rows:[
      row2("SX5E.DF", "欧洲 STOXX 50", "没有 AI 权重，在这轮全球调整里反而成了相对优势"),
      row2("GDAXI.GI", "德国 DAX", "欧洲最强。财政扩张 + 无 AI 泡沫敞口"),
      row2("FTSE.GI", "英国富时 100", "能源与银行权重提供缓冲，波动最小")
    ]}
  ];

  function row2(code, name, note){
    const i = I[code]; if(!i) return {n:name, close:"—", d1:null, u1:"%", d20:null, u20:"%", note:"未取到行情"};
    return {n:name, close:fmtNum(i.level,2), d1:i.chg, u1:"%", d20:i.d20, u20:"%", note:note};
  }

  DATA.brief.cross = rows.map(function(gr){
    return {group:gr.group, rows:gr.rows.filter(Boolean)};
  });

  /* 4. 情绪：用已接入的 4 个因子自算，公式写死在下方，可复核 */
  const vixScore = clamp(100 - (vix.level - 12) * 4, 0, 100);
  const momScore = clamp(50 + spx.d20 * 5, 0, 100);
  const growthScore = clamp(50 + sox.d20 * 2.5, 0, 100);
  const rateScore = clamp(100 - (X.UST10Y.value - 2.5) * 20, 0, 100);
  const score = Math.round((vixScore + momScore + growthScore + rateScore) / 4);
  const lb = score >= 75 ? "极度贪婪" : score >= 55 ? "贪婪" : score >= 45 ? "中性" : score >= 25 ? "恐惧" : "极度恐惧";

  DATA.senti.appetite = {v: score, label: lb, at: FEED.lastSync};
  DATA.senti.fng = {v: score, label: lb, at: FEED.lastSync,
    scale:["极度恐惧","恐惧","中性","贪婪","极度贪婪"],
    note:"平台自算，仅 4 因子（VIX / 标普 20 日动量 / 费半 20 日 / 10Y），非 CNN 官方口径"};
  DATA.senti.comps = [
    ["波动(VIX)", Math.round(vixScore)],
    ["动量(标普20日)", Math.round(momScore)],
    ["成长(费半20日)", Math.round(growthScore)],
    ["利率(10Y)", Math.round(rateScore)]
  ];
}

/* ==========================================================================
   YAHOO / NASDAQ 辅助层（板块/量能/BTC + 当日财报日历 + 双端点校验）
   - 补充项：BTC/ETH、11 个板块 ETF、标普量能、等权 vs 市值权重
   - 只有这一层能给：当日到底哪几家披露、盘前盘后价格、一致预期与实际 EPS
   ========================================================================== */
const YF = (typeof window !== "undefined" && window.YF_DATA) ? window.YF_DATA : null;
const POOL_SYMS = Object.keys(CODE_OF);

function epsShow(v){ return v==null ? "—" : (v<0 ? "("+Math.abs(v).toFixed(2)+")" : v.toFixed(2)); }
function tierOf(mcap){ return mcap>=10e9 ? "大市值" : (mcap>=2e9 ? "中市值" : "中小市值"); }

/* 行结构：两个表共用，ses = pre / post */
function earnRow(r, ses){
  const mv = ses==="pre" ? r.preChg : (r.postChg!=null ? r.postChg : r.preChg);
  const hit = mv!=null && Math.abs(mv) >= r.threshold;
  return { t:r.symbol, n:r.name, tier:r.tier, mcap:fmtCap(r.mcap), thr:r.threshold,
    q:(r.quarter||"").replace("/"," "), est:r.est, nEst:r.nEst, last:r.last,
    actual:r.actual, surprise:r.surprise, reported:!!r.reported, src:r.src||"",
    mv:mv, pre:r.preChg, post:r.postChg, day:r.dayChg, hit:hit,
    ind:r.ind||"", zh:r.zh||"",
    pooled:POOL_SYMS.indexOf(r.symbol)>=0, ses:ses };
}

/* 解读：只做可由数据推出的话；指引原文缺失时说清缺失，不编 */
function earnRead(r){
  const out=[];
  if(r.reported && r.actual!=null){
    if(r.surprise!=null){
      const better = r.surprise>0;
      const flat = Math.abs(r.surprise) < 0.5;
      out.push("实际 EPS <b>"+epsShow(r.actual)+"</b>，预期 "+epsShow(r.est)+
        (r.est<0 ? "（亏损口径，比的是减亏幅度）" : "") + "，" +
        (flat ? "<b>与预期基本持平</b>"
              : "<b class='"+(better?"up":"down")+"'>"+(better?"好于":"低于")+"预期 "+Math.abs(r.surprise).toFixed(1)+"%</b>"));
    } else {
      out.push("实际 EPS <b>"+epsShow(r.actual)+"</b>，无一致预期可比");
    }
  } else {
    out.push("一致预期 EPS <b>"+epsShow(r.est)+"</b>"+(r.nEst?"（"+r.nEst+" 家）":"")+"，去年同期 "+epsShow(r.last)+"；<span class='muted'>实际数字披露后回填</span>");
  }
  if(r.mv!=null){
    out.push((r.ses==="pre"?"盘前":"盘前接力")+" <b class='"+sgn(r.mv)+"'>"+pct(r.mv,1)+"</b>，"+
      (r.hit?"<b>越过 "+r.thr+"% 阈值</b>":"未达 "+r.thr+"% 阈值"));
  }
  if(r.hit && r.reported && r.surprise!=null){
    if(r.surprise>0 && r.mv<0) out.push("<span class='hi'>数字好于预期、股价却走弱</span>——分歧在指引或下季展望，需看公告原文方可归因（暂不臆断）");
    if(r.surprise<0 && r.mv>0) out.push("<span class='hi'>数字低于预期、股价反而走强</span>——市场在买指引/一次性因素，需核对原文");
  }
  return out.join("；");
}

function hydrateExtra(Y){
  const b = DATA.brief;

  /* 本次同步时间 = 核心层与辅助层里较晚的那个：
     两个脚本不是同一秒跑的，模块时间戳若只取核心层，会出现“辅助数据比时间戳新 11 小时”的错觉。 */
  if(Y && Y.meta && Y.meta.syncedAt){
    const yt = new Date(Y.meta.syncedAt);
    const ct = DATA.meta.syncedISO ? new Date(DATA.meta.syncedISO) : null;
    if(!ct || yt > ct){
      const st2 = syncStamps(Y.meta.syncedAt);
      FEED.lastSync = yt.toLocaleString("zh-CN",{month:"2-digit",day:"2-digit",hour:"2-digit",minute:"2-digit"});
      FEED.lastSyncBJ = st2.bj; FEED.lastSyncET = st2.et;
      DATA.meta.syncedISO = Y.meta.syncedAt;
      DATA.meta.updatedPT = st2.bj;
    }
  }

  /* 1. 量能：标普当日 vs 20 日均量 */
  if(Y.spxVol && Y.spxVol.avg20){
    const v=Y.spxVol, r=v.ratio, el=b.color.find(c=>c.dim==="量能");
    if(el){
      el.perf = "标普成交量 <b>"+fmtNum(v.today/1e8,0)+" 亿股</b>，20 日均量 "+fmtNum(v.avg20/1e8,0)+
        " 亿股，量比 <b>"+(r*100).toFixed(0)+"%</b>（"+(r>=1?"放量 +"+((r-1)*100).toFixed(0)+"%":"缩量 -"+((1-r)*100).toFixed(0)+"%")+"）";
      el.note = r<0.9
        ? (DATA.meta.spxChg!=null && DATA.meta.spxChg>0
          ? "缩量上涨：反弹缺乏增量资金确认，属超跌修复而非新趋势，追涨性价比低；后续放量上涨才是反转信号。"
          : "缩量下跌：卖压在衰减，更像“没人接”而不是“抢着跑”。这种量能结构下，急跌之后的反弹往往缺乏持续性，但也说明恐慌盘不重——不必急着砍。")
        : (r>1.1 ? "放量：分歧加大，方向由谁主导要看收盘位置。放量下跌是趋势信号，放量上涨才是增量资金进场。"
                 : "量能中性，指数涨跌缺乏成交确认，属存量博弈。");
    }
  }

  /* 2. 板块：11 个 GICS 板块 ETF */
  if(Y.sectors){
    const arr=Object.keys(Y.sectors).map(k=>Object.assign({k:k},Y.sectors[k])).sort((a,c)=>c.chg-a.chg);
    const up=arr.filter(x=>x.chg>0).length;
    const el=b.color.find(c=>c.dim==="板块");
    if(el){
      el.perf = "领涨 " + arr.slice(0,3).map(x=>x.cn+" <b class='up'>"+pct(x.chg,1)+"</b>").join("、") +
        "；领跌 " + arr.slice(-2).map(x=>x.cn+" <b class='down'>"+pct(x.chg,1)+"</b>").join("、") +
        "；11 个板块 "+up+" 涨 "+(11-up)+" 跌";
      const tech=Y.sectors.XLK, util=Y.sectors.XLU;
      el.note = "20 日看：" +
        arr.slice().sort((a,c)=>c.d20-a.d20).slice(0,2).map(x=>x.cn+" "+pct(x.d20,1)).join("、")+" 最强；" +
        arr.slice().sort((a,c)=>a.d20-c.d20).slice(0,2).map(x=>x.cn+" "+pct(x.d20,1)).join("、")+" 最弱。" +
        (tech && util ? "信息技术 20 日 "+pct(tech.d20,1)+"，公用事业 "+pct(util.d20,1)+"——"+
          (tech.d20<util.d20 ? "资金在从“算力”往“电力/防御”挪，这是防御性轮动，不是全面 risk-on。" : "科技重新占优，防御板块落后，风险偏好在修复。") : "");
    }
  }

  /* 3. 个股分化：等权 vs 市值加权（可计算代理） */
  if(Y.breadth && Y.breadth.rel20!=null){
    const d=Y.breadth, el=b.color.find(c=>c.dim==="个股分化");
    if(el){
      el.perf = "等权 RSP 20 日 <b class='"+sgn(d.rsp20)+"'>"+pct(d.rsp20,1)+"</b>　vs　市值加权 SPY 20 日 <b class='"+sgn(d.spy20)+"'>"+pct(d.spy20,1)+
        "</b>，等权相对 <b class='"+sgn(d.rel20)+"'>"+pct(d.rel20,1)+"</b>";
      el.note = d.rel20>0
        ? "等权跑赢市值加权 "+d.rel20.toFixed(1)+" 个百分点——跌的是权重股，不是全市场。这轮是“大票杀估值”，中位数个股反而抗跌，<b>不是系统性风险</b>。"
        : "等权跑输市值加权 "+Math.abs(d.rel20).toFixed(1)+" 个百分点——上涨靠少数权重股拉动，广度在恶化，指数新高缺乏个股支撑。";
    }
  }

  /* 4. 加密：BTC / ETH（最近一根已完成的 UTC 日K收盘，非盘中实时价） */
  if(Y.btc || Y.eth){
    const g=b.cross.find(x=>x.group==="加密资产");
    if(g){
      const rows=[];
      if(Y.btc) rows.push({n:"BTC", close:fmtNum(Y.btc.price,0), d1:Y.btc.chg, u1:"%", d20:Y.btc.d20, u20:"%",
        note:"20 日 "+pct(Y.btc.d20,1)+"，与纳指同向。"+(Y.btc.d20<-5?"风险资产整体去杠杆，加密是最先反映的流动性温度计。":"区间震荡，未提供额外信号。")});
      if(Y.eth) rows.push({n:"ETH", close:fmtNum(Y.eth.price,0), d1:Y.eth.chg, u1:"%", d20:Y.eth.d20, u20:"%",
        note: Y.btc ? "ETH/BTC "+(Y.eth.price/Y.btc.price).toFixed(4)+"，20 日 "+(Y.eth.d20-Y.btc.d20>0?"强于":"弱于")+" BTC，山寨风险偏好"+(Y.eth.d20-Y.btc.d20>0?"回暖":"收缩") : "—"});
      g.rows = rows;
    }
    /* 金融科技赛道 KPI：BTC 20 日跟着行情走，不写死 */
    if(Y.btc && Y.btc.d20!=null){
      const tk=DATA.tracks && DATA.tracks.find(x=>x.id==="fin");
      if(tk && tk.kpis) tk.kpis.forEach(k=>{ if(/BTC/.test(k[0])) k[1]=pct(Y.btc.d20,1); });
    }
  }

  /* 5. 当日财报：盘前 / 盘后 */
  const E=Y.earnings||{};
  b.pre = { updated:FEED.lastSync, next:"次日 07:00 回填收盘", date:E.preDate||"",
    total:E.preTotal||0, hit:E.preHit||0, cached:!!E.preCached,
    rows:(E.pre||[]).map(r=>earnRow(r,"pre")) };
  b.post = { updated:FEED.lastSync, next:"", date:E.postDate||"",
    total:E.postTotal||0, hit:E.postHit||0, cached:!!E.postCached,
    rows:(E.post||[]).map(r=>earnRow(r,"post")) };

  /* 5b. 业绩内容（东方财富 7×24 → 业绩要点 / 指引 / 出处） */
  const ND = (typeof window !== "undefined" && window.NEWS_DATA) ? window.NEWS_DATA : null;
  if(ND && ND.items){
    const merge=function(r){ const n=ND.items[r.t]; if(!n) return;
      r.nres=n.res||[]; r.nguide=n.guide||[]; r.nhead=n.headline||""; r.nurl=n.url||"";
      r.ndate=n.date||""; r.nsrc=n.src||""; r.nok=!!n.ok; r.nnote=n.note||""; };
    b.pre.rows.forEach(merge); b.post.rows.forEach(merge);
    const all=[].concat(b.pre.rows,b.post.rows);
    b.newsCover = { ok:all.filter(r=>r.nres&&r.nres.length).length, total:all.length };
  }

  /* 6. 覆盖标的的业绩发布日：强制跟踪 */
  if(Y.nextEarn){
    DATA.stocks.forEach(s=>{
      const c=CODE_OF[s.t]; if(!c) return;
      const arr=Y.nextEarn[c]; if(!arr||!arr.length) return;
      const today=DATA.meta.date;
      const future=arr.filter(d=>d>=today).sort();
      s.earn = s.earn || {};
      if(future.length){
        s.earn.next = future[0];
        s.earn.status = "covered";
        s.earn.srcNote = "下一财报日取自 Yahoo calendarEvents（"+future[0]+"），以公司公告为准";
      } else {
        s.earn.lastReport = arr[arr.length-1];
        s.earn.status = "reported";
        s.earn.next = "待公司公告";
        s.earn.srcNote = "最近一次披露 "+arr[arr.length-1]+"；下一日期尚未公布";
      }
    });
  }

  /* 7. 异动：财报驱动（日历）+ 池内标的收盘异动（行情），均为可验证数据 */
  if(Y.quotes){
    const nameOf=t=>{const x=DATA.stocks.find(s=>s.t===t);return x?x.n:t;};
    const secOf=t=>{const x=DATA.stocks.find(s=>s.t===t);return x?x.sec.split(" / ")[0]:"—";};
    const mv=[];
    (Y.earnings.pre||[]).forEach(r=>{
      const m=r.preChg; if(m==null||Math.abs(m)<r.threshold) return;
      mv.push({t:r.symbol,n:r.name,ses:"盘前",mv:m,drive:"财报",
        why:"一致预期 "+epsShow(r.est)+"，实际 "+(r.reported?epsShow(r.actual):"待披露")+
            (r.surprise!=null?"，"+(r.surprise>0?"好于":"低于")+"预期 "+Math.abs(r.surprise).toFixed(0)+"%":"")+
            "；盘前 "+pct(m,1)});
    });
    (Y.earnings.post||[]).forEach(r=>{
      const m=r.postChg!=null?r.postChg:r.preChg; if(m==null||Math.abs(m)<r.threshold) return;
      mv.push({t:r.symbol,n:r.name,ses:"盘后",mv:m,drive:"财报",
        why:"实际 EPS "+epsShow(r.actual)+"，预期 "+epsShow(r.est)+
            (r.surprise!=null?"，"+(r.surprise>0?"好于":"低于")+"预期 "+Math.abs(r.surprise).toFixed(0)+"%":"")});
    });
    Object.keys(CODE_OF).forEach(k=>{
      const q=Y.quotes[k]; if(!q||q.chg==null) return;
      if(Math.abs(q.chg)>=2 && !mv.some(x=>x.t===k))
        mv.push({t:k,n:nameOf(k),ses:"收盘",mv:q.chg,drive:"非财报",unknown:true,
          note:"未匹配到公告、评级变动或行业消息；按“原因未知”处理，待盘后核对大宗与内部人交易"});
    });
    mv.sort((a,b)=>Math.abs(b.mv)-Math.abs(a.mv));
    b.movers={updated:FEED.lastSync, rows:mv.slice(0,10)};

    /* 52 周高点距离：池内标的（历史新高判定需全市场历史数据，暂不提供） */
    const h52=[];
    Object.keys(CODE_OF).forEach(k=>{
      const q=Y.quotes[k]; if(!q||!q.w52h||!q.price) return;
      h52.push({t:k,n:nameOf(k),px:"$"+q.price.toFixed(2),mv:q.chg,sec:secOf(k),
        dist:(q.price/q.w52h-1)*100, hi:q.w52h});
    });
    h52.sort((x,y)=>y.dist-x.dist);
    DATA.moversH52 = h52.filter(x=>x.dist>=-3);
    DATA.moversHall = h52.slice(-5).reverse();

    /* 盘前 / 盘后异动：**全市场扫描**（live-extra.movers，约 4000 只 ≥1 亿美元市值）
       分两类：财报/指引驱动（earn=true，进 ① 业绩表）与非财报驱动（进 ② ，需归因）。 */
    const MV_MIN = 4;
    const mvNewsOf = (k) => {
      const N = (typeof window !== "undefined" && window.NEWS_DATA) ? window.NEWS_DATA : null;
      return (N && N.moversNews && N.moversNews[k]) || null;
    };
    const shape = (x, ses) => {
      const n = mvNewsOf(x.sym);
      return {
        t: x.sym, n: x.name, sec: x.sec, track: x.track || "", earn: !!x.earn,
        mv: (x[ses] != null ? x[ses] : x.mv),
        px: (ses === "pre" ? x.prePx : x.postPx) != null ? (ses === "pre" ? x.prePx : x.postPx) : x.px,
        base: x.px,
        news: (n && n.ok) ? { title: n.title, sum: n.summary, t: n.t, src: n.src, cause: !!n.cause, mismatch: !!n.mismatch, en: !!n.en } : null,
        note: (n && !n.ok) ? n.note : null,
      };
    };
    if (Y.movers) {
      const pick = (ses) => (Y.movers[ses] || [])
        .filter(x => Math.abs((x[ses] != null ? x[ses] : x.mv) || 0) >= MV_MIN)
        .map(x => shape(x, ses))
        .sort((a, b) => Math.abs(b.mv) - Math.abs(a.mv));
      const allPre = pick("pre"), allPost = pick("post");
      /* ② 只留非财报驱动；财报驱动的交给 ① 表（详表 + 追加简表） */
      DATA.moversPre = allPre.filter(x => !x.earn);
      DATA.moversPost = allPost.filter(x => !x.earn);
      DATA.earnMvPre = allPre.filter(x => x.earn);
      DATA.earnMvPost = allPost.filter(x => x.earn);
      DATA.moversPool = Y.movers.pool || 0;
      DATA.moversUniverse = Y.movers.universe || 0;
      DATA.moversDate = Y.movers.date || "";
      DATA.moversPreDate = Y.movers.preDate || Y.movers.date || "";
      DATA.moversPostDate = Y.movers.postDate || Y.movers.closeDate || Y.movers.date || "";
      DATA.moversHist = Y.movers.history || [];
      DATA.moversPostLog = !!Y.movers.postFromLog;
      DATA.moversPreLog = !!Y.movers.preFromLog;
      DATA.earnPreTotal = Y.movers.preTotal || 0;
      DATA.earnPostTotal = Y.movers.postTotal || 0;
    } else {
      /* 旧版 live-extra（无 movers 字段）兜底：退回只看研究标的 */
      const w = (typeof window !== "undefined" && window.WIND_LIVE) ? window.WIND_LIVE : null;
      const preList = (Y.earnings.pre || []).map(r => r.symbol);
      const postList = (Y.earnings.post || []).map(r => r.symbol);
      DATA.moversPre = []; DATA.moversPost = [];
      if (w && w.stocks) {
        Object.keys(CODE_OF).forEach(k => {
          const q = w.stocks[CODE_OF[k]]; if (!q) return;
          if (q.pre != null && Math.abs(q.pre) >= MV_MIN && !preList.includes(k))
            DATA.moversPre.push({ t: k, n: nameOf(k), mv: q.pre, news: null, note: null, earn: false });
          if (q.post != null && Math.abs(q.post) >= MV_MIN && !postList.includes(k))
            DATA.moversPost.push({ t: k, n: nameOf(k), mv: q.post, news: null, note: null, earn: false });
        });
        DATA.moversPre.sort((a, b) => Math.abs(b.mv) - Math.abs(a.mv));
        DATA.moversPost.sort((a, b) => Math.abs(b.mv) - Math.abs(a.mv));
      }
    }
  }

  /* 8. 创新高滚动日志 + 赛道代表标的池 */
  DATA.highs = Y.highs || null;
  DATA.earnBeat = Y.earnBeat || null;
  if(Y.tracks && DATA.tracks) DATA.tracks.forEach(t=>{ if(Y.tracks[t.id]) t.symsLive=Y.tracks[t.id]; });

  /* 9. 市场正在交易什么：客观观测（全部由可复核数据推导，每次更新重算） */
  try{
    const W2=(typeof window!=="undefined"&&window.WIND_LIVE)?window.WIND_LIVE:null;
    const idx=W2&&W2.indices?W2.indices:null, cr=W2&&W2.cross?W2.cross:null;
    const spx=idx&&idx["SPX.GI"], ndx=idx&&idx["NDX.GI"], vix=idx&&idx["VIX.GI"], ust=cr&&cr["UST10Y"];
    const obs=[];
    if(spx) obs.push("<b>市场行为</b>：标普当日 "+pct(spx.chg,2)+"、20 日 "+pct(spx.d20,1)+"；纳指 100 20 日 "+(ndx?pct(ndx.d20,1):"—")+"——当日方向与 20 日结构分开读，别混。");
    if(Y.sectors){
      const arr=Object.values(Y.sectors).sort((a,b)=>b.chg-a.chg);
      const up=arr.filter(x=>x.chg>0).length;
      obs.push("<b>板块涨幅</b>：领涨 "+arr[0].cn+" "+pct(arr[0].chg,1)+(arr[1]?" / "+arr[1].cn+" "+pct(arr[1].chg,1):"")+"；领跌 "+arr[arr.length-1].cn+" "+pct(arr[arr.length-1].chg,1)+"；"+up+"/11 上涨"+(up>=8?"——普涨。":(up<=3?"——普跌。":"——分化，方向要看结构。")));
      const d20s=arr.slice().sort((a,b)=>b.d20-a.d20);
      obs.push("<b>20 日主线</b>：最强 "+d20s[0].cn+" "+pct(d20s[0].d20,1)+"，最弱 "+d20s[d20s.length-1].cn+" "+pct(d20s[d20s.length-1].d20,1)+"——资金的真实方向藏在 20 日，不在当日。");
    }
    if(Y.spxVol&&Y.spxVol.avg20) obs.push("<b>资金 / 量能</b>：标普量比 "+(Y.spxVol.ratio*100).toFixed(0)+"%"+(Y.spxVol.ratio>1.1?"（放量）":(Y.spxVol.ratio<0.9?"（缩量）":"（中性）"))+"——当日涨跌有无成交确认，看这里。");
    if(Y.breadth&&Y.breadth.rel20!=null) obs.push("<b>广度</b>：等权 RSP 20 日 "+pct(Y.breadth.rsp20,1)+" vs 市值加权 SPY "+pct(Y.breadth.spy20,1)+"——"+(Y.breadth.rel20>0?"跌的是大票不是全市场，非系统性。":"涨靠少数权重拉动，广度在恶化。"));
    if(vix) obs.push("<b>波动</b>：VIX "+vix.level.toFixed(1)+"（日 "+pct(vix.chg,1)+"）——保护成本与恐慌度的读数。");
    if(ust) obs.push("<b>利率 / 流动性</b>：10Y "+ust.value.toFixed(3)+"%（日 "+(ust.dbp1>0?"+":"")+ust.dbp1+"bp）——分母端松紧的直接读数。");
    DATA.strategy.observing=obs;
  }catch(e){}

  /* 7. 双端点校验（v8 chart 收盘 vs v7 quote 现价） */
  if(Y.crosscheck){
    DATA.meta.check = Y.crosscheck.okCount+" / "+Y.crosscheck.total;
    DATA.meta.checkAt = FEED.lastSync;
  }
  DATA.meta.extraAt = FEED.lastSync;
}

const esc = s => String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
const sgn = v => v>0?"up":(v<0?"down":"flat");
const pct = (v,d) => (v==null?"—":(v>0?"+":"")+Number(v).toFixed(d==null?2:d)+"%");
const chg = (v,unit) => unit==="bp"
  ? '<span class="chg '+sgn(v)+'">'+(v>0?"+":"")+Math.round(v)+'bp</span>'
  : '<span class="chg '+sgn(v)+'">'+pct(v)+'</span>';

function feedBar(){
  if(!FEED.connected) return '<div class="feedbar"><span class="ic">!</span><span><b>数据源未连接</b>　当前行情、业绩、指数数值均为<b>占位示例</b>，仅用于验证版式与工作流，<b>不可用于交易决策</b>。运行 <b>node sync-core.mjs</b> 后刷新即接入 Yahoo Finance 实时数据。</span></div>';
  const m=DATA.meta;
  const sg=staleGuard(m.syncedISO);
  const warn=!!(sg&&sg.stale);
  const ACT="https://github.com/modomo-modomo/investment-desk/actions/workflows/daily.yml";
  const line1 = warn
    ? '<b>数据可能未更新</b>　上次成功同步 北京时间 <b>'+(FEED.lastSyncBJ||"—")+'</b>（美东 <b>'+(FEED.lastSyncET||"—")+'</b>）'
      +'，距本场「<b>'+sg.lastLabel+'</b>」已过 <b>'+sg.ageH.toFixed(1)+'</b> 小时'
      +'　·　美股收盘日 <b>'+asOfFmt(m.dataAsOf)+'</b>　·　下一场 <b>'+(m.nextPT||"—")+'</b>'
    : '<b>数据已更新</b>　北京时间 <b>'+(FEED.lastSyncBJ||"—")+'</b>　·　美东时间 <b>'+(FEED.lastSyncET||"—")+'</b>'
      +'　·　美股收盘日 <b>'+asOfFmt(m.dataAsOf)+'</b>'
      +'　·　下一场更新 <b>'+(m.nextPT||"—")+'</b>';
  const line2 = warn
    ? '定时抓取可能延迟或失败，页面显示的仍是上一场的数值。<a href="'+ACT+'" target="_blank" rel="noopener">到 Actions 手动触发一次</a>。'
      +'更新节奏：每个交易日 20:30 与次日 07:00 各抓一次，一次同步刷新全站。'
    : '更新节奏：每个交易日 <b>20:30</b> 与次日 <b>07:00</b> 各抓一次。<b>一次同步会刷新全站所有模块</b>，两场所见数值只差在抓取时点的行情与业绩新鲜度，不存在“20:30 只更盘前、07:00 只更盘后”的分区。· 数据源 Yahoo Finance';
  return '<div class="feedbar '+(warn?"warn":"ok")+'"><span class="ic">'+(warn?"!":"✓")+'</span><span>'
    + line1
    +'<span class="tiny" style="display:block;margin-top:2px;'+(warn?"color:#8a5a12":"color:#5c8f74")+'">'+line2+'</span>'
    +'</span></div>';
}
function modStamp(){
  /* 每个模块都显示本模块的更新日期与时间：一次同步刷新全站，所以统一取本次同步时刻；
     未接入数据时明确写“未同步”，不显示假时间。 */
  const t = FEED.lastSync || "";
  return '<span class="upd modstamp">更新 <b>'+(t||"未同步")+'</b></span>';
}
function secHead(num,title,sub,right){
  return '<div class="sec-head"><span class="sec-num">'+num+'</span><span class="sec-title">'+title+'</span>'+
    (sub?'<span class="sec-sub">'+sub+'</span>':'')+'<span class="right">'+(right||'')+modStamp()+'</span></div>';
}
function impDot(imp){ return '<span class="imp '+imp+'"></span>'; }

/* ---- 业绩表（盘前 / 盘后共用）---- */
function earnTable(blk, ses){
  const rows = (blk && blk.rows) || [];
  const isPre = ses==="pre";
  if(!rows.length){
    return '<div class="card empty">未取到'+(isPre?"当日盘前":"前一交易日盘后")+'的披露记录，'+
      '请先运行同步脚本；<b>本表不放示例数据</b>。</div>';
  }
  const hit = rows.filter(r=>r.hit).length;
  const withNews = rows.filter(r=>(r.nres&&r.nres.length)||r.nhead).length;
  let h='<div class="card" style="padding:10px 13px;margin-bottom:8px;display:flex;gap:14px;flex-wrap:wrap;align-items:center;font-size:11.5px;color:var(--text-2)">'+
    '<span>日历日期 <b class="num">'+(blk.date||"—")+'</b></span>'+
    '<span>该场次披露 <b class="num">'+(blk.total||rows.length)+'</b> 家，按市值列前 '+rows.length+' 家</span>'+
    '<span>越过阈值 <b class="num '+(hit?'up':'')+'">'+hit+'</b> 家</span>'+
    '<span>业绩内容已抓取 <b class="num">'+withNews+'/'+rows.length+'</b> 家</span>'+
    (blk.cached?'<span class="chip-src">名单取首见快照</span>':'')+
    (blk.updated?'<span style="margin-left:auto" class="tiny muted">同步 '+blk.updated+'</span>':'')+
    '</div>';

  h+='<div class="card tbl-wrap"><table class="tbl"><thead><tr>'+
     '<th style="width:132px">公司</th>'+
     '<th style="width:80px">行业</th>'+
     '<th style="width:22%">业绩要点（实际 vs 预期）</th>'+
     '<th style="width:20%">指引 / 关键表述</th>'+
     '<th class="num" style="width:60px">'+(isPre?"盘前":"盘后")+'</th>'+
     '<th style="width:92px">'+(isPre?"开盘跳空 → 收盘":"次日盘前接力")+'</th>'+
     '<th>解读</th></tr></thead><tbody>';

  rows.forEach(r=>{
    const yoy = (r.est!=null && r.last!=null && r.last!==0) ? ((r.est-r.last)/Math.abs(r.last))*100 : null;
    const sur = r.surprise;

    /* 业绩要点：先给可核对的实际 vs 预期，再放新闻原文要点 */
    let cellRes = '<div class="num" style="font-size:11.5px">EPS <b>'+epsShow(r.actual!=null?r.actual:r.est)+'</b>'+
      (r.reported && r.est!=null ? ' <span class="tiny muted">/ 预期 '+epsShow(r.est)+'</span>' : ' <span class="tiny muted">（预期）</span>')+
      (sur==null?'':' '+(Math.abs(sur)<0.5?'<span class="tiny muted">符合预期</span>':'<span class="tiny '+(sur>0?"up":"down")+'">'+(sur>0?"好于":"低于")+' '+Math.abs(sur).toFixed(1)+'%</span>'))+'</div>';
    if(r.nres && r.nres.length){
      cellRes += r.nres.slice(0,3).map(x=>'<div class="read" style="font-size:11px;margin-top:2px">· '+x+'</div>').join("");
    } else if(r.nhead){
      cellRes += '<div class="read" style="font-size:11px;margin-top:3px">'+esc(r.nhead)+
        ' <span class="chip-src">报道标题</span></div>';
    } else if(!r.reported){
      cellRes += '<div class="tiny muted" style="margin-top:2px">同比 '+ (yoy==null?"—":pct(yoy,1)) +'（去年 '+epsShow(r.last)+'）</div>';
    }
    if(r.nurl){
      cellRes += '<div class="tiny" style="margin-top:3px"><a href="'+r.nurl+'" target="_blank" rel="noopener" style="color:var(--accent-2);text-decoration:none">'+
        (r.nsrc||"出处")+(r.ndate?" · "+r.ndate:"")+'</a></div>';
    } else if(r.nnote){
      cellRes += '<div class="tiny muted" style="margin-top:3px">'+r.nnote+'</div>';
    }

    /* 指引 */
    let cellGuide;
    if(r.nguide && r.nguide.length){
      cellGuide = r.nguide.slice(0,3).map(x=>'<div class="read" style="font-size:11px">· '+x+'</div>').join("");
    } else if(r.nok){
      cellGuide = '<span class="pending">本次报道未含指引表述</span>';
    } else {
      cellGuide = '<span class="pending">指引原文待抓取</span>'+
        (r.nnote?'<div class="tiny muted" style="margin-top:2px">'+r.nnote+'</div>':'');
    }

    h+='<tr>'+
      '<td><div class="tk">'+r.t+(r.pooled?' <span class="tag blue" style="font-size:9px">池内</span>':'')+'</div>'+
      '<div class="tk-sub">'+r.n+' · '+r.tier+' '+r.mcap+'</div>'+
      '<div class="tiny muted">'+r.q+'</div></td>'+
      '<td><span class="tag">'+esc(r.ind||"—")+'</span></td>'+
      '<td>'+cellRes+'</td>'+
      '<td class="read" style="font-size:11px">'+cellGuide+'</td>'+
      '<td class="num">'+(r.mv==null?'<span class="pending">无报价</span>':'<span class="mv '+sgn(r.mv)+'">'+pct(r.mv,1)+'</span>')+'</td>'+
      '<td>'+(isPre
          ? '<span class="pending">07:00 回填</span><div class="tiny muted" style="margin-top:3px">盘前价 '+pct(r.pre,1)+'</div>'
          : (r.pre!=null ? '<div class="mv '+sgn(r.pre)+'">'+pct(r.pre,1)+'</div><div class="tiny muted">今日盘前</div>'
                         : '<span class="pending">待报价</span>'))+
      '</td>'+
      '<td class="read" style="font-size:11px">'+earnRead(r)+'</td>'+
      '<td class="read" style="font-size:11px;line-height:1.6">'+esc(r.zh||"—")+'</td></tr>';
  });
  h+='</tbody></table></div>';
  return h;
}

/* ---- 三大市场收盘速览（A股 / 港股 / 美股 同日全部结束后的收盘总结）---- */
function mktClose(){
  const W=(typeof window!=="undefined"&&window.WIND_LIVE)||null;
  if(!W||!W.indices) return '';
  const I=W.indices;
  const g=(k)=>I[k]||null;
  const dstr=(x)=>{ const s=(x&&x.date)||""; return s.length===8 ? s.slice(0,4)+"-"+s.slice(4,6)+"-"+s.slice(6,8) : "—"; };
  const row=(name,x)=>{
    if(!x) return '<div class="mkt-row"><span class="nm">'+name+'</span><span class="lv">—</span><span class="c1">—</span><span class="c20">—</span></div>';
    const dec=(x.level>=10000?0:(x.level>=100?2:2));
    return '<div class="mkt-row"><span class="nm">'+name+'</span>'+
      '<span class="lv num">'+fmtNum(x.level,dec)+'</span>'+
      '<span class="c1 '+sgn(x.chg)+'">'+pct(x.chg,2)+'</span>'+
      '<span class="c20">'+pct(x.d20,1)+'</span></div>';
  };
  const spread=(label,x,base)=>'<div class="mkt-row"><span class="nm">'+label+'</span>'+
    '<span class="lv num">'+((x&&base&&x.d20!=null&&base.d20!=null)?pct(x.d20-base.d20,1):"—")+'</span>'+
    '<span class="c1"></span><span class="c20"></span></div>';
  const spx=g("SPX.GI"), ix=g("IXIC.GI"), ndx=g("NDX.GI"), dji=g("DJI.GI"), rut=g("RUT.GI"), sox=g("SOX.GI"), vix=g("VIX.GI");
  const hsi=g("HSI.HI"), hstech=g("HSTECH.HI"), hshci=g("HSHCI.HI"), hshki=g("HSHKI.HI"), hshdy=g("HSSCHKY.HI");
  const sh=g("000001.SH"), kc50=g("000688.SH"), kc100=g("000698.SH"), cyb=g("399006.SZ");
  const hs300=g("000300.SH"), zz500=g("000905.SH"), zz1000=g("000852.SH"), zz2000=g("932000.SH"), bz50=g("BSE50.BJ");
  const n225=g("N225.GI"), ks=g("KS11.GI"), dax=g("GDAXI.GI"), ftse=g("FTSE.GI");
  const usDate=dstr(spx), cnDate=dstr(sh), hkDate=dstr(hsi);
  const gap=(a,b)=> (a&&b&&a.d20!=null&&b.d20!=null) ? (a.d20-b.d20) : null;
  const gapSoxDji=gap(sox,dji), gapHkCn=gap(hsi,sh);
  /* 港五档里当日最强的一档（用于「最抗跌/最强」的表述，避免写死高股息率） */
  const hshkBest=[["tech","恒生科技",hstech],["hci","恒生医疗保健",hshci],["hk","恒生港股通",hshki],["dy","恒生港股通高股息率",hshdy]]
    .filter(x=>x[2]&&x[2].chg!=null)
    .sort((a,b)=>b[2].chg-a[2].chg)
    .map(x=>({k:x[0],nm:x[1],chg:x[2].chg}))[0] || null;

  let h='<div class="mkt3">';
  /* 美股 */
  h+='<div class="mkt-card"><div class="mh"><span class="tag blue">美股</span><span class="nm">收盘总结</span><span class="dt">'+usDate+' · 美东 16:00</span></div>';
  h+=row("标普 500",spx)+row("纳斯达克综合",ix)+row("纳斯达克 100",ndx)+row("道琼斯",dji)+row("罗素 2000",rut)+row("费城半导体",sox)+row("VIX",vix);
  h+='<div class="mkt-foot">'+
     (spx? ('标普 <b>'+pct(spx.chg,2)+'</b>、纳指 <b>'+pct(ix&&ix.chg,2)+'</b>、道指 <b>'+pct(dji&&dji.chg,2)+'</b>，'+
       (vix? 'VIX <b>'+pct(vix.chg,2)+'</b> 至 '+fmtNum(vix.level,2)+'——'+(vix.chg>0?'指数与波动率<b>反向</b>，说明分歧在放大，是换手不是撤退。':'波动率同步回落，避险需求在下降，跌更像获利了结。'):'') )
      : '指数数据待接入。')+
     (rut&&spx? ' 20 日维度：<b>罗素 2000 '+pct(rut.d20,1)+'</b> vs <b>标普 '+pct(spx.d20,1)+'</b>——'+(rut.d20<spx.d20?'<b>小盘跑输，风险偏好没有向广度扩散</b>。':'小盘占优，广度在改善。') : '')+
     (gapSoxDji!=null && gapSoxDji<-3 ? ' 20 日费半相对道指 <b>'+pct(gapSoxDji,1)+'</b>，<b>AI 链杀估值、价值端仍是正收益</b>。' : '')+
     '</div></div>';
  /* 港股 */
  h+='<div class="mkt-card"><div class="mh"><span class="tag violet">中国香港</span><span class="nm">收盘总结</span><span class="dt">'+hkDate+' · 16:00</span></div>';
  h+=row("恒生指数",hsi)+row("恒生科技",hstech)+row("恒生医疗保健",hshci)+row("恒生港股通",hshki)+row("恒生港股通高股息率",hshdy);
  h+=spread("恒生指数 相对纳指 100（20 日）",hsi,ndx);
  h+='<div class="mkt-foot">'+
     (hsi? '恒生 <b>'+pct(hsi.chg,2)+'</b>，20 日 <b>'+pct(hsi.d20,1)+'</b>。' : '数据待接入。')+
     (hstech&&hsi? ' 结构：<b>恒生科技 '+pct(hstech.chg,2)+'</b> vs 恒生 '+pct(hsi.chg,2)+'，'+(hstech.chg<hsi.chg?'<b>成长端跌得更重</b>':'成长端更强')+'。' : '')+
     (hshkBest? ' 其余四档里 <b>'+hshkBest.nm+' '+pct(hshkBest.chg,2)+'</b> 最'+(hshkBest.chg<0?'抗跌':'强')+'，'+
        (hshkBest.k==="dy"?'<b>防御姿态而非风险偏好回升</b>。':'<b>资金在往这个方向躲</b>。') : '')+
     (hshci? ' 医疗保健 <b>'+pct(hshci.chg,2)+'</b>'+
        (hsi? '，'+(hshci.chg<hsi.chg?'<b>跌幅大于恒指，创新药在杀估值</b>':'<b>跌幅小于恒指，防御属性在起作用</b>') : '')+'。' : '')+
     '</div></div>';
  /* A股 */
  h+='<div class="mkt-card"><div class="mh"><span class="tag amber">中国内地</span><span class="nm">收盘总结</span><span class="dt">'+cnDate+' · 15:00</span></div>';
  h+=row("上证指数",sh)+row("沪深 300",hs300)+row("中证 500",zz500)+row("中证 1000",zz1000)+row("中证 2000",zz2000);
  h+=row("创业板指",cyb)+row("科创 50",kc50)+row("科创 100",kc100)+row("北证 50",bz50);
  h+='<div class="mkt-foot">'+
     (sh? '上证 <b>'+pct(sh.chg,2)+'</b>，20 日 <b>'+pct(sh.d20,1)+'</b>。'+
       (gapHkCn!=null ? '港股−A 股 20 日差 <b>'+pct(gapHkCn,1)+'</b>，'+(gapHkCn>0?'<b>港股中期强于 A 股</b>':'<b>A 股中期强于港股</b>')+'。' : '') : '数据待接入。')+
     (hs300&&zz2000? ' 大小盘：<b>沪深 300 '+pct(hs300.chg,2)+'</b> vs <b>中证 2000 '+pct(zz2000.chg,2)+'</b>，'+(zz2000.chg<hs300.chg?'<b>小盘跌得更重，资金退回权重</b>。':'小盘更强，投机资金还在。') : '')+
     (kc50&&cyb&&sh? ' 成长端 <b>科创 50 '+pct(kc50.chg,2)+'</b>、<b>创业板 '+pct(cyb.chg,2)+'</b> vs 上证 '+pct(sh.chg,2)+'——'+
        ((kc50.chg<sh.chg||cyb.chg<sh.chg)?'<b>跌幅大于主板，高贝塔先跌</b>。':'<b>成长端反而更强，资金在往弹性方向走</b>。') : '')+
     '</div></div>';
  h+='</div>';
  /* 其它市场一行 */
  const others=[[ "日经 225",n225],["KOSPI",ks],["德国 DAX",dax],["英国富时 100",ftse]].filter(x=>x[1]);
  if(others.length){
    h+='<div class="card" style="padding:10px 14px;margin-bottom:14px;font-size:11.5px;color:var(--text-2);line-height:1.8">'+
       '<b style="color:var(--text)">其它主要市场</b>　'+others.map(x=>x[0]+' '+fmtNum(x[1].level,2)+' <b class="'+sgn(x[1].chg)+'">'+pct(x[1].chg,2)+'</b>（20 日 '+pct(x[1].d20,1)+'）').join('　·　')+
       '　—— <b>今天涨的是“没有 AI 权重”的市场</b>，这本身是对 AI 交易拥挤度的一次定价。</div>';
  }
  h+='<div class="tiny muted" style="margin:-6px 0 14px;padding-left:2px">口径：三个市场的<b>同日收盘</b>（美股为上一交易日 16:00 美东收盘价，港股 16:00、A 股 15:00 北京时间）。当日 = 相对前一交易日收盘；20 日 = 相对 20 个交易日前收盘。三大市场至此<b>全部结束</b>，本模块做的是<b>收盘总结</b>，不是盘后业绩摘要。'+
     ((usDate&&cnDate&&usDate!==cnDate)?'　<b>注意</b>：A 股/港股已收 '+cnDate+'，美股最新收盘为 '+usDate+'，两者<b>不是同一交易日</b>（美股当日场次尚未收盘），跨市场对比时别混。':'')+
     '</div>';
  return h;
}

/* ---------- 业绩超预期存档（每日资讯 08） ----------
   数据来自 live-extra.earnBeat：按自然季度归档，每条含公布日/场次/公布后涨幅/市值/EPS 超预期/行业/简介。
   页面只负责渲染 + 排序 + 季度切换。 */
/* Nasdaq 的 Industry 字段是英文，落盘时保留原值（便于核对），渲染时转中文 */
const SEC_ZH = {
  "Semiconductors":"半导体","Semiconductor Equipment & Materials":"半导体设备","EDP Services":"软件与数据服务",
  "Computer Manufacturing":"计算机硬件","Computer Software: Prepackaged Software":"基础软件","Computer Software: Programming, Data Processing":"数据与算力服务",
  "Industrial Machinery/Components":"工业机械","Electrical Products":"电气设备","Building Products":"建材","Engineering & Construction":"工程建筑",
  "Biotechnology: Biological Products (No Diagnostic Substances)":"生物制品","Biotechnology: Pharmaceutical Preparations":"创新药","Medical/Dental Instruments":"医疗器械","Medical Specialities":"医疗服务",
  "Broadcasting":"传媒/广播","Cable & Other Payroll":"有线电视","Telecommunications Equipment":"通信设备","Telecommunications":"电信运营",
  "Major Banks":"大型银行","Commercial Banks":"商业银行","Finance: Consumer Services":"消费金融","Investment Managers":"资产管理","Property-Casualty Insurers":"财产险",
  "Oil & Gas Production":"油气开采","Oilfield Services/Equipment":"油服设备","Electric Utilities: Central":"电力公用","Natural Gas Distribution":"燃气公用",
  "Retail: Specialty":"专业零售","Retail: Food Chains":"食品零售","Restaurants":"餐饮","Apparel":"服装","Package Goods/Cosmetics":"日化",
  "Aerospace":"航空航天","Military/Government/Technical":"国防军工","Auto Manufacturing":"汽车整车","Metal Fabrications":"金属加工","Mining & Quarrying of Nonmetallic Minerals (No Fuels)":"非金属矿",
  "Real Estate":"房地产","Transportation":"交通运输","Air Freight/Delivery Services":"航空货运","Advertising":"广告营销","Services-Misc. Amusement & Recreation":"休闲娱乐",
};
const secZh = (s) => SEC_ZH[s] || s || "—";
function ebSection(){
  return '<div class="sec">'+secHead("08","本季度业绩超预期股票存档",
      "纳入标准：财报公布后收盘涨幅 大市值 &gt;3% / 中型 &gt;5% / 小型 &gt;8%（盘前公布取当日收盘，盘后公布取次日收盘）· 按自然季度归档",
      "<span class='upd'>"+(((DATA.earnBeat&&DATA.earnBeat.total)||0))+" 条累计</span>"+
      (((DATA.earnBeat&&DATA.earnBeat.pending)||0)?("<span class='upd'>待确认 "+DATA.earnBeat.pending+" 条</span>"):""))+
    '<div id="eb-wrap">'+ebInner()+'</div></div>';
}
function ebInner(){
  const E=DATA.earnBeat;
  const QS=(E&&E.quarters)||[];
  if(!QS.length || !QS.some(q=>q.rows&&q.rows.length)){
    return '<div class="card" style="padding:12px 14px"><span class="tiny muted">存档自本次更新起开始积累：财报公布后达到门槛（大市值 &gt;3% / 中型 &gt;5% / 小型 &gt;8%）的股票会自动建档，按自然季度归档；下一轮 07:00 之后这里会出现第一批记录。</span></div>';
  }
  if(!EB_ST.q || !QS.some(q=>q.q===EB_ST.q)) EB_ST.q=QS[0].q;
  const cur=QS.find(q=>q.q===EB_ST.q)||QS[0];
  const rows=cur.rows.slice();
  const sk=EB_ST.sort;
  const asc=(a,b)=>{
    const k=sk.key;
    if(k==="mcap") return (a.mcap||0)-(b.mcap||0);
    if(k==="mcapAt") return (a.mcapAt||0)-(b.mcapAt||0);
    if(k==="chg") return (a.chg==null?-1e9:a.chg)-(b.chg==null?-1e9:b.chg);
    const sa=String(k==="sec"?secZh(a.sec):(a[k]||"")), sb=String(k==="sec"?secZh(b.sec):(b[k]||""));
    return sa>sb?1:sa<sb?-1:0;
  };
  rows.sort((a,b)=>asc(a,b)*-sk.dir);
  const arrow=(k)=> sk.key===k ? (sk.dir>0?" ▾":" ▴") : "";
  const th=(k,label,w)=>'<th class="num'+(w?' style="width:'+w+';cursor:pointer"':' style="cursor:pointer"')+'" data-ebs="'+k+'" title="点击排序">'+label+arrow(k)+'</th>';

  /* 归纳 / 分析解读 */
  const n=rows.length, fresh=rows.filter(x=>x.isNew).length;
  const bigN=rows.filter(x=>x.size==="大市值").length, midN=rows.filter(x=>x.size==="中型").length, smN=rows.filter(x=>x.size==="小型").length;
  const withChg=rows.filter(x=>x.chg!=null);
  const avg=withChg.length?withChg.reduce((s,x)=>s+x.chg,0)/withChg.length:null;
  const best=withChg.slice().sort((a,b)=>b.chg-a.chg)[0];
  const secE=Object.entries(rows.reduce((m,x)=>{const k=secZh(x.sec);m[k]=(m[k]||0)+1;return m;},{})).sort((a,b)=>b[1]-a[1]);
  const topShare=secE.length&&n?Math.round(secE[0][1]/n*100):0;
  const beatN=rows.filter(x=>x.surp!=null&&x.surp>0).length;

  let h='<div class="filters" style="margin:0 0 10px">';
  QS.forEach(q=>{ h+='<button class="fchip'+(q.q===EB_ST.q?' on':'')+'" data-ebq="'+q.q+'">'+q.q+' · '+((q.rows||[]).length)+' 条</button>'; });
  h+='</div>';

  const pendN=n-withChg.length;
  const preN=rows.filter(x=>x.sess==="pre").length, postN=n-preN;
  h+='<div class="card" style="padding:14px 16px;margin-bottom:10px"><b style="font-size:12px">当季业绩超预期归纳 · 分析解读</b><div class="read" style="margin-top:7px;line-height:1.85">';
  h+=cur.q+' 已存档 <b>'+n+'</b> 只'+((pendN===n&&n)?'<b>候选</b>（业绩已披露，涨幅等收盘定稿）':'业绩超预期后股价达标的公司');
  if(fresh) h+='（<span style="color:var(--up);font-weight:650">本轮新增 '+fresh+' 只，表中标红</span>）';
  h+='：大市值 <b>'+bigN+'</b>、中型 '+midN+'、小型 '+smN+'；'+
     '<b>盘前公布 '+preN+' 只</b>（当日收盘达标）、<b>盘后公布 '+postN+' 只</b>（次日收盘达标）；'+
     '归档准则只有一条：<b>业绩公布后对应场次收盘涨幅达到阈值</b>（大 3% / 中 5% / 小 8%），盘前盘后同一把尺。';
  if(avg!=null){
    h+='平均公布后涨幅 <b class="'+sgn(avg)+'">'+pct(avg,1)+'</b>'+
       (best?('，最强 <b>'+best.sym+' '+pct(best.chg,1)+'</b>'):'')+'。'+
       (pendN?(' 另有 <b>'+pendN+' 只</b>等对应场次收盘定稿，定稿后不达门槛的会撤档。'):'');
  }else{
    h+='<b>这一批都还没收盘</b>——涨跌幅要等对应场次（盘前看当日收盘、盘后看次日收盘）走完才定稿，表里先记「待收盘」，定稿后不达门槛的自动撤档。';
  }
  h+=(beatN?' 其中 <b>'+beatN+' 只</b> EPS 明确超一致预期':'（EPS 未超一致预期，属于<b>指引驱动</b>）')+'。<br>'+
     '行业分布：'+(secE.length?secE.slice(0,4).map(x=>'<b>'+esc(x[0])+'</b> '+x[1]+' 只').join('、'):'—')+'。'+
     (n<=2?' <b>样本还很少</b>，先当观察名单用，别据此判断行业景气。'
       : (topShare>=40? ' <b>集中在 '+esc(secE[0][0])+'（'+topShare+'%）</b>，说明这批超预期有<b>共同的产业线索</b>，值得沿产业链往上游/下游找补涨。'
         : ' 分散在多个行业，更像<b>普涨式超预期</b>（预期本身偏低），<b>持续性要看下一季指引</b>，不能当成单一赛道信号。'))+
     '<br><b>怎么用这份存档</b>：①对比「公布后涨幅」与「EPS 超预期幅度」——涨幅远超超预期幅度 = 指引/叙事在加分，容易回落；两者接近 = 定价理性，可跟；'+
     '②同一行业连续多季出现达标公司，才是<b>行业级景气</b>的证据；③市值越大、达标门槛越低（3%），所以大市值上榜不代表弹性大，<b>看的是确定性不是爆发力</b>。'+
     '</div></div>';

  h+='<div class="card tbl-wrap"><table class="tbl"><thead><tr>'+
     '<th style="width:160px">标的</th>'+th("d","公布日","96px")+'<th style="width:64px">场次</th>'+
     th("chg","公布后涨幅","100px")+th("mcap","公布日市值","100px")+th("mcapAt","公布后收盘市值","110px")+
     '<th style="width:24%">业绩 / 指引超预期</th>'+th("sec","行业","110px")+
     '<th style="width:26%">公司简介</th></tr></thead><tbody>';
  if(!n){
    h+='<tr><td colspan="9" class="empty">该季度暂无达标记录</td></tr>';
  }
  rows.forEach(x=>{
    const isNew=!!x.isNew;
    const c=x.chg;
    const surpTxt = (x.surp!=null)
      ? (x.surp>0
        ? '<b class="up">EPS 超预期 '+pct(x.surp,1)+'</b>'
        : '<b class="down">EPS 低于预期 '+pct(x.surp,1)+'</b>（指引/叙事驱动）')
      : '<span class="muted">EPS 超预期幅度待补</span>';

    h+='<tr'+(isNew?' class="isnew"':'')+'>'+
      '<td><div class="tk">'+x.sym+(isNew?' <span class="newflag">新</span>':'')+'</div><div class="tk-sub">'+esc(x.name||"")+'</div></td>'+
      '<td class="num" style="white-space:nowrap">'+x.d+'</td>'+
      '<td><span class="tag'+(x.sess==="pre"?" blue":" violet")+'">'+(x.sess==="pre"?"盘前":"盘后")+'</span></td>'+
      '<td class="num" style="font-weight:650">'+(c!=null?'<span class="chg '+sgn(c)+'">'+pct(c,1)+'</span>':'<span class="tiny muted">'+(x.sess==="pre"?"待当日收盘":"待次日收盘")+'</span>')+'</td>'+
      '<td class="num">'+fmtCap(x.mcap)+'<div class="tiny muted">'+x.size+'</div></td>'+
      '<td class="num">'+(x.mcapAt!=null?fmtCap(x.mcapAt):'<span class="tiny muted">待收盘</span>')+'</td>'+
      '<td class="read" style="font-size:11px;line-height:1.6">'+surpTxt+(numTxt?('<br>'+numTxt):'')+
        (x.guide&&x.guide.length?(''+x.guide.slice(0,2).map(g=>'<div class="tiny" style="margin-top:3px;color:#4a5a75;line-height:1.55">指引 · '+esc(String(g).slice(0,90))+'</div>').join('')):'<div class="tiny muted" style="margin-top:3px">指引待补（东财快讯未覆盖该公司本场披露）</div>')+'</td>'+
      '<td><span class="tag">'+esc(secZh(x.sec))+'</span></td>'+
      '<td class="read" style="font-size:11px;line-height:1.6">'+esc(x.desc||"—")+'</td></tr>';
  });
  h+='</tbody></table></div>';
  h+='<div class="tiny muted" style="margin-top:6px;padding-left:2px;line-height:1.75">口径：<b>公布后涨幅</b>——盘前公布取公布当日收盘涨幅（相对前一交易日收盘），盘后公布取<b>次日</b>收盘涨幅（相对公布日收盘），统一用日线收盘自算，不取盘中/盘后瞬时价；<b>公布日市值</b>为披露当日（收盘口径）市值，<b>公布后收盘市值</b>按公布后对应场次收盘价折算（= 公布日市值 × 收盘价 ÷ 建档时点价）；<b>指引</b>取东方财富 7×24 快讯中该公司披露同期（±1.5 天）的指引表述，随存档落盘供复盘，未覆盖的标「指引待补」；<b>场次</b>区分盘前/盘后；对应场次还没收盘的记「待当日收盘 / 待次日收盘」，下一轮自动补齐（补算后不达门槛的<b>撤档</b>）。覆盖当日全部披露公司中市值 ≥5 亿美元的前 40 家，按自然季度滚动保留最近 4 个季度。</div>';
  return h;
}

const gpuChartSvg = () => {
  const G = YF && YF.gpuRent;
  if (!G || !G.series) return "";
  const W = 640, H = 220, L = 40, R = 60, T = 14, B = 30;
  const mk = (arr) => arr.map(p => ({ d: p[0], v: p[1] }));
  const s1 = mk(G.series.h100), s2 = mk(G.series.h200), s3 = mk(G.series.b200);
  const all = s1.concat(s2, s3).map(p => p.v);
  const vmax = Math.ceil(Math.max(...all) + 0.5), vmin = Math.floor(Math.min(...all) - 0.5);
  const n = s1.length;
  const X = (i) => L + (W - L - R) * (i / (n - 1));
  const Yv = (v) => T + (H - T - B) * (1 - (v - vmin) / (vmax - vmin || 1));
  const path = (s) => s.map((p, i) => (i ? "L" : "M") + X(i).toFixed(1) + " " + Yv(p.v).toFixed(1)).join(" ");
  const last = (s) => s[n - 1];
  const grid = [];
  for (let v = Math.ceil(vmin); v <= vmax; v++) grid.push('<line x1="'+L+'" y1="'+Yv(v).toFixed(1)+'" x2="'+(W-R)+'" y2="'+Yv(v).toFixed(1)+'" stroke="#eef1f6"/><text x="'+(L-6)+'" y="'+(Yv(v)+3).toFixed(1)+'" text-anchor="end" font-size="9" fill="#98a6b8">'+v+'</text>');
  const ticks = [];
  const tickIdx = [0, Math.floor(n/3), Math.floor(2*n/3), n-1];
  tickIdx.forEach(i => ticks.push('<text x="'+X(i).toFixed(1)+'" y="'+(H-8)+'" text-anchor="middle" font-size="9" fill="#98a6b8">'+s1[i].d.slice(5,10).replace("-","/")+'</text>'));
  const dot = (s, c) => '<circle cx="'+X(n-1).toFixed(1)+'" cy="'+Yv(last(s).v).toFixed(1)+'" r="3.5" fill="'+c+'"/><text x="'+(X(n-1)+6)+'" y="'+(Yv(last(s).v)+3).toFixed(1)+'" font-size="9.5" font-weight="700" fill="'+c+'">$'+last(s).v+'</text>';
  const chg = G.latest && G.latest.chg30d ? G.latest.chg30d : {};
  return '<svg viewBox="0 0 '+W+' '+H+'" style="width:100%;max-width:620px;height:auto;display:block;margin:0 auto" font-family="inherit">'+
    grid.join("")+ticks.join("")+
    '<path d="'+path(s1)+'" fill="none" stroke="#3b82c4" stroke-width="1.6"/>'+
    '<path d="'+path(s2)+'" fill="none" stroke="#e8952f" stroke-width="1.6"/>'+
    '<path d="'+path(s3)+'" fill="none" stroke="#d2373a" stroke-width="2"/>'+
    dot(s1,"#3b82c4")+dot(s2,"#e8952f")+dot(s3,"#d2373a")+
    '<text x="'+L+'" y="'+(T-2)+'" font-size="10" fill="#5c6b7f">H100 <tspan fill="#3b82c4" font-weight="700">$'+last(s1).v+'</tspan>'+(chg.h100!=null?'（30D '+ (chg.h100>0?"+":"") +chg.h100+'%）':'')+
    '　H200 <tspan fill="#e8952f" font-weight="700">$'+last(s2).v+'</tspan>'+(chg.h200!=null?'（30D '+(chg.h200>0?"+":"")+chg.h200+'%）':'')+
    '　B200 <tspan fill="#d2373a" font-weight="700">$'+last(s3).v+'</tspan>'+(chg.b200!=null?'（30D '+(chg.b200>0?"+":"")+chg.b200+'%）':'')+'</text>'+
    '</svg>';
};
