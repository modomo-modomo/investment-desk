       dly.map(x=>'<div style="flex:1;min-width:0;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:2px" title="'+x.d+'：'+x.n+' 条（52 周新高 '+(x.n-x.a)+' · 历史新高 '+x.a+'）'+(x.sec?'｜最集中板块 '+esc(x.sec.k):'')+(x.trk?'｜最集中赛道 '+esc(x.trk.k):'')+'">'+
         '<span style="font-size:9px;color:var(--text-2);font-weight:650;line-height:1">'+x.n+'</span>'+
         '<div style="width:100%;max-width:34px;background:var(--accent-soft);border:1px solid #dbe4f3;border-bottom:0;border-radius:3px 3px 0 0;height:'+Math.max(4,Math.round(x.n/mx*52))+'px;position:relative;overflow:hidden">'+
           '<div style="position:absolute;left:0;right:0;bottom:0;height:'+(x.n?Math.round(x.a/x.n*100):0)+'%;background:var(--up);opacity:.9"></div></div>'+
         '<span class="tiny muted" style="font-size:8.5px;white-space:nowrap;line-height:1">'+x.d.slice(5)+'</span></div>').join('')+
       '</div></div>';
  } else {
    h+='<div class="card" style="padding:11px 14px;margin-bottom:10px"><span class="tiny muted">新高数量走势：目前只有 '+(H&&H.daily?H.daily.length:0)+' 个交易日记录，从第 2 个交易日起自动画图（脚本每日 07:00 累积）。</span></div>';
  }
  h+='<div class="card tbl-wrap" style="max-height:520px;overflow:auto"><table class="tbl"><thead><tr>'+
     '<th style="width:88px">记录日期</th><th style="width:150px">标的</th><th style="width:84px">类型</th>'+
     '<th style="width:52px">市场</th><th style="width:92px">板块</th><th style="width:124px">赛道</th>'+
     '<th class="num">股价</th><th class="num">当日</th><th class="num">20 日</th><th class="num">YTD</th></tr></thead><tbody>';
  if(!H || !H.log.length){
    h+='<tr><td colspan="10" class="empty">暂无创新高记录——检测每个交易日运行，标的当日最高价越过 52 周（或上市以来）最高价时自动写入并滚动积累</td></tr>';
  } else {
    const rows=H.log.slice().sort((a,b)=>String(b.d).localeCompare(String(a.d)) || (b.mcap||0)-(a.mcap||0) || a.sym.localeCompare(b.sym));
    rows.forEach(x=>{
      const isToday = H.date && x.d===H.date;
      h+='<tr'+(isToday?' class="isnew"':'')+'><td class="num" style="white-space:nowrap">'+(isToday?'<span style="color:var(--up);font-weight:650">'+x.d+'</span>':x.d)+'</td>'+
        '<td><div class="tk">'+x.sym+'</div><div class="tk-sub">'+esc(x.name||"")+'</div></td>'+
        '<td><span class="tag'+(x.type==="ath"?" red":(x.type==="mkt"?" blue":""))+'">'+(typeTxt[x.type]||x.type)+'</span></td>'+
        '<td>'+(mktTxt[x.market]||x.market||"")+'</td>'+
        '<td><span class="tag">'+esc(x.sec||"其它")+'</span></td>'+
        '<td>'+(x.track?'<span class="tag violet">'+esc(x.track)+'</span>':'<span class="tiny muted">—</span>')+'</td>'+
        '<td class="num" style="font-weight:600">'+(x.px!=null?"$"+Number(x.px).toFixed(2):"—")+'</td>'+
        '<td class="num">'+(x.chg!=null?'<span class="chg '+sgn(x.chg)+'">'+pct(x.chg,1)+'</span>':'—')+'</td>'+
        '<td class="num">'+(x.d20!=null?'<span class="chg '+sgn(x.d20)+'">'+pct(x.d20,1)+'</span>':'—')+'</td>'+
        '<td class="num">'+(x.ytd!=null?'<span class="chg '+sgn(x.ytd)+'">'+pct(x.ytd,1)+'</span>':'—')+'</td></tr>';
    });
  }
  h+='</tbody></table></div>';

  /* 新高跟踪：以当前价对比「首次创新高当日」的股价，衡量新高之后的持续度 */
  const follow=(H&&H.follow)?H.follow.slice():[];
  h+='<div class="card tbl-wrap" style="margin-top:10px"><table class="tbl"><thead><tr>'+
     '<th style="width:150px">标的</th><th style="width:92px">板块</th><th style="width:124px">赛道</th>'+
     '<th style="width:100px">首次新高日</th><th class="num">首日价</th><th class="num">现价</th>'+
     '<th class="num">累计涨跌幅</th><th class="num">新高次数</th><th style="width:100px">最近新高日</th></tr></thead><tbody>';
  if(!follow.length){
    h+='<tr><td colspan="9" class="empty">跟踪表自本轮起积累：每只标的首次进入新高榜当天的股价会被记下，之后每天用最新收盘价对比，看新高之后是延续还是回落</td></tr>';
  } else {
    const frows=follow.slice().sort((a,b)=>(b.chg==null?-1e9:b.chg)-(a.chg==null?-1e9:a.chg) || (b.n||0)-(a.n||0));
    const win=frows.filter(x=>x.chg>0).length, lose=frows.filter(x=>x.chg<0).length;
    frows.forEach(x=>{
      const c=x.chg;
      h+='<tr><td><div class="tk">'+x.sym+(x.everAth?' <span class="tag red" style="font-size:9px">ATH</span>':'')+'</div><div class="tk-sub">'+esc(x.name||"")+'</div></td>'+
        '<td><span class="tag">'+esc(x.sec||"其它")+'</span></td>'+
        '<td>'+(x.track?'<span class="tag violet">'+esc(x.track)+'</span>':'<span class="tiny muted">—</span>')+'</td>'+
        '<td class="num" style="white-space:nowrap">'+(x.firstD||"—")+'</td>'+
        '<td class="num">'+(x.firstPx!=null?"$"+Number(x.firstPx).toFixed(2):"—")+'</td>'+
        '<td class="num">'+(x.lastPx!=null?"$"+Number(x.lastPx).toFixed(2):"—")+'</td>'+
        '<td class="num" style="font-weight:650">'+(c!=null?'<span class="chg '+sgn(c)+'">'+pct(c,1)+'</span>':'—')+'</td>'+
        '<td class="num">'+(x.n||1)+'</td>'+
        '<td class="num" style="white-space:nowrap">'+(x.lastD||"—")+'</td></tr>';
    });
    h+='<tr><td colspan="9" class="tiny muted" style="padding:8px 10px">共 '+frows.length+' 只 · 累计上涨 '+win+' 只 / 下跌 '+lose+' 只 · 「累计涨跌幅」= 最新收盘价 ÷ 该标的首次进入新高榜当日收盘价 − 1（每只标的一行，长期滚动更新；新高次数 ≥2 说明动能有延续，只有 1 次的还在观察期）</td></tr>';
  }
  h+='</tbody></table></div></div>';

  /* ---------------- 04 / 05 周与月分析 ---------------- */
  const ana=(label,key)=>{
    const a=H&&H[key];
    let hh='<div class="sec">'+secHead(label[0],label[1],"滚动日志 "+label[2]+" 天窗口 · 市场 / 板块 / 赛道三维分布",
        a?"<span class='upd'>"+a.total+" 条</span><span class='upd'>"+(a.days||0)+" 个交易日</span>":"<span class='upd'>待接入</span>");
    hh+='<div class="grid g3" style="align-items:start">';
    const bar=(v,max,color)=>'<div class="gauge" style="margin:0"><span style="width:'+(max?Math.round(v/max*100):0)+'%;background:'+color+'"></span></div>';
    const blk=(title,entries,color)=>{
      let s='<div class="card" style="padding:14px 16px"><div class="tiny muted" style="margin-bottom:9px">'+title+'</div>';
      if(!entries.length){ s+='<div class="empty">窗口内无记录</div>'; }
      else{
        const max=entries[0][1];
        entries.slice(0,7).forEach(([k,v])=>{
          s+='<div style="display:grid;grid-template-columns:104px 1fr 34px;align-items:center;gap:9px;font-size:11.5px;margin-bottom:7px">'+
             '<span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+esc(k)+'</span>'+bar(v,max,color)+
             '<span class="num" style="text-align:right;font-weight:600">'+v+'</span></div>';
        });
      }
      return s+'</div>';
    };
    const ent=(o)=>Object.entries(o||{}).sort((x,y)=>y[1]-x[1]);
    hh+=blk("按赛道分布",ent(a&&a.byTrack),"#6d4aa8");
    hh+=blk("按板块分布",ent(a&&a.bySec),"#0d8a5f");
    hh+=blk("按市场分布",ent(a&&a.byMkt),"#1d3a6e");
    hh+='</div>';
    hh+='<div class="card" style="padding:13px 16px;margin-top:10px"><b style="font-size:12px">解读</b><div class="read" style="margin-top:6px">';
    if(!a||!a.total){ hh+='窗口内全市场与三大指数均未创新高——与当前“20 日调整 / 分化”的阶段一致。创新高记录是<b>趋势确认信号</b>：连续多周出现且赛道集中，才构成风格切换的证据。'; }
    else if(a.total<3){ hh+='窗口内创新高 '+a.total+' 条，零星出现。单点新高更多是个股行为，不具备板块含义；继续观察是否在同一赛道聚集。'; }
    else {
      const tk=ent(a.byTrack)[0], sc=ent(a.bySec)[0];
      hh+='窗口内创新高 <b>'+a.total+'</b> 条，赛道最集中在 <b>'+(tk?tk[0]+'（'+tk[1]+' 条）':'—')+'</b>，板块最集中在 <b>'+(sc?sc[0]+'（'+sc[1]+' 条）':'—')+'</b>。'+
        '新高聚集是资金共识最硬的证据——同一赛道连续数周出现新高，应把该赛道从“观察”上调为“增配”候选；新高散落在无关板块，则只是轮动噪音。';
    }
    hh+='</div></div></div>';
    return hh;
  };
  h+=ana(["04","周创新高分析","7"],'weekly');
  h+=ana(["05","月创新高分析","30"],'monthly');

  /* ---------------- 06 池内标的距 52 周高点 ---------------- */
  h+='<div class="sec">'+secHead("06","研究池距 52 周高点","距高点 3% 以内 · 辅助观察创新高的临近",
      "<span class='upd'>"+DATA.moversH52.length+" 只</span>");
  h+='<div class="card tbl-wrap"><table class="tbl"><thead><tr><th>标的</th><th class="num">收盘</th><th class="num">涨幅</th>'+
     '<th class="num">52周高点</th><th class="num">距高点</th><th>行业</th></tr></thead><tbody>';
  if(!DATA.moversH52.length){
    h+='<tr><td colspan="6" class="empty">池内暂无距高点 3% 以内的标的</td></tr>';
  }
  DATA.moversH52.forEach(s2=>{
    const dc=s2.dist==null?"—":'<span class="'+(s2.dist>=-3?"up":"down")+'">'+pct(s2.dist,1)+'</span>';
    h+='<tr><td><div class="tk">'+s2.t+'</div><div class="tk-sub">'+s2.n+'</div></td>'+
       '<td class="num">'+s2.px+'</td><td class="num"><span class="chg '+sgn(s2.mv||0)+'">'+pct(s2.mv,1)+'</span></td>'+
       '<td class="num muted">'+(s2.hi?"$"+s2.hi.toFixed(2):"—")+'</td>'+
       '<td class="num">'+dc+'</td>'+
       '<td><span class="tag">'+s2.sec+'</span></td></tr>';
  });
  h+='</tbody></table></div>';
  h+='<div class="tiny muted" style="margin-top:6px;padding-left:2px">这一节只覆盖<b>研究池</b>，用来提前发现“快要创新高”的标的；全市场当日的实际新高见 02。</div></div>';
  return h;
}

/* 结论先行：统计卡 + 归纳 + 策略建议（按当日全市场计算，不受下面明细表的筛选影响） */
function hiConcl(H){
  const rows=(H&&H.today)?H.today:[];
  const ent=(o)=>Object.entries(o).sort((a,b)=>b[1]-a[1]);
  const cnt=(key)=>rows.reduce((m,x)=>{const k=x[key]||"其它";m[k]=(m[k]||0)+1;return m;},{});
  const tkE=ent(cnt("track")), scE=ent(cnt("sec"));
  const capped=rows.filter(x=>(x.mcap||0)>0);
  const big=capped.filter(x=>x.mcap>=10e9).length, mid=capped.filter(x=>x.mcap>=2e9&&x.mcap<10e9).length;
  const small=capped.length-big-mid, noCap=rows.length-capped.length;
  const athN=rows.filter(x=>x.type==="ath").length;
  const uni=(DATA.moversUniverse||0);
  const realTk=tkE.filter(x=>x[0]!=="其它");
  const concTxt = realTk.length && realTk[0][1]>=3
    ? [realTk[0][0]+' '+realTk[0][1]+' 条', '占 '+Math.round(realTk[0][1]/rows.length*100)+'%'+(rows.length<=3?' · 样本过小':'')]
    : (scE.length ? [scE[0][0]+'（板块） '+scE[0][1]+' 条', '赛道未集中，按板块看：占 '+Math.round(scE[0][1]/rows.length*100)+'%']
                  : ['—','无记录']);
  const statCell=(k,v,sub,color)=>'<div class="mkt-card" style="padding:10px 14px">'+
    '<div class="tiny muted">'+k+'</div><div style="font-size:20px;font-weight:700;margin:3px 0 1px;'+(color?'color:'+color:'')+'">'+v+'</div>'+
    '<div class="tiny muted">'+sub+'</div></div>';
  let h='<div class="mkt3" style="grid-template-columns:repeat(4,minmax(0,1fr))">'+
    statCell('当日创新高', rows.length+' 条', '全市场扫描 '+uni+' 只普通股 · 交易日 '+(H&&H.date||'—'))+
    statCell('其中历史新高', athN+' 条', '越过上市以来全部最高价'+(athN?'':' · 今日无'))+
    statCell('占比', uni?((rows.length/uni*100).toFixed(1)+'%'):'—', '新高数 / 扫描总数')+
    statCell('集中度', concTxt[0], concTxt[1])+
    '</div>';

  const avg20 = rows.length ? rows.filter(x=>x.d20!=null).reduce((s,x)=>s+x.d20,0)/Math.max(1,rows.filter(x=>x.d20!=null).length) : null;
  const avgYtd = rows.length ? rows.filter(x=>x.ytd!=null).reduce((s,x)=>s+x.ytd,0)/Math.max(1,rows.filter(x=>x.ytd!=null).length) : null;

  h+='<div class="grid g2" style="margin-top:10px;align-items:start">';
  h+='<div class="card" style="padding:14px 16px"><b style="font-size:12px">归纳</b><div class="read" style="margin-top:7px;line-height:1.85">';
  if(!rows.length){
    h+='当日全市场<b>零创新高</b>，这是明确的广度信号：没有任何方向能走出“高于过去一年所有价格”的走势，说明市场处于<b>无趋势 / 去泡沫</b>阶段——<b>此时不该加仓任何单一赛道</b>，也别把“跌得多”当成“便宜”。';
  } else {
    const d20s=rows.filter(x=>x.d20!=null).slice().sort((a,b)=>b.d20-a.d20);
    const ytds=rows.filter(x=>x.ytd!=null).slice().sort((a,b)=>b.ytd-a.ytd);
    h+='当日全市场共 <b>'+rows.length+'</b> 条（扫描 '+uni+' 只普通股），其中历史新高 <b>'+athN+'</b> 条。赛道分布：'+
       (tkE.length?tkE.slice(0,4).map(x=>'<b>'+esc(x[0])+'</b> '+x[1]+' 条').join('、'):'—')+
       '；板块分布：'+(scE.length?scE.slice(0,3).map(x=>esc(x[0])+' '+x[1]).join('、'):'—')+'。'+
       (capped.length?'市值结构：大市值 <b>'+big+'</b>、中市值 '+mid+'、中小市值 '+small+(noCap?'（另有 '+noCap+' 只未取到市值）':'')+'。':'')+
       '<br>创新高标的的平均 20 日动量 '+(avg20!=null?'<b class="'+sgn(avg20)+'">'+pct(avg20,1)+'</b>':'—')+
       '、平均 YTD '+(avgYtd!=null?'<b class="'+sgn(avgYtd)+'">'+pct(avgYtd,1)+'</b>':'—')+
       (d20s.length?('；20 日最强 <b>'+d20s[0].sym+' '+pct(d20s[0].d20,1)+'</b>、YTD 最强 <b>'+ytds[0].sym+' '+pct(ytds[0].ytd,1)+'</b>'):'')+'。<br>'+
       (rows.length<=3 ? '<b>数量很少，属个股行为，还称不上赛道共识</b>——不要据此加仓整个赛道。'
        : (realTk.length && Math.round(realTk[0][1]/rows.length*100)>=40
          ? '剔除「其它」后，<b>'+esc(realTk[0][0])+'</b> 占 '+Math.round(realTk[0][1]/rows.length*100)+'%，<b>赛道共识已经形成</b>，但同时意味着拥挤度在上升。'
          : (scE.length && Math.round(scE[0][1]/rows.length*100)>=25
            ? '赛道层面分散，但<b>板块集中在 '+esc(scE[0][0])+'（'+scE[0][1]+' 条，占 '+Math.round(scE[0][1]/rows.length*100)+'%）</b>——这是一次<b>板块级行情</b>（防御/周期切换），不是单一主题。'
            : '分布在 '+tkE.length+' 个赛道（含「其它」），也没有 25% 以上的集中板块；'+(scE.length>1?('最多的 '+esc(scE[0][0])+' 仅 '+scE[0][1]+' 条'):'')+'——属结构性轮动而非趋势行情。')));
  }
  h+='</div></div>';

  h+='<div class="card" style="padding:14px 16px;border-color:#e6dff5;background:#fbfaff"><b style="font-size:12px">策略建议（跟踪与配置权重）</b><div class="read" style="margin-top:7px;line-height:1.85">';
  if(!rows.length){
    h+='<b>维持现状，不加不减。</b>零新高阶段最适合做的是<b>把观察名单整理干净</b>：等出现“同一赛道连续 ≥3 个交易日有新高”再动手，那才是资金真正建仓的证据。'+
       '同时把<b>防御板块（医疗/必需消费/公用事业）</b>的跟踪权重临时上调——无趋势市场里它们是唯一有相对收益的地方。';
  } else if(rows.length<=3){
    h+='① <b>权重动作：本次不调权重。</b>当日只有 <b>'+rows.length+'</b> 条新高，样本不足以支持“赛道共识”——把它们放进<b>观察名单</b>，等同一赛道<b>连续 3 个交易日</b>出现新高再谈增配。<br>'+
       '② <b>怎么读这几条</b>：'+(tkE[0]?('集中在 <b>'+esc(tkE[0][0])+'</b>（'+tkE[0][1]+' 条）'):'无集中')+
       (athN?('，其中 <b>'+athN+' 条历史新高</b>（质量比普通 52 周新高高一档——不只是修复，而是突破上市以来所有价位）'):'')+'，但仍属个股行为。<br>'+
       '③ <b>跟踪动作</b>：给这几只各建一张<b>催化剂时间表</b>（财报日 / 数据日 / 产能节点），新高之后的第一件事不是追，而是<b>确认后面的量能不能跟上价格</b>。<br>'+
       '④ <b>证伪条件</b>：若接下来 3–5 个交易日新高数量快速回升且集中在同一赛道，说明资金重新建仓，届时按“增配候选”执行；若新高标的普遍 <b>20 日动量转负</b>，说明是假突破，退回观察。';
  } else {
    const tkCons = realTk.length && Math.round(realTk[0][1]/rows.length*100)>=40;
    const scCons = !tkCons && scE.length && Math.round(scE[0][1]/rows.length*100)>=25;
    const focus = tkCons ? esc(realTk[0][0]) : (scCons ? esc(scE[0][0]) : null);
    /* 防御/利率敏感占比：按实际板块分布算，不写死结论 */
    const DEF_SEC=/^(医疗|必需消费|公用事业|金融|房地产)$/;
    const defRows=rows.filter(x=>DEF_SEC.test(x.sec||""));
    const defN=defRows.length;
    const defShare=rows.length?Math.round(defN/rows.length*100):0;
    const defTxt=ent(defRows.reduce((m,x)=>{const k=x.sec||"其它";m[k]=(m[k]||0)+1;return m;},{})).slice(0,4).map(x=>esc(x[0])+' '+x[1]).join('、');
    const top3=scE.slice(0,3).map(x=>'<b>'+esc(x[0])+'</b> '+x[1]).join('、');
    const leadSet=tkCons?rows.filter(x=>(x.track||"其它")===realTk[0][0]):rows.filter(x=>(x.sec||"其它")===scE[0][0]);
    const lead=leadSet.slice().sort((x,y)=>(y.mcap||0)-(x.mcap||0)).slice(0,4).map(x=>x.sym).join('、');
    h+='① <b>跟踪权重</b>：'+(focus

       '② <b>配置权重</b>：'+(defShare>=55

       '③ <b>不要做的事</b>：不要因为一天的新高把整条板块打满；不要买“跟涨但没创新高”的二线；不要把「其它」里的杂项新高当成主题信号。<br>'+
       '④ <b>拐点观察</b>：'+(focus
          ? '若新高从 <b>'+focus+'</b> 扩散到相邻板块（如医疗 → 医疗设备 → 医院），是<b>趋势确认</b>；若只在高位股内部轮动、数量反而下降，是<b>趋势衰竭</b>。'
          : '盯「新高数量」本身：连续 3 日回升 + 赛道收敛 = 资金重新建仓；继续萎缩 = 去泡沫未完。')+'<br>'+

  }
  h+='</div></div></div>';

}

/* 当日新高明细表（筛选 + 排序），跟在「结论先行」后面 */
function hiBody(H){
  const today=(H&&H.today)?H.today:[];
  const st=HI_ST;
  let rows=today.filter(x=>
    (st.type==="全部" || (st.type==="52w" ? (x.type==="52w"||x.type==="ath") : x.type===st.type)) &&
    (st.trk==="全部" || (x.track||"其它")===st.trk) &&
    (st.sec==="全部" || (x.sec||"其它")===st.sec));
  const sk=st.sort;
  rows=rows.slice().sort((a,b)=>{
    const va=(sk.key==="mcap"?(a.mcap||0):(a[sk.key]==null?-1e9:a[sk.key]));
    const vb=(sk.key==="mcap"?(b.mcap||0):(b[sk.key]==null?-1e9:b[sk.key]));
    return (vb-va)*sk.dir || (b.mcap||0)-(a.mcap||0);
  });
  const typeTxt={"52w":"52 周新高","ath":"历史新高","mkt":"指数新高"};
  const mktTxt={US:"美股",HK:"港股",CN:"A股"};
  const arrow=(k)=> st.sort.key===k ? (st.sort.dir>0?" ▾":" ▴") : "";
  const thSort=(k,label,w)=>'<th class="num'+(w?' style="width:'+w+'"':'')+'" data-sort="'+k+'" style="cursor:pointer" title="点击排序">'+label+arrow(k)+'</th>';

  let h='<div class="card tbl-wrap"><table class="tbl"><thead><tr>'+
    '<th style="width:88px">日期</th><th style="width:170px">标的</th><th style="width:84px">类型</th>'+
    '<th style="width:52px">市场</th><th style="width:92px">板块</th><th style="width:130px">赛道</th>'+
    thSort("px","股价","80px")+thSort("chg","当日","76px")+thSort("d20","20 日","76px")+thSort("ytd","YTD","76px")+
    '</tr></thead><tbody>';
  if(!rows.length){
    h+='<tr><td colspan="10" class="empty">'+(today.length?'当前筛选条件下无记录':'当日全市场扫描未发现创新高（严格口径下这本身就是有效信号）')+'</td></tr>';
  }
  rows.forEach(x=>{
    const isAth=x.type==="ath";
    h+='<tr><td class="num" style="white-space:nowrap">'+x.d+'</td>'+
      '<td><div class="tk">'+x.sym+(isAth?' <span class="tag red" style="font-size:9px">ATH</span>':'')+'</div><div class="tk-sub">'+esc(x.name||"")+'</div></td>'+
      '<td><span class="tag'+(isAth?" red":'')+'">'+(typeTxt[x.type]||x.type)+'</span></td>'+
      '<td>'+(mktTxt[x.market]||x.market||"")+'</td>'+
      '<td><span class="tag">'+esc(x.sec||"其它")+'</span></td>'+
      '<td>'+(x.track?'<span class="tag violet">'+esc(x.track)+'</span>':'<span class="tiny muted">—</span>')+'</td>'+
      '<td class="num" style="font-weight:600">'+(x.px!=null?"$"+Number(x.px).toFixed(2):"—")+'</td>'+
      '<td class="num">'+(x.chg!=null?'<span class="chg '+sgn(x.chg)+'">'+pct(x.chg,2)+'</span>':'—')+'</td>'+
      '<td class="num">'+(x.d20!=null?'<span class="chg '+sgn(x.d20)+'">'+pct(x.d20,1)+'</span>':'—')+'</td>'+
      '<td class="num">'+(x.ytd!=null?'<span class="chg '+sgn(x.ytd)+'">'+pct(x.ytd,1)+'</span>':'—')+'</td></tr>';
  });
  h+='</tbody></table></div>';
  h+='<div class="tiny muted" style="margin-top:5px;padding-left:2px">股价/当日/20日/YTD 均为<b>已结算收盘口径</b>（20 日 = 相对 20 个交易日前收盘，YTD = 相对上年最后收盘）；点击「股价 / 当日 / 20 日 / YTD」表头可切换升序降序。挂 ATH 标的是「当日最高价越过上市以来全部最高价」，比普通 52 周新高强一档。</div>';
  return h;
}

function stockCard(s,i){
  const es=s.earn.status;

/* 按赛道分组渲染；key = "全部" 或某个赛道 id */
function stockGroups(key){
  const idx = DATA.stocks.map((s,i)=>({s:s,i:i}));
  const groups = TRACK_SEQ.filter(t=> key==="全部" || key===t);
  let out='';
  let total=0;
  groups.forEach(t=>{
    const list = idx.filter(x=>trkOf(x.s)===t);
    if(!list.length) return;
    total+=list.length;
    const down=list.filter(x=>x.s.mv!=null && x.s.mv<0).length;
    out+='<div class="trk-h"><span class="tag violet">'+(t==="other"?"其它":"赛道")+'</span>'+
      '<span>'+TRACK_NAME[t]+'</span><span class="tiny muted">'+list.length+' 只'+
      (t!=="other" ? '　·　当日跌 '+down+' 只' : '')+'</span><span class="line"></span></div>';
    out+='<div class="subgrid">'+list.map(x=>stockCard(x.s,x.i)).join("")+'</div>';
  });
  if(!total) out+='<div class="card empty">该分类下暂无标的</div>';
  return out;
}

    '<p>预警的关键不是指标多，而是“触发之后做什么”。每条规则包含阈值、当前值、触发状态、对应动作（减仓 / 对冲 / 只观察）。策略模块里的“风险点”是判断，这里落地成规则。</p></div>'+
    '<div class="ph-grid">'+
      phCard("宏观风险仪表","10Y 美债、VIX 期限结构、美元指数、HY OAS 四条阈值线。")+
      phCard("持仓集中度","单票 &gt; 15%、单一主题 &gt; 30%、前五合计 &gt; 55% 时告警。")+
      phCard("事件日历联动","FOMC、CPI、非农、主要标的财报，T-3 自动提醒。")+
      phCard("个股止损 / 逻辑失效","价格止损线 + 基本面失效条件（backlog 下修、毛利率跌破阈值）。")+
      phCard("流动性风险","小市值标的的日均成交额与持仓市值比 &gt; 20% 时提示退出难度。")+
      phCard("相关性突变","持仓两两 60 日相关性上穿 0.8 时，提示“看似分散实则同向”。")+
    '</div>';
}

/* ---------- router ---------- */
const VIEWS={brief:viewBrief,tracks:viewTracks,events:viewEvents,movers:viewMovers,
  stocks:viewStocks,strategy:viewStrategy,portfolio:viewPortfolio,risk:viewRisk};

function renderNav(){
  let h='<div class="nav-label">工作流</div>';
  MODULES.forEach((m,i)=>{
    h+='<div class="nav-item" data-id="'+m.id+'"><svg viewBox="0 0 24 24">'+m.icon+'</svg>'+
       '<span>'+m.name+'</span>'+(m.soon?'<span class="soon">'+m.soon+'</span>':'<span class="idx">'+String(i+1).padStart(2,"0")+'</span>')+'</div>';
  });
  $("#nav").innerHTML=h;
  document.querySelectorAll(".nav-item").forEach(el=>{ el.onclick=()=>{ location.hash=el.dataset.id; }; });
}

function bindNotes(){
  const ta=$("#think");
  if(ta){
    const key="desk_think_v1";
    ta.value=localStorage.getItem(key)||DATA.strategy.thinking;
    let t;
    ta.oninput=function(){
      $("#saved").textContent="保存中…";
      clearTimeout(t);
      t=setTimeout(()=>{
        try{
          localStorage.setItem(key,ta.value);
          $("#saved").textContent="已保存 "+new Date().toLocaleTimeString("zh-CN",{hour:"2-digit",minute:"2-digit"});
        }catch(e){ $("#saved").textContent="保存失败"; }
      },400);
    };
  }
  document.querySelectorAll("[data-add]").forEach(btn=>{
    btn.onclick=function(){
      const i=+btn.dataset.add, r=DATA.strategy.recs[i];
      const pool=getAddedPool();
      if(!pool.some(x=>x.t===r.tk)){
        pool.push({t:r.tk,n:r.name,d:DATA.meta.date});
        try{ localStorage.setItem("desk_pool_added",JSON.stringify(pool)); }catch(e){}
      }
      btn.textContent="已入库"; btn.disabled=true;
    };
  });
}

function route(){
  const id=(location.hash||"#brief").slice(1);
  const mod=MODULES.find(m=>m.id===id)||MODULES[0];
  document.querySelectorAll(".nav-item").forEach(el=>el.classList.toggle("active",el.dataset.id===mod.id));
  $("#ttl").textContent=mod.name; $("#dsc").textContent=mod.desc;
  const v=$("#view"); v.innerHTML=VIEWS[mod.id]();
  v.style.animation="none"; void v.offsetWidth; v.style.animation="";
  window.scrollTo({top:0,behavior:"instant"});

  if(mod.id==="brief"){
    /* 业绩超预期存档：季度切换 + 表头排序 */
    const bindEb=()=>{
      document.querySelectorAll("[data-ebq]").forEach(b=>{
        b.onclick=()=>{ EB_ST.q=b.dataset.ebq; $("#eb-wrap").innerHTML=ebInner(); bindEb(); };
      });
      document.querySelectorAll("[data-ebs]").forEach(th=>{
        th.onclick=()=>{
          const k=th.dataset.ebs;
          if(EB_ST.sort.key===k) EB_ST.sort.dir*=-1; else EB_ST.sort={key:k,dir:1};
          $("#eb-wrap").innerHTML=ebInner(); bindEb();
        };
      });
    };
    bindEb();
  }

  if(mod.id==="tracks"){
    document.querySelectorAll("[data-t]").forEach(el=>{ el.onclick=()=>{ trackSel=el.dataset.t; route(); }; });
    const ta=$("#track-note"), key="desk_track_"+trackSel;
    const cur=DATA.tracks.find(x=>x.id===trackSel);
    ta.value=localStorage.getItem(key)||cur.think||"";
    let t;
    ta.oninput=function(){
      $("#track-saved").textContent="保存中…";
      clearTimeout(t);
      t=setTimeout(()=>{ try{ localStorage.setItem(key,ta.value); $("#track-saved").textContent="已保存"; }catch(e){} },400);
    };
  }

  if(mod.id==="movers"){
    const H=DATA.highs;
    const today=(H&&H.today)||[];
    const chips=(arr,key,el,label)=>{
      el.innerHTML='<span class="tiny muted" style="margin-right:2px">'+label+'</span>'+
        arr.map(s=>'<button class="fchip'+(HI_ST[key]===s?' on':'')+'" data-k="'+key+'" data-v="'+esc(s)+'">'+esc(s)+'</button>').join("");
    };
    const trkList=["全部"].concat(today.map(x=>x.track||"其它").filter((v,i,a)=>a.indexOf(v)===i));
    const secList=["全部"].concat(today.map(x=>x.sec||"其它").filter((v,i,a)=>a.indexOf(v)===i));
    const f=$("#hi-filters");
    if(f){
      f.innerHTML='<div id="hf-y" class="filters" style="margin:0 0 6px;width:100%"></div>'+
                  '<div id="hf-t" class="filters" style="margin:0 0 6px;width:100%"></div>'+
                  '<div id="hf-s" class="filters" style="margin:0 0 10px;width:100%"></div>';
      const draw=()=>{
        chips(["全部","52w","ath"],"type",$("#hf-y"),"按类型");
        $("#hf-y").querySelectorAll(".fchip").forEach(b=>{ b.textContent = b.dataset.v==="52w"?"52 周新高（含历史）":(b.dataset.v==="ath"?"仅历史新高":"全部类型"); });
        chips(trkList,"trk",$("#hf-t"),"按赛道");
        chips(secList,"sec",$("#hf-s"),"按板块");
        f.querySelectorAll(".fchip").forEach(b=>{
          b.onclick=()=>{ HI_ST[b.dataset.k]=b.dataset.v; draw(); $("#hi-body").innerHTML=hiBody(DATA.highs); bindSort(); };
        });
      };
      const bindSort=()=>{
        $("#hi-body").querySelectorAll("th[data-sort]").forEach(th=>{
          th.onclick=()=>{
            const k=th.dataset.sort;
            if(HI_ST.sort.key===k) HI_ST.sort.dir*=-1; else HI_ST.sort={key:k,dir:1};
            $("#hi-body").innerHTML=hiBody(DATA.highs); bindSort();
          };
        });
      };
      draw(); bindSort();
    }
  }

  if(mod.id==="stocks"){
    const f=$("#stock-filters");
    const keys=["全部"].concat(TRACK_SEQ.filter(t=>DATA.stocks.some(s=>trkOf(s)===t)));
    const bind=()=>{
      f.querySelectorAll(".fchip").forEach(b=>{
        b.onclick=()=>{
          f.querySelectorAll(".fchip").forEach(x=>x.classList.remove("on"));
          b.classList.add("on");
          $("#stock-groups").innerHTML=stockGroups(b.dataset.t);
          bind();
        };
      });
      document.querySelectorAll(".stock-card").forEach(c=>{ c.onclick=()=>openStock(+c.dataset.i); });
    };
    f.innerHTML=keys.map((k,i)=>'<button class="fchip'+(i===0?' on':'')+'" data-t="'+k+'">'+(k==="全部"?"全部赛道":TRACK_NAME[k])+'</button>').join("");
    bind();
  }

  if(mod.id==="strategy"){
    document.querySelectorAll("[data-v]").forEach(el=>{ el.onclick=()=>{ varTab=el.dataset.v; route(); }; });
    bindNotes();
  }
}

  try { hydrate(window.WIND_LIVE); } catch(e) { console.warn("行情数据注入失败", e); FEED.connected = false; }
}
if (YF) {
  try { hydrateExtra(YF); } catch(e) { console.warn("辅助数据注入失败", e); }
}

$("#side-date").textContent=DATA.meta.date;
$("#side-week").textContent=DATA.meta.week;
$("#hdr-date").textContent=DATA.meta.date;
$("#feed-state").textContent=FEED.connected?("Yahoo 已连接 · "+(FEED.lastSync||"已同步")):"Yahoo 未连接";
$("#side-sync").textContent=(function(){
  if(!FEED.connected) return "尚未同步";
  const g=staleGuard(DATA.meta.syncedISO);
  return "最近更新 "+(DATA.meta.updatedPT||"—")+"（北京）"
    +(g&&g.stale?"　⚠ 本场可能未跑":"")
    +" · 下一场 "+(DATA.meta.nextPT||"—");
})();
$("#feed-pill").textContent=FEED.connected?("Yahoo · "+(FEED.lastSync||"已同步")):"行情未连接 · 示例数据";
$("#feed-pill").className=FEED.connected?"pill":"pill warn";
renderNav(); route();
window.addEventListener("hashchange",route);
$("#overlay").onclick=closeDrawer;
$("#btn-print").onclick=()=>window.print();

/* 移动端：侧栏抽屉 */
(function(){
  const sb=document.querySelector(".sidebar"), mk=$("#mask"), bt=$("#btn-menu");
  if(!sb||!mk||!bt) return;
  const openNav=()=>{ sb.classList.add("open"); mk.classList.add("show"); };
  const closeNav=()=>{ sb.classList.remove("open"); mk.classList.remove("show"); };
  bt.onclick=()=>{ sb.classList.contains("open")?closeNav():openNav(); };
  mk.onclick=closeNav;
  $("#nav").addEventListener("click",e=>{
    if(e.target.closest(".nav-item")&&window.innerWidth<=980) setTimeout(closeNav,80);
  });
  window.addEventListener("hashchange",closeNav);
  window.addEventListener("resize",()=>{ if(window.innerWidth>980) closeNav(); });
  document.addEventListener("keydown",e=>{ if(e.key==="Escape") closeNav(); });
})();

document.addEventListener("keydown",e=>{ if(e.key==="Escape") closeDrawer(); });
</script>
