/* ---------- 03 ---------- */
function viewEvents(){
  const e=DATA.events;
  /* 川普语录：自动抓取条目（东财 7×24 转载过滤）排在最前，新增标红 */
  const NDt=(typeof window!=="undefined"&&window.NEWS_DATA&&window.NEWS_DATA.trump)?window.NEWS_DATA.trump:null;
  if(NDt&&NDt.items&&NDt.items.length){
    /* 标红口径：本轮新增 or 近两日内（长期滚动后 isNew 会失效，用日期兜底，保证最新几条始终是红的） */
    const TDb=new Date(Date.now()+8*3600e3).toISOString().slice(0,10);
    const YDb=new Date(Date.now()+8*3600e3-86400000).toISOString().slice(0,10);
    const seen=new Set(e.trump.rows.map(x=>String(x.o||"").slice(0,26)));
    const dyn=NDt.items.filter(x=>!seen.has(String(x.o||"").slice(0,26))).map(x=>{
      const d=String(x.d||TDb).slice(0,10);
      return {d:d,t:x.t,new:!!x.isNew||d===TDb||d===YDb,o:x.o,zh:"",r:x.r,src:x.src};
    });
    e.trump.rows=dyn.concat(e.trump.rows);
  }
  let h=feedBar();
  const TD=(function(){var d=new Date(Date.now()+8*3600e3);return String(d.getUTCMonth()+1).padStart(2,"0")+"-"+String(d.getUTCDate()).padStart(2,"0");})();
  const dayCell=function(d){
    const isToday=d.date===TD;
    const wk=(d.dow==="周六"||d.dow==="周日");
    return '<div class="cal-day'+(isToday?" today":"")+(wk?" weekend":"")+'">'+
      '<div class="cal-dow">'+d.dow+'</div><div class="cal-date">'+d.date.split("-")[1]+(isToday?'<span class="cal-today-flag">今天</span>':'')+'</div>'+
      d.items.map(function(it){
        return '<div class="cal-ev">'+impDot(it.imp)+'<span class="t">'+it.t+'</span><span class="x">'+it.ev+'</span></div>';
      }).join("")+'</div>';
  };
  /* 周次窗口：北京时间每周六 07:30 切换（20261122）
     —— 周六 07:30 之前：本周 = 本周一~周日；周六 07:30 起与周日：本周 = 下周一~下周日 */
  const weekAnchor=(function(){
    const p=Object.fromEntries(new Intl.DateTimeFormat("en-CA",{timeZone:"Asia/Shanghai",year:"numeric",month:"2-digit",day:"2-digit",hour:"2-digit",minute:"2-digit",hourCycle:"h23"}).formatToParts(new Date()).map(x=>[x.type,x.value]));
    const base=new Date(p.year+"-"+p.month+"-"+p.day+"T00:00:00Z");
    const dow=base.getUTCDay(), cur=(+p.hour)*60+(+p.minute);   /* 0=周日 */
    let mon=new Date(base.getTime()+((dow===0?-6:1-dow))*864e5); /* 本周一 */
    if(dow===0||(dow===6&&cur>=7*60+30)) mon=new Date(mon.getTime()+7*864e5); /* 周六 07:30 起切到下周 */
    return mon.toISOString().slice(0,10);
  })();
  const addD=(s,n)=>new Date(Date.parse(s+"T00:00:00Z")+n*864e5).toISOString().slice(0,10);
  const mmdd=(s)=>s.slice(5).replace("-","/");
  const wkInfo=function(start){
    const w=(e.weeks||[]).find(x=>x.start===start);
    const end=addD(start,6);
    return {start:start, range:mmdd(start)+" - "+mmdd(end), note:(w&&w.note)||"", days:(w&&w.days)||[], missing:!w};
  };
  const wkA=wkInfo(weekAnchor), wkB=wkInfo(addD(weekAnchor,7));
  const wkCol=function(w,next,label){
    const head='<div class="cal-glabel">'+label+' · '+w.range+(w.note?' · '+esc(w.note):'')+'</div>';
    if(w.missing) return '<div class="cal-grp'+(next?" next":"")+'">'+head+
      '<div class="tiny muted" style="padding:9px 14px 12px;max-width:330px;line-height:1.75">该周预排尚未录入——周六 07:30 场按官方日历补录后显示。<b>不补编事件</b>。</div></div>';
    return '<div class="cal-grp'+(next?" next":"")+'">'+head+'<div class="cal-gdays">'+w.days.map(dayCell).join("")+'</div></div>';
  };
  h+='<div class="sec">'+secHead("01","事件日历 · 本周 + 下周","本周 "+wkA.range+"　|　下周 "+wkB.range+" · 每周六 07:30 切周",
      "<span class='upd'>红=高 黄=中 灰=低</span>");
  h+='<div class="card" style="padding:8px 0 0"><div class="cal-wrap"><div class="cal-strip">'+
     wkCol(wkA,false,"本周")+
     wkCol(wkB,true,"下周")+
     '</div></div><div class="cal-hint">← 下方滚轴左右拖动，或按住 Shift+滚轮，可查看下周全部 7 天 →　<b>每周六 07:30（本周收盘后）切换到下周窗口</b>：原「下周」升为「本周」，并补入新的「下周」预排；预排随官方确认滚动修订</div></div></div>';

  h+='<div class="grid g2">';
  [["02","当月重要事件",e.month],["03","未来三个月",e.quarter]].forEach(g=>{
    h+='<div class="sec">'+secHead(g[0],g[1],"","<span class='upd'>"+g[2].length+" 项</span>");
    h+='<div class="card tbl-wrap"><table class="tbl"><thead><tr><th style="width:76px">日期</th><th>事件</th><th style="width:70px">类型</th></tr></thead><tbody>';
    g[2].forEach(x=>{
      h+='<tr><td class="strong" style="white-space:nowrap">'+x.d+'</td>'+
         '<td><div style="display:flex;gap:6px;align-items:flex-start">'+impDot(x.imp)+'<span class="read" style="color:var(--text)">'+x.ev+'</span></div></td>'+
         '<td><span class="tag">'+x.tag+'</span></td></tr>';
    });
    h+='</tbody></table></div></div>';
  });
  h+='</div>';

  h+='<div class="sec">'+secHead("04","重点跟踪","美联储议息与主席讲话 · 川普语录 · 地缘政治简报（APEC · 俄乌 · 美伊）");
  h+='<div class="grid g2 g4-eq" style="align-items:stretch">';
  const FD=(typeof window!=="undefined"&&window.FED_DATA)?window.FED_DATA:null;
  const FP=(FD&&FD.probs&&FD.probs.probs&&FD.probs.probs.length)?FD.probs:null;
  const fedMeeting=FP?FP.meeting:e.fed.meeting, fedDecision=FP?FP.decision:e.fed.decision;
  const fedProbs=FP?FP.probs:e.fed.probs;

  /* 左列：议息定价 + 主席（沃什）讲话 —— 英文原文译为中文，长期滚动 */
  h+='<div id="f04-left" class="g4-left" style="display:flex;flex-direction:column;gap:12px;min-width:0">';
  h+='<div class="card" style="padding:15px 17px"><div style="margin-bottom:8px"><div style="font-size:13px;font-weight:650">美联储 · 下次议息</div>'+
     '<div class="tiny muted">'+fedMeeting+'　决议 '+fedDecision+'</div></div>';
  fedProbs.forEach(p=>{
    h+='<div style="display:grid;grid-template-columns:86px 1fr 52px;align-items:center;gap:9px;font-size:11.5px;margin-bottom:8px">'+
       '<span>'+p.label+'</span><div class="gauge" style="margin:0"><span style="width:'+p.p+'%;background:'+p.color+'"></span></div>'+
       '<span class="num" style="text-align:right;font-weight:650">'+p.p+'%</span></div>';
  });
  if(FP){
    h+='<div class="tiny" style="color:var(--text-2);line-height:1.7;margin-top:2px">隐含会后利率 <b class="num">'+
       FP.impliedAfter.toFixed(3)+'%</b>（EFFR '+FP.effr+'% 目标区间 '+FP.target+'）· 隐含变动 <b class="num">'+
       (FP.impliedMoveBp>0?"+":"")+FP.impliedMoveBp+'bp</b>　→　把总变动按 25bp 一档拆成相邻两种结果</div>';
    if(FP.path&&FP.path.length){
      h+='<div class="kpi-row" style="margin-top:6px">'+FP.path.map(function(x){
        return '<span class="tag">'+x.d.slice(5)+' 会后 <b class="num">'+x.implied.toFixed(2)+'%</b></span>';
      }).join("")+'</div>';
    }
    h+='<div class="tiny muted" style="margin-top:7px;line-height:1.7">口径：'+esc(FP.src)+'　·　期货价 '+FP.futAt+
       '　·　<b>不再引用 CME 官网数字（已封禁脚本抓取）</b>，改为同法自算，每次更新随行情变化</div>';
  } else {
    h+='<div class="tiny muted">'+e.fed.monthAgo+'</div>';
  }
  h+='<div style="border-top:1px solid var(--line);margin-top:9px;padding-top:8px"><div class="tiny muted" style="margin-bottom:5px">概率变动原因</div>';

  e.fed.watch.forEach(w=>{ h+='<span class="tag blue">'+w+'</span>'; });
  h+='</div></div>';

  /* 主席讲话 + 议息记者会：只收沃什，英文译中文，长期滚动，新增标红，重点加粗
     记者会（含 9 月会议）与讲话合并成一条时间线——两者都是「他怎么说」，一起用来预判下一步动作 */
  const FSp=(FD&&FD.speeches)?FD.speeches.filter(function(x){return x.role==="主席";}):[];
  const FPD=(FD&&FD.predict)?FD.predict:null;
  const TOPIC_CLS={"市场":"blue","通胀":"red","就业":"green","利率":"violet"};
  const fItem=function(x){
    const toneCls = x.tone==="偏鹰" ? "red" : x.tone==="偏鸽" ? "green" : "";
    const isP = x.kind==="presser";
    return '<div class="fed-item'+(x.isNew?" isnew":"")+'">'+
      '<div class="fed-h"><span class="num">'+esc(String(x.date).slice(5))+'</span>'+
      '<span class="fed-who">'+esc(x.speaker||"沃什")+'</span>'+
      '<span class="tag '+(isP?"amber":"dash")+'">'+(isP?"记者会":"讲话")+'</span>'+
      (toneCls?'<span class="tag '+toneCls+'">'+esc(x.tone)+'</span>':'<span class="tag">中性</span>')+

    if(!a||!a.total){ hh+='窗口内全市场与三大指数均未创新高——与当前“20 日调整 / 分化”的阶段一致。创新高记录是<b>趋势确认信号</b>：连续多周出现且赛道集中，才构成风格切换的证据。'; }
    else if(a.total<3){ hh+='窗口内创新高 '+a.total+' 条，零星出现。单点新高更多是个股行为，不具备板块含义；继续观察是否在同一赛道聚集。'; }
    else {
      const tk=ent(a.byTrack)[0], sc=ent(a.bySec)[0];
      hh+='窗口内创新高 <b>'+a.total+'</b> 条，赛道最集中在 <b>'+(tk?tk[0]+'（'+tk[1]+' 条）':'—')+'</b>，板块最集中在 <b>'+(sc?sc[0]+'（'+sc[1]+' 条）':'—')+'</b>。'+
        '新高聚集是资金共识最硬的证据——同一赛道连续数周出现新高，应把该赛道从“观察”上调为“增配”候选；新高散落在无关板块，则只是轮动噪音。';
    }
    hh+='</div></div></div>';
    return hh;
  };
  h+=ana(["04","周创新高分析","7"],'weekly');
  h+=ana(["05","月创新高分析","30"],'monthly');

  /* ---------------- 06 池内标的距 52 周高点 ---------------- */
  h+='<div class="sec">'+secHead("06","研究池距 52 周高点","距高点 3% 以内 · 辅助观察创新高的临近",
      "<span class='upd'>"+DATA.moversH52.length+" 只</span>");
  h+='<div class="card tbl-wrap"><table class="tbl"><thead><tr><th>标的</th><th class="num">收盘</th><th class="num">涨幅</th>'+
     '<th class="num">52周高点</th><th class="num">距高点</th><th>行业</th></tr></thead><tbody>';
  if(!DATA.moversH52.length){
    h+='<tr><td colspan="6" class="empty">池内暂无距高点 3% 以内的标的</td></tr>';
  }
  DATA.moversH52.forEach(s2=>{
    const dc=s2.dist==null?"—":'<span class="'+(s2.dist>=-3?"up":"down")+'">'+pct(s2.dist,1)+'</span>';
    h+='<tr><td><div class="tk">'+s2.t+'</div><div class="tk-sub">'+s2.n+'</div></td>'+
       '<td class="num">'+s2.px+'</td><td class="num"><span class="chg '+sgn(s2.mv||0)+'">'+pct(s2.mv,1)+'</span></td>'+
       '<td class="num muted">'+(s2.hi?"$"+s2.hi.toFixed(2):"—")+'</td>'+
       '<td class="num">'+dc+'</td>'+
       '<td><span class="tag">'+s2.sec+'</span></td></tr>';
  });
  h+='</tbody></table></div>';
  h+='<div class="tiny muted" style="margin-top:6px;padding-left:2px">这一节只覆盖<b>研究池</b>，用来提前发现“快要创新高”的标的；全市场当日的实际新高见 02。</div></div>';
  return h;
}

/* 结论先行：统计卡 + 归纳 + 策略建议（按当日全市场计算，不受下面明细表的筛选影响） */
function hiConcl(H){
  const rows=(H&&H.today)?H.today:[];
  const ent=(o)=>Object.entries(o).sort((a,b)=>b[1]-a[1]);
  const cnt=(key)=>rows.reduce((m,x)=>{const k=x[key]||"其它";m[k]=(m[k]||0)+1;return m;},{});
  const tkE=ent(cnt("track")), scE=ent(cnt("sec"));
  const capped=rows.filter(x=>(x.mcap||0)>0);
  const big=capped.filter(x=>x.mcap>=10e9).length, mid=capped.filter(x=>x.mcap>=2e9&&x.mcap<10e9).length;
  const small=capped.length-big-mid, noCap=rows.length-capped.length;
  const athN=rows.filter(x=>x.type==="ath").length;
  const uni=(DATA.moversUniverse||0);
  const realTk=tkE.filter(x=>x[0]!=="其它");
  const concTxt = realTk.length && realTk[0][1]>=3
    ? [realTk[0][0]+' '+realTk[0][1]+' 条', '占 '+Math.round(realTk[0][1]/rows.length*100)+'%'+(rows.length<=3?' · 样本过小':'')]
    : (scE.length ? [scE[0][0]+'（板块） '+scE[0][1]+' 条', '赛道未集中，按板块看：占 '+Math.round(scE[0][1]/rows.length*100)+'%']
                  : ['—','无记录']);
  const statCell=(k,v,sub,color)=>'<div class="mkt-card" style="padding:10px 14px">'+
    '<div class="tiny muted">'+k+'</div><div style="font-size:20px;font-weight:700;margin:3px 0 1px;'+(color?'color:'+color:'')+'">'+v+'</div>'+
    '<div class="tiny muted">'+sub+'</div></div>';
  let h='<div class="mkt3" style="grid-template-columns:repeat(4,minmax(0,1fr))">'+
    statCell('当日创新高', rows.length+' 条', '全市场扫描 '+uni+' 只普通股 · 交易日 '+(H&&H.date||'—'))+
    statCell('其中历史新高', athN+' 条', '越过上市以来全部最高价'+(athN?'':' · 今日无'))+
    statCell('占比', uni?((rows.length/uni*100).toFixed(1)+'%'):'—', '新高数 / 扫描总数')+
    statCell('集中度', concTxt[0], concTxt[1])+
    '</div>';

  const avg20 = rows.length ? rows.filter(x=>x.d20!=null).reduce((s,x)=>s+x.d20,0)/Math.max(1,rows.filter(x=>x.d20!=null).length) : null;
  const avgYtd = rows.length ? rows.filter(x=>x.ytd!=null).reduce((s,x)=>s+x.ytd,0)/Math.max(1,rows.filter(x=>x.ytd!=null).length) : null;

  h+='<div class="grid g2" style="margin-top:10px;align-items:start">';
  h+='<div class="card" style="padding:14px 16px"><b style="font-size:12px">归纳</b><div class="read" style="margin-top:7px;line-height:1.85">';
  if(!rows.length){
    h+='当日全市场<b>零创新高</b>，这是明确的广度信号：没有任何方向能走出“高于过去一年所有价格”的走势，说明市场处于<b>无趋势 / 去泡沫</b>阶段——<b>此时不该加仓任何单一赛道</b>，也别把“跌得多”当成“便宜”。';
  } else {
    const d20s=rows.filter(x=>x.d20!=null).slice().sort((a,b)=>b.d20-a.d20);
    const ytds=rows.filter(x=>x.ytd!=null).slice().sort((a,b)=>b.ytd-a.ytd);
    h+='当日全市场共 <b>'+rows.length+'</b> 条（扫描 '+uni+' 只普通股），其中历史新高 <b>'+athN+'</b> 条。赛道分布：'+
       (tkE.length?tkE.slice(0,4).map(x=>'<b>'+esc(x[0])+'</b> '+x[1]+' 条').join('、'):'—')+
       '；板块分布：'+(scE.length?scE.slice(0,3).map(x=>esc(x[0])+' '+x[1]).join('、'):'—')+'。'+
       (capped.length?'市值结构：大市值 <b>'+big+'</b>、中市值 '+mid+'、中小市值 '+small+(noCap?'（另有 '+noCap+' 只未取到市值）':'')+'。':'')+
       '<br>创新高标的的平均 20 日动量 '+(avg20!=null?'<b class="'+sgn(avg20)+'">'+pct(avg20,1)+'</b>':'—')+
       '、平均 YTD '+(avgYtd!=null?'<b class="'+sgn(avgYtd)+'">'+pct(avgYtd,1)+'</b>':'—')+
       (d20s.length?('；20 日最强 <b>'+d20s[0].sym+' '+pct(d20s[0].d20,1)+'</b>、YTD 最强 <b>'+ytds[0].sym+' '+pct(ytds[0].ytd,1)+'</b>'):'')+'。<br>'+
       (rows.length<=3 ? '<b>数量很少，属个股行为，还称不上赛道共识</b>——不要据此加仓整个赛道。'
        : (realTk.length && Math.round(realTk[0][1]/rows.length*100)>=40
          ? '剔除「其它」后，<b>'+esc(realTk[0][0])+'</b> 占 '+Math.round(realTk[0][1]/rows.length*100)+'%，<b>赛道共识已经形成</b>，但同时意味着拥挤度在上升。'
          : (scE.length && Math.round(scE[0][1]/rows.length*100)>=25
            ? '赛道层面分散，但<b>板块集中在 '+esc(scE[0][0])+'（'+scE[0][1]+' 条，占 '+Math.round(scE[0][1]/rows.length*100)+'%）</b>——这是一次<b>板块级行情</b>（防御/周期切换），不是单一主题。'
            : '分布在 '+tkE.length+' 个赛道（含「其它」），也没有 25% 以上的集中板块；'+(scE.length>1?('最多的 '+esc(scE[0][0])+' 仅 '+scE[0][1]+' 条'):'')+'——属结构性轮动而非趋势行情。')));
  }
  h+='</div></div>';

  h+='<div class="card" style="padding:14px 16px;border-color:#e6dff5;background:#fbfaff"><b style="font-size:12px">策略建议（跟踪与配置权重）</b><div class="read" style="margin-top:7px;line-height:1.85">';
  if(!rows.length){
    h+='<b>维持现状，不加不减。</b>零新高阶段最适合做的是<b>把观察名单整理干净</b>：等出现“同一赛道连续 ≥3 个交易日有新高”再动手，那才是资金真正建仓的证据。'+
       '同时把<b>防御板块（医疗/必需消费/公用事业）</b>的跟踪权重临时上调——无趋势市场里它们是唯一有相对收益的地方。';
  } else if(rows.length<=3){
    h+='① <b>权重动作：本次不调权重。</b>当日只有 <b>'+rows.length+'</b> 条新高，样本不足以支持“赛道共识”——把它们放进<b>观察名单</b>，等同一赛道<b>连续 3 个交易日</b>出现新高再谈增配。<br>'+
       '② <b>怎么读这几条</b>：'+(tkE[0]?('集中在 <b>'+esc(tkE[0][0])+'</b>（'+tkE[0][1]+' 条）'):'无集中')+
       (athN?('，其中 <b>'+athN+' 条历史新高</b>（质量比普通 52 周新高高一档——不只是修复，而是突破上市以来所有价位）'):'')+'，但仍属个股行为。<br>'+
       '③ <b>跟踪动作</b>：给这几只各建一张<b>催化剂时间表</b>（财报日 / 数据日 / 产能节点），新高之后的第一件事不是追，而是<b>确认后面的量能不能跟上价格</b>。<br>'+
       '④ <b>证伪条件</b>：若接下来 3–5 个交易日新高数量快速回升且集中在同一赛道，说明资金重新建仓，届时按“增配候选”执行；若新高标的普遍 <b>20 日动量转负</b>，说明是假突破，退回观察。';
  } else {
    const tkCons = realTk.length && Math.round(realTk[0][1]/rows.length*100)>=40;
    const scCons = !tkCons && scE.length && Math.round(scE[0][1]/rows.length*100)>=25;
    const focus = tkCons ? esc(realTk[0][0]) : (scCons ? esc(scE[0][0]) : null);
    /* 防御/利率敏感占比：按实际板块分布算，不写死结论 */
    const DEF_SEC=/^(医疗|必需消费|公用事业|金融|房地产)$/;
    const defRows=rows.filter(x=>DEF_SEC.test(x.sec||""));
    const defN=defRows.length;
    const defShare=rows.length?Math.round(defN/rows.length*100):0;
    const defTxt=ent(defRows.reduce((m,x)=>{const k=x.sec||"其它";m[k]=(m[k]||0)+1;return m;},{})).slice(0,4).map(x=>esc(x[0])+' '+x[1]).join('、');
    const top3=scE.slice(0,3).map(x=>'<b>'+esc(x[0])+'</b> '+x[1]).join('、');
    const leadSet=tkCons?rows.filter(x=>(x.track||"其它")===realTk[0][0]):rows.filter(x=>(x.sec||"其它")===scE[0][0]);
    const lead=leadSet.slice().sort((x,y)=>(y.mcap||0)-(x.mcap||0)).slice(0,4).map(x=>x.sym).join('、');
    h+='① <b>跟踪权重</b>：'+(focus
        ? '把 <b>'+focus+'</b> 的跟踪优先级上调一档（每日必看 → 盘中盯），把该板块内<b>今天创新高的龙头</b>逐只建催化剂时间表'+(tkCons?'（共识强，但配置分批、不追高）':'（先观察 2–3 日，确认不是单日脉冲）')+'；其余维持原权重。'
        : '各方向都只是零星创新高，<b>不单独上调任何板块的跟踪权重</b>；把名单整体留档，等连续性出现。')+'<br>'+
       '② <b>配置权重</b>：'+(defShare>=55
          ? '新高有 <b>'+defShare+'%</b> 落在<b>防御与利率敏感板块</b>（'+defTxt+'），是典型的<b>晚周期特征</b>——指数还在高位、资金已经在找“不看 AI 也能涨”的地方。应<b>降低高贝塔（AI 基建 / 小盘成长）敞口</b>，把额度逐步转给防御板块。'
          : (focus
            ? '新高前三是 '+top3+'。<b>加的是板块内已创新高的龙头</b>'+(lead?'（'+lead+'）':'')+'，不是整个板块——新高是结果不是理由，理由要回到订单、租金、毛利率这些可验证的量。'
            : '不加不减，维持现有权重；<b>不追高、不抄底</b>，等方向自己走出来。'))+'<br>'+
       '③ <b>不要做的事</b>：不要因为一天的新高把整条板块打满；不要买“跟涨但没创新高”的二线；不要把「其它」里的杂项新高当成主题信号。<br>'+
       '④ <b>拐点观察</b>：'+(focus
          ? '若新高从 <b>'+focus+'</b> 扩散到相邻板块（如医疗 → 医疗设备 → 医院），是<b>趋势确认</b>；若只在高位股内部轮动、数量反而下降，是<b>趋势衰竭</b>。'
          : '盯「新高数量」本身：连续 3 日回升 + 赛道收敛 = 资金重新建仓；继续萎缩 = 去泡沫未完。')+'<br>'+
       '⑤ <b>证伪条件</b>：连续 3 个交易日新高数量递减且赛道分散 → 共识在瓦解，把新增权重退回；创新高标的若集体<b>放量滞涨</b>，提前一轮减。';
  }
  h+='</div></div></div>';
  return h;
}

/* 当日新高明细表（筛选 + 排序），跟在「结论先行」后面 */
function hiBody(H){
  const today=(H&&H.today)?H.today:[];
  const st=HI_ST;
  let rows=today.filter(x=>
    (st.type==="全部" || (st.type==="52w" ? (x.type==="52w"||x.type==="ath") : x.type===st.type)) &&
    (st.trk==="全部" || (x.track||"其它")===st.trk) &&
    (st.sec==="全部" || (x.sec||"其它")===st.sec));
  const sk=st.sort;
  rows=rows.slice().sort((a,b)=>{
    const va=(sk.key==="mcap"?(a.mcap||0):(a[sk.key]==null?-1e9:a[sk.key]));
    const vb=(sk.key==="mcap"?(b.mcap||0):(b[sk.key]==null?-1e9:b[sk.key]));
    return (vb-va)*sk.dir || (b.mcap||0)-(a.mcap||0);
  });
  const typeTxt={"52w":"52 周新高","ath":"历史新高","mkt":"指数新高"};
  const mktTxt={US:"美股",HK:"港股",CN:"A股"};
  const arrow=(k)=> st.sort.key===k ? (st.sort.dir>0?" ▾":" ▴") : "";
  const thSort=(k,label,w)=>'<th class="num'+(w?' style="width:'+w+'"':'')+'" data-sort="'+k+'" style="cursor:pointer" title="点击排序">'+label+arrow(k)+'</th>';

  let h='<div class="card tbl-wrap"><table class="tbl"><thead><tr>'+
    '<th style="width:88px">日期</th><th style="width:170px">标的</th><th style="width:84px">类型</th>'+
    '<th style="width:52px">市场</th><th style="width:92px">板块</th><th style="width:130px">赛道</th>'+
    thSort("px","股价","80px")+thSort("chg","当日","76px")+thSort("d20","20 日","76px")+thSort("ytd","YTD","76px")+
    '</tr></thead><tbody>';
  if(!rows.length){
    h+='<tr><td colspan="10" class="empty">'+(today.length?'当前筛选条件下无记录':'当日全市场扫描未发现创新高（严格口径下这本身就是有效信号）')+'</td></tr>';
  }
  rows.forEach(x=>{
    const isAth=x.type==="ath";
    h+='<tr><td class="num" style="white-space:nowrap">'+x.d+'</td>'+
      '<td><div class="tk">'+x.sym+(isAth?' <span class="tag red" style="font-size:9px">ATH</span>':'')+'</div><div class="tk-sub">'+esc(x.name||"")+'</div></td>'+
      '<td><span class="tag'+(isAth?" red":'')+'">'+(typeTxt[x.type]||x.type)+'</span></td>'+
      '<td>'+(mktTxt[x.market]||x.market||"")+'</td>'+
      '<td><span class="tag">'+esc(x.sec||"其它")+'</span></td>'+
      '<td>'+(x.track?'<span class="tag violet">'+esc(x.track)+'</span>':'<span class="tiny muted">—</span>')+'</td>'+
      '<td class="num" style="font-weight:600">'+(x.px!=null?"$"+Number(x.px).toFixed(2):"—")+'</td>'+
      '<td class="num">'+(x.chg!=null?'<span class="chg '+sgn(x.chg)+'">'+pct(x.chg,2)+'</span>':'—')+'</td>'+
      '<td class="num">'+(x.d20!=null?'<span class="chg '+sgn(x.d20)+'">'+pct(x.d20,1)+'</span>':'—')+'</td>'+
      '<td class="num">'+(x.ytd!=null?'<span class="chg '+sgn(x.ytd)+'">'+pct(x.ytd,1)+'</span>':'—')+'</td></tr>';
  });
  h+='</tbody></table></div>';
  h+='<div class="tiny muted" style="margin-top:5px;padding-left:2px">股价/当日/20日/YTD 均为<b>已结算收盘口径</b>（20 日 = 相对 20 个交易日前收盘，YTD = 相对上年最后收盘）；点击「股价 / 当日 / 20 日 / YTD」表头可切换升序降序。挂 ATH 标的是「当日最高价越过上市以来全部最高价」，比普通 52 周新高强一档。</div>';
  return h;
}

/* ---------- 03 创新高合并跟踪表：每只标的一行（自首次进入新高榜起跟踪），可筛选 + 点表头排序 ---------- */
function hiFollowBody(H){
  const follow=(H&&H.follow)?H.follow:[];
  const st=HI2_ST;
  const typeTxt={"52w":"52 周新高","ath":"历史新高","mkt":"指数新高"};
  const mktTxt={US:"美股",HK:"港股",CN:"A股"};
  let rows=follow.filter(x=>
    (st.type==="全部" || (st.type==="52w" ? (x.type==="52w"||x.type==="ath") : x.type===st.type)) &&
    (st.mkt==="全部" || (x.market||"US")===st.mkt) &&
    (st.sec==="全部" || (x.sec||"其它")===st.sec) &&
    (st.trk==="全部" || (x.track||"其它")===st.trk));
  /* 排序：dir=1 降序 / -1 升序；null 一律排最后；同值按最新新高日 + 次数兜底 */
  rows=rows.slice().sort((a,b)=>{
    const k=st.sort.key;
    const va=a[k]==null?null:a[k], vb=b[k]==null?null:b[k];
    if(va==null&&vb==null) return 0; if(va==null) return 1; if(vb==null) return -1;
    const c=(typeof va==="number"&&typeof vb==="number") ? (vb-va)*st.sort.dir : String(vb).localeCompare(String(va))*st.sort.dir;
    return c || String(b.lastD||"").localeCompare(String(a.lastD||"")) || (b.n||0)-(a.n||0);
  });
  const arrow=(k)=> st.sort.key===k ? (st.sort.dir>0?" ▾":" ▴") : "";
  const thS=(k,label,w,num)=>'<th data-sort="'+k+'"'+(w?' style="width:'+w+'"':'')+' class="sortable'+(num?' num':'')+'" title="点击排序">'+label+arrow(k)+'</th>';

    thS("firstD","首次<br>新高日","76px")+'<th style="width:148px">标的</th>'+

/* 催化日期归一化：完整日 / 月 / 半年 → 期间末日（毫秒），用于「下一个催化」与临近判断 */
function catPeriodEnd(d){
  let m;
  if((m=d.match(/^(\d{4})-(\d{2})-(\d{2})$/))) return Date.parse(d);
  if((m=d.match(/^(\d{4})-(\d{2})$/))) return new Date(+m[1],+m[2],0).getTime();
  if((m=d.match(/^(\d{4})H1/))) return new Date(+m[1],6,0).getTime();
  if((m=d.match(/^(\d{4})H2/))) return new Date(+m[1],12,0).getTime();
  return null;
}
/* 该标的下一个尚未过期的催化（过期列表为空时取最后一条兜底） */
function catNext(t){
  const list=CATALYSTS[t]||[], T=Date.parse(DATA.meta.date);
  let best=null;
  list.forEach(([d,ev])=>{
    const e=catPeriodEnd(d); if(e==null) return;
    if(e>=T && (!best||e<best.e)) best={d:d,ev:ev,e:e};
  });
  if(!best && list.length){ const p=list[list.length-1]; best={d:p[0],ev:p[1],e:catPeriodEnd(p[0])||0}; }
  return best;
}
function catShow(c){
  if(!c) return '<span class="tiny muted">—</span>';
  const days=(c.e-Date.parse(DATA.meta.date))/864e5;

  return '<div style="line-height:1.45"><b'+(near?' style="color:var(--up)"':'')+' style="display:inline-block">'+c.d+'</b>'+
    (near?' <span style="color:var(--up);font-weight:700;font-size:9.5px">⚠ 临近</span>':'')+
    '<div class="tiny" style="color:var(--text-2);font-size:10.5px">'+esc2(c.ev)+'</div></div>';
}

function stkBody(){
  const st=STK_ST, today=DATA.meta.date;
  const actCls={"清仓":"cut","减持":"cut","减配":"cut","观察":"watch","持有":"","增配":"add","不入池":"dash"};
  const actRank={"清仓":0,"减持":1,"减配":2,"观察":3,"持有":4,"增配":5,"不入池":0};
  let rows=DATA.stocks.map((s,i)=>({s:s,i:i}));
  if(st.trk!=="全部") rows=rows.filter(x=>trkOf(x.s)===st.trk);
  if(st.mkt&&st.mkt!=="全部") rows=rows.filter(x=>mktOf(x.s.t)===st.mkt);
  rows.forEach(x=>{
    const s=x.s, l=s.live||{};
    x.price=l.price; x.chg=l.chg!=null?l.chg:s.mv;
    x.pre=l.pre!=null?l.pre:null; x.post=l.post!=null?l.post:null;
    x.d5=l.d5!=null?l.d5:null; x.d20=l.d20!=null?l.d20:s.d20; x.ytd=l.ytd!=null?l.ytd:null;
    x.trk=trkOf(s);
    x.adv=STOCK_ADVICE[s.t]||{act:"—",d:"",txt:"",upd:false};
    x.cat=catNext(s.t);
    x.catDays=x.cat?((x.cat.e-Date.parse(today))/864e5):null;
    x.catNear=x.catDays!=null&&x.catDays>=-1&&x.catDays<=45;
  });
  if(st.act&&st.act!=="全部") rows=rows.filter(x=>x.adv.act===st.act);
  if(st.near) rows=rows.filter(x=>x.catNear);
  if(st.upd) rows=rows.filter(x=>x.adv.upd);
  const q=String(st.q||"").trim().toLowerCase();
  if(q) rows=rows.filter(x=>{
    const hay=[x.s.t,x.s.n,x.s.sec,TRACK_NAME[x.trk]||"",x.adv.act,x.adv.txt].join(" ").toLowerCase();
    return hay.indexOf(q)>=0;
  });
  /* dir=1 降序 / -1 升序；null 排最后 */
  rows.sort((a,b)=>{
    const k=st.sort.key;
    const num=(v)=>typeof v==="number"?v:(v==null?null:parseFloat(v));
    let va,vb;
    if(k==="sec"){ va=a.s.sec; vb=b.s.sec; }
    else if(k==="trk"){ va=a.trk; vb=b.trk; }
    else if(k==="t"){ va=mktRank(a.s.t)+"|"+String(a.s.t).toUpperCase(); vb=mktRank(b.s.t)+"|"+String(b.s.t).toUpperCase(); }
    else if(k==="mkt"){ va=-mktRank(a.s.t); vb=-mktRank(b.s.t); }
    else if(k==="adv"){ va=actRank[a.adv.act]??-1; vb=actRank[b.adv.act]??-1; va+=a.adv.upd?10:0; vb+=b.adv.upd?10:0; }
    else if(k==="cat"){ va=a.catDays==null?null:-a.catDays; vb=b.catDays==null?null:-b.catDays; }
    else { va=num(k==="price"?a.price:(k==="chg"?a.chg:(k==="mv"?a.chg:(k==="px"?a.price:a[k])))); vb=num(k==="price"?b.price:(k==="chg"?b.chg:(k==="mv"?b.chg:(k==="px"?b.price:b[k])))); }
    if(va==null&&vb==null) return 0; if(va==null) return 1; if(vb==null) return -1;
    const c=(typeof va==="number"&&typeof vb==="number")?(vb-va)*st.sort.dir:String(vb).localeCompare(String(va))*st.sort.dir;
    return c||(b.chg||0)-(a.chg||0);
  });
  const arrow=(k)=> st.sort.key===k ? (st.sort.dir>0?" ▾":" ▴") : "";
  const thS=(k,label,w)=>'<th data-sort="'+k+'"'+(w?' style="width:'+w+'"':'')+' class="sortable" title="点击排序">'+label+arrow(k)+'</th>';
  let h='<div class="card tbl-wrap" style="max-height:760px;overflow:auto"><table class="tbl tbl-stk"><thead><tr>'+
    thS("t","标的","128px")+thS("mkt","市场","54px")+
    thS("price","股价","60px")+thS("mv","当日","52px")+thS("pre","盘前","50px")+thS("post","盘后","50px")+
    thS("d5","5 日","50px")+thS("d20","20 日","52px")+thS("ytd","YTD","54px")+
    thS("sec","行业","112px")+thS("trk","赛道","90px")+
    thS("adv","策略建议（红 = 本轮更新）","250px")+thS("cat","下一个催化","186px")+
    '</tr></thead><tbody>';
  if(!rows.length){
    h+='<tr><td colspan="13" class="empty">当前筛选条件下无记录</td></tr>';
  } else {
    const cell=(v,d)=>v!=null?'<span class="chg '+sgn(v)+'">'+pct(v,1)+'</span>':'<span class="tiny muted">—</span>';
    rows.forEach(x=>{
      const px=x.price!=null?(curSym(x.s.t)+x.price.toFixed(2)):x.s.px;
      h+='<tr data-i="'+x.i+'" class="stk-row" title="点击查看 '+x.s.t+' 详情">'+
        '<td><div class="tk">'+x.s.t+'</div><div class="tk-sub">'+esc(x.s.n)+'</div></td>'+
        '<td><span class="tiny" style="font-size:10px;color:var(--muted)">'+mktOf(x.s.t)+'</span></td>'+
        '<td class="num" style="font-weight:600">'+px+'</td>'+
        '<td class="num">'+cell(x.chg)+'</td>'+
        '<td class="num">'+cell(x.pre)+'</td>'+
        '<td class="num">'+cell(x.post)+'</td>'+
        '<td class="num">'+cell(x.d5)+'</td>'+
        '<td class="num">'+cell(x.d20)+'</td>'+
        '<td class="num">'+cell(x.ytd)+'</td>'+
        '<td><span class="tiny" style="font-size:10.5px;color:var(--text-2)">'+esc(x.s.sec)+'</span></td>'+
        '<td><span class="tag violet" style="font-size:9.5px">'+TRACK_NAME[x.trk].split(" / ")[0]+'</span></td>'+
        '<td><div style="line-height:1.45"><span class="tag '+(actCls[x.adv.act]||"")+'" style="font-size:9.5px">'+x.adv.act+'</span>'+
        (x.adv.upd?' <span style="color:var(--up);font-weight:700;font-size:9.5px">[更新]</span>':'')+
        '<span class="tiny muted" style="font-size:9.5px;margin-left:4px">'+x.adv.d+'</span>'+
        '<div class="tiny" style="color:var(--text-2);font-size:10.5px;margin-top:1px">'+esc(x.adv.txt)+'</div></div></td>'+
        '<td>'+catShow(x.cat)+'</td></tr>';
    });
    const up=rows.filter(x=>x.chg!=null&&x.chg>0).length, dn=rows.filter(x=>x.chg!=null&&x.chg<0).length;
    const nearN=rows.filter(x=>x.catNear).length, updN=rows.filter(x=>x.adv.upd).length;
    const ytds=rows.map(x=>x.ytd).filter(v=>v!=null);
    const ytdAvg=ytds.length?(ytds.reduce((a,b)=>a+b,0)/ytds.length):null;
    h+='<tr><td colspan="13" class="tiny muted" style="padding:8px 10px">共 '+rows.length+' 只 · 当日涨 '+up+' / 跌 '+dn+' · 45 天内有催化 '+nearN+' 只 · 策略有更新 '+updN+' 只 · 平均 YTD '+(ytdAvg==null?"—":pct(ytdAvg,1))+'</td></tr>';
  }
  h+='</tbody></table></div>';
  h+='<div class="tiny muted" style="margin-top:5px;padding-left:2px;line-height:1.8">口径：股价 / 当日 / 5 日 / 20 日 / YTD 为 Yahoo 已结算收盘口径；<b>盘前 / 盘后</b>为最近一次场外成交涨跌幅（无成交显示 —）；<b>策略建议</b>为研究台观点、红色 [更新] = 本轮有边际修正；<b>催化剂时间表</b>覆盖未来 12–18 个月（抽屉内有全表），未来三个月按事件颗粒度列出，45 天内标红 ⚠。<b>除「策略建议文本」外所有列都可点表头排序</b>——「标的」默认 A→Z，且美股在前、港股次之、A 股最后（先按市场分组再按字母）；「市场」列可单独按 美股 / 港股 / A 股 排。<b>点击行进入该标的详情抽屉</b>（业绩 / 策略建议 / 核心逻辑 / 研报 / 催化全表 / 公司动态档案）。</div>';
  return h;

/* ==================================================================
   公司动态 · 长期档案（20261115(12)）
   目的：把「公告 / 新闻 / 研报 / KOL / X / 播客」放到同一条时间轴，长期滚动积累
   数据来源（越多越全，任一缺失不影响渲染）：
     1. 手写档案        s.updates（公司公告 / 财报 / 行业）· s.reports（券商研报与目标价）
     2. live-feed.js    Yahoo Finance 个股新闻（每只 20 条）+ 播客 RSS 匹配 —— sync-feed.mjs
     3. track-news.js   赛道 KOL / 播客 / 富途中文财经媒体 —— sync-tracks.mjs（按公司名或赛道匹配）
     4. kol-log.json    X / KOL 人工录入（X 无公开接口，配置 token 后可由 sync-tracks 直连）
   ================================================================== */
const FEED_TYPES=["全部","公告","新闻","研报","KOL","X","播客"];
let FEED_TYPE="全部";

function feedD(d){
  const s=String(d||"");
  if(/^\d{4}-\d{2}-\d{2}/.test(s)) return s.slice(0,10);
  if(/^\d{2}-\d{2}$/.test(s)) return DATA.meta.date.slice(0,4)+"-"+s;
  if(/^\d{4}-\d{2}$/.test(s)) return s+"-01";
  return "";
}
/* 公司关键词：代码去后缀 + 名称按括号/顿号拆开，用于匹配新闻标题 */
function stockKeys(s){
  const out=[];
  const bare=String(s.t).replace(/\..*$/,"");
  if(bare) out.push(bare);
  String(s.n||"").split(/[（()）、/,]/).forEach(x=>{ const v=x.trim(); if(v.length>=3&&out.indexOf(v)<0) out.push(v); });
  return out;
}
function feedHit(s,text){
  const T=" "+String(text||"").toLowerCase()+" ";
  return stockKeys(s).some(k=>{
    const kk=k.toLowerCase();
    if(kk.length>=5) return T.indexOf(kk)>=0;
    const esc2=kk.replace(/[.*+?^${}()|[\]\\]/g,"\\$&");
    return new RegExp("(^|[^a-z0-9])"+esc2+"([^a-z0-9]|$)","i").test(T);
  });
}
function feedList(s){
  const out=[], D=feedD;
  (s.updates||[]).forEach(u=>out.push({d:D(u.d), type:"公告", src:u.src||"公司公告", text:u.txt, key:!!u.key, isnew:!!u.key}));
  (s.reports||[]).forEach(r=>out.push({d:D(r.d), type:"研报",
    src:(r.house||"")+(r.rating&&r.rating!=="—"?" · "+r.rating:"")+(r.tp&&r.tp!=="—"?" · 目标价 "+r.tp:""),
    text:r.sum||"", key:!!r.chg, isnew:!!r.chg}));
  /* Yahoo 个股新闻 + 播客（sync-feed.mjs 累积）；英文标题已在管道里译好存在 zh 字段 */
  const FD=(typeof window!=="undefined"&&window.FEED_DATA)||null;
  const CJK=/[\u4e00-\u9fa5]/;
  const zhSrc=(s)=>String(s||"").replace(/^Yahoo Finance$/,"雅虎财经").replace(/^Yahoo$/,"雅虎财经");
  if(FD&&FD.items){
    const arr=FD.items[CODE_OF[s.t]||s.t]||FD.items[s.t]||[];
    arr.forEach(x=>{
      const ti=x.zh||x.title||"";
      const tx=(x.text&&CJK.test(x.text))?x.text:"";   /* 英文摘要不硬塞进中文流，只留有译文的 */
      out.push({d:D(x.d), type:(x.type==="pod"?"播客":(x.type==="x"?"X":"新闻")),
        src:zhSrc(x.src), text:ti+(tx?"｜"+tx:""), url:x.url||"", key:!!x.key, isnew:!!x.new});
    });
  }
  /* 赛道资讯里的 KOL / 播客 / 中文媒体（sync-tracks.mjs）；命中公司名 → 标公司级，否则标「赛道」
     英文标题按标题查 FD.tr 译文表（sync-feed.mjs 预先生成），摘要只保留中文，避免中文流里夹英文 */
  const TN=(typeof window!=="undefined"&&window.TRACK_NEWS)||null;
  if(TN&&TN.items){
    const tr=(FD&&FD.tr)||{};
    const trk=trkOf(s);
    const kindMap={kol:"KOL",pod:"播客",podcast:"播客",futu:"新闻",media:"新闻"};
    TN.items.forEach(x=>{
      const type=kindMap[x.kind]; if(!type) return;
      const hit=feedHit(s,(x.title||"")+" "+(x.snip||""));
      const trackLevel=(x.kind==="kol"||x.kind==="pod"||x.kind==="podcast")&&x.track===trk;
      if(!hit&&!trackLevel) return;
      const ti=tr[x.title]||x.title||"";
      const snip=(x.snip&&CJK.test(x.snip))?x.snip:"";
      out.push({d:D(x.d), type:type, src:String(x.src||"").replace(/^富途·/,"富途 · ")+(hit?"":" · 赛道"),
        text:ti+(snip?"｜"+snip:""), url:x.url||"", key:false, isnew:!!x.isNew});
    });
  }
  /* X / KOL 手写档案 */
  (s.kol||[]).forEach(k=>out.push({d:D(k.d), type:"X", src:k.handle||"@", text:k.view||"", key:!!k.key, isnew:!!k.new}));
  out.sort((a,b)=>(a.d<b.d?1:(a.d>b.d?-1:0)));
  return out;
}
function feedHtml(s){

  h+='</div>';
  h+='<div style="max-height:430px;overflow-y:auto;overscroll-behavior:contain;padding-right:8px;border-top:1px solid var(--line)">';
  if(!list.length){
    h+='<div class="tiny muted" style="padding:12px 0">该筛选下暂无条目——档案是「只增不减」的，新条目会在下一场抓数后自动补进来。</div>';

    h+='<div style="padding:8px 0 8px 9px;border-bottom:1px dashed #eef1f6;border-left:2px solid '+(red?"var(--up)":"transparent")+'">'+
       '<div style="display:flex;gap:6px;align-items:center;font-size:9.5px;color:var(--muted)">'+
         '<span class="num" style="flex:0 0 60px;'+(red?"color:var(--up);font-weight:700":"")+'">'+(x.d?x.d.slice(5):"—")+'</span>'+
         '<span class="tag" style="font-size:8.5px;padding:0 4px;flex:0 0 auto">'+x.type+'</span>'+
         '<span style="min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+esc(x.src)+'</span>'+
         (red?'<span style="color:var(--up);font-weight:700;flex:0 0 auto">新</span>':'')+
       '</div>'+
       '<div style="font-size:11.5px;line-height:1.7;margin-top:2px;'+(x.key?"font-weight:700;color:var(--text)":"color:var(--text-2)")+'">'+
         (x.url?'<a href="'+esc(x.url)+'" target="_blank" rel="noopener" style="color:inherit;text-decoration:none">':'')+
         esc(txt.slice(0,240))+(x.url?'</a>':'')+
       '</div></div>';
  });
  h+='</div>';
  h+='<div class="tiny muted" style="margin-top:6px;line-height:1.75">共 '+all.length+' 条 · <b>只增不减</b>（feed-log.json 累积，每只上限 160 条）· 红色 = 近 7 天新增，<b>黑体</b> = 关键变化 / 观点边际修正。信源：公司公告与券商研报（手写）+ Yahoo Finance 个股新闻、知名播客（自动抓，每日）+ 赛道 KOL · 播客 · 富途中文财经媒体（自动抓）+ X（人工录入；X 无公开免费接口，需 token 才能直连）。</div>';
  return h;
}

/* 策略模块的读数尽量现算：指数/板块/量能全部来自实时行情，避免“日期停在某一天、数字不跟” */
function idxOf(code){ const L=(typeof window!=="undefined"&&window.WIND_LIVE)||{}; return (L.indices||{})[code]||null; }
function yfSide(){ const Y=(typeof window!=="undefined"&&window.YF_DATA)||{}; return {b:Y.breadth||{}, v:Y.spxVol||{}, s:Y.sectors||{}}; }
function mktPerf(name){
  const spx=idxOf("SPX.GI"), ndx=idxOf("NDX.GI"), sox=idxOf("SOX.GI"), hsi=idxOf("HSI.HI"), sh=idxOf("000001.SH");
  const {b}=yfSide();
  if(name==="美股"&&spx&&ndx) return "标普 20 日 "+pct(spx.d20,1)+"／纳指 100 "+pct(ndx.d20,1)+"／费半 "+pct(sox&&sox.d20,1)+"；等权 RSP "+(b.rsp20!=null?pct(b.rsp20,1):"—");
  if(name==="港股"&&hsi) return "恒指 20 日 "+pct(hsi.d20,1)+"（当日 "+pct(hsi.chg,1)+"）";
  if(name==="A 股"&&sh) return "上证 20 日 "+pct(sh.d20,1)+"（当日 "+pct(sh.chg,1)+"）";
  return null;
}
function secD20Live(etf, fallback){ const {s}=yfSide(); const x=s[etf]; return x&&x.d20!=null?+x.d20:fallback; }
function watchNow(k, fallback){
  try{
    const L=(typeof window!=="undefined"&&window.WIND_LIVE)||{};
    const t10=(L.cross||{}).UST10Y, vix=idxOf("VIX.GI"), {b,v}=yfSide();
    const sg=(x)=>(x>=0?"+":"")+x;
    if(/10Y/.test(k)&&t10) return Number(t10.value).toFixed(3)+"%（5 日 "+sg(t10.dbp5)+"bp / 20 日 "+sg(t10.dbp20)+"bp）";
    if(/VIX/.test(k)&&vix) return "VIX "+Number(vix.level).toFixed(2)+"，20 日 "+pct(vix.d20,0);
    if(/等权/.test(k)&&b.rel20!=null) return pct(b.rel20,1)+"（RSP "+pct(b.rsp20,1)+" / SPY "+pct(b.spy20,1)+"）";
    if(/量能/.test(k)&&v.ratio) return "量比 "+Math.round(v.ratio*100)+"%";
  }catch(e){}
  return fallback;
}

/* ---------- 07 模拟组合（20261116(1) 修订） ----------
   建仓：2026-11-06 收盘价（用户指定口径），权重按给定比例，现金 25%
   兴森科技已移出组合（5% 转入现金）；净值序列按新口径重算 */
const PF = {
  base:"2026-11-06",
  cashW:25,
  rows:[
    {t:"2105.HK",  w:20, px0:6.05},
    {t:"IREN",     w:15, px0:21.64},
    {t:"ONTO",     w:10, px0:173.28},
    {t:"META",     w:10, px0:610.15},
    {t:"TSLA",     w:10, px0:358.22},
    {t:"CHKP",     w:10, px0:144.17}
  ],
  bench:[
    {k:"SPX.GI", n:"标普 500", b:7376.86},
    {k:"NDX.GI", n:"纳指 100", b:26989.99},
    {k:"SOX.GI", n:"费城半导体", b:9390.25},
    {k:"HSI.HI", n:"恒生指数", b:24481.86}
  ]
};
function pfCalc(){
  const S={}; (DATA.stocks||[]).forEach(x=>S[x.t]=x);
  const rows=PF.rows.map(r=>{
    const s=S[r.t]||{}, l=s.live||{};
    const px=(l.price!=null?l.price:r.px0);
    const ret=px/r.px0-1;
    return {t:r.t, n:s.n||r.t, sec:s.sec||"", trk:trkOf({t:r.t}), w0:r.w, px0:r.px0, px:px,
            ret:ret, chg:(l.chg!=null?l.chg:0), adv:(STOCK_ADVICE[r.t]||{}).act||"—", cur:curSym(r.t)};
  });
  const gross=rows.reduce((a,x)=>a+x.w0*x.ret,0)/100;   /* 持仓合计贡献（权重 × 收益） */
  const nav=1+gross;
  rows.forEach(x=>{
    x.w1=x.w0*(1+x.ret)/nav;          /* 当前权重（现金按 20% 不变，故需整体归一） */
    x.contrib=x.w0*x.ret;             /* 对净值的百分点贡献 */
    x.day=(x.w0/100)*((1+x.ret)/nav)*x.chg; /* 当日贡献（百分点） */
  });
  const day=rows.reduce((a,x)=>a+x.day,0);
  const L=(typeof window!=="undefined"&&window.WIND_LIVE)||{};
  const I=L.indices||{};
  const bench=PF.bench.map(b=>{
    const v=I[b.k];
    return {n:b.n, ret:(v&&v.level!=null)?(v.level/b.b-1):null};
  });
  return {rows:rows, nav:nav, ret:gross, day:day, bench:bench};
}
/* 组合风险规则（20261115(12)）：8 条硬约束，读数全部来自 pfCalc 的实时结果。
   阈值分两档：触发 / 接近（≥阈值 80%）；方向 up = 越大越危险，down = 越小越危险。 */
function pfRiskRules(){
  const c=pfCalc();
  const w=(t)=>{ const r=c.rows.find(x=>x.t===t); return r?r.w1:0; };
  const sorted=c.rows.slice().sort((a,b)=>b.w1-a.w1);
  const maxRow=sorted[0]||{t:"—",w1:0};
  const top3=sorted.slice(0,3).reduce((a,x)=>a+x.w1,0);
  const aiW=["IREN","ONTO","META","TSLA"].reduce((a,t)=>a+w(t),0);
  const cutRows=c.rows.filter(x=>["减配","减持","清仓"].indexOf(x.adv)>=0);
  const cutW=cutRows.reduce((a,x)=>a+x.w1,0);
  const cashW=PF.cashW/c.nav;
  const fxW=c.rows.filter(x=>curSym(x.t)!=="$").reduce((a,x)=>a+x.w1,0);
  const spx=c.bench.find(b=>b.n==="标普 500"), sox=c.bench.find(b=>b.n==="费城半导体");
  const alpha=(spx&&spx.ret!=null)?(c.ret-spx.ret)*100:null;
  const lagSox=(sox&&sox.ret!=null)?(c.ret-sox.ret)*100:null;
  const R=(id,n,read,v,trig,near,dir,thr,act)=>({id:("pf"+id),n:n,read:read,v:v,status:riskOf(v,trig,near,dir),thr:thr,act:act});
  const rules=[
    R(1,"单票权重超上限","最大 "+maxRow.t+" "+maxRow.w1.toFixed(1)+"%",maxRow.w1,20,18,"up","20% / 18%","把 "+maxRow.t+" 减回 20% 以内：卖出的部分留现金，不换股"),
    R(2,"前三大持仓集中度",sorted.slice(0,3).map(x=>x.t+" "+x.w1.toFixed(1)+"%").join(" · ")+" = "+top3.toFixed(1)+"%",top3,55,45,"up","55% / 45%","前三大 >55% 时禁止加新标的，只能在现有池里换手"),
    R(3,"AI 算力链合计","IREN / ONTO / META / TSLA 合计 "+aiW.toFixed(1)+"%",aiW,60,50,"up","60% / 50%","同一个 capex 周期，四条腿会同时回撤——超 60% 用现金或非 AI 腿对冲"),
    R(4,"「建议减配」持仓占比",(cutRows.length?cutRows.map(x=>x.t).join(" / "):"无")+" 合计 "+cutW.toFixed(1)+"%",cutW,15,10,"up","15% / 10%","研究说减、组合还拿着：要么改建议，要么减仓，不能两头都占"),
    R(5,"现金缓冲",cashW.toFixed(1)+"%（"+PF.cashW+"% ÷ 净值 "+c.nav.toFixed(3)+"）",cashW,10,15,"down","10% / 15%","现金 <10% 先卖再加；<15% 停止一切加仓"),
    R(6,"组合累计收益",pct(c.ret*100,2)+"（起点 "+PF.base+"）",c.ret*100,-5,-2,"down","-5% / -2%","亏 5% 即降总仓位 10pct——这是纪律，不是预测"),
    R(7,"相对基准超额","vs 标普 "+(alpha==null?"—":(alpha>0?"+":"")+alpha.toFixed(2)+"pct")+" · vs 费半 "+(lagSox==null?"—":(lagSox>0?"+":"")+lagSox.toFixed(2)+"pct"),lagSox,-5,-2,"down","-5pct / -2pct","跑输费半但跑赢标普 = 选股没问题、赛道 beta 拖累，不必换股"),
    R(8,"非美元资产敞口","2105.HK（港币计价）"+fxW.toFixed(1)+"%",fxW,30,25,"up","30% / 25%","港币敞口未套保，>30% 时新增仓位只用美元资产；兴森移出组合后仅剩来凯一条非美元腿")
  ];
  return {rules:rules, nav:c.nav, ret:c.ret, alpha:alpha, cashW:cashW, maxW:maxRow.w1, maxT:maxRow.t};
}

   净值序列 / 基准 / 调仓记录全部来自 pf-nav.js（sync-pf.mjs 每日生成），
   页面内只保留「区间」「基准叠加」两个视图态——基准默认不画，勾选才出现。 */
const PF_UI = { rng:"all", b:{ NDX:false, HSI:false } };
const PF_RNG = [["1w","近 1 周",7],["1m","近 1 月",30],["3m","近 3 月",90],["all","全部",0]];
const PF_BENCH = [["NDX","纳指 100","#b26a00"],["HSI","恒生指数","#0d8a5f"]];

function pfNavBlob(){
  const N=(typeof window!=="undefined"&&window.PF_NAV)||null;
  return (N&&N.series&&N.series.length>=2)?N:null;
}
function pfSeriesIn(N){
  const arr=(N?N.series:[]).slice();
  const days=((PF_RNG.filter(r=>r[0]===PF_UI.rng)[0]||PF_RNG[3])[2])||0;
  if(!days) return arr;
  const last=Date.parse(arr[arr.length-1].d), cut=last-days*864e5;
  const f=arr.filter(x=>Date.parse(x.d)>=cut);
  return f.length>=2?f:arr;
}
function pfAlign(bench, arr){
  if(!bench) return null;
  const map={}; bench.forEach(x=>{ map[x.d]=x.v; });
  let prev=null;
  return arr.map(x=>{ if(map[x.d]!=null) prev=map[x.d]; return prev; });
}

function pfPie(c){
  const cashW=PF.cashW/c.nav;
  const items=c.rows.map((x,i)=>({k:x.t, n:x.n, w:x.w1, c:PIE_C[i%PIE_C.length], ret:x.ret}))
    .concat([{k:"现金", n:"未计息 · 回撤缓冲", w:cashW, c:"#c3cbd8", ret:null}]);
  items.sort((a,b)=>b.w-a.w);
  const cx=96, cy=96, r=88, r2=54;
  let a0=-Math.PI/2, h='<svg viewBox="0 0 192 192" style="width:192px;height:192px;flex:0 0 auto">';
  const P=(a,rr)=>[ (cx+rr*Math.cos(a)).toFixed(2), (cy+rr*Math.sin(a)).toFixed(2) ];
  items.forEach(it=>{
    const frac=Math.max(it.w,0)/100, a1=a0+frac*Math.PI*2;
    const big=(a1-a0)>Math.PI?1:0;
    const [x0,y0]=P(a0,r),[x1,y1]=P(a1,r),[x2,y2]=P(a1,r2),[x3,y3]=P(a0,r2);
    h+='<path d="M'+x0+' '+y0+'A'+r+' '+r+' 0 '+big+' 1 '+x1+' '+y1+
       'L'+x2+' '+y2+'A'+r2+' '+r2+' 0 '+big+' 0 '+x3+' '+y3+'Z" fill="'+it.c+'" stroke="#fff" stroke-width="1.4">'+
       '<title>'+esc(it.k+" · "+(it.n||"")+" · "+it.w.toFixed(1)+"%")+'</title></path>';
    if(it.w>=6){
      const am=(a0+a1)/2, [tx,ty]=P(am,(r+r2)/2);
      h+='<text x="'+tx+'" y="'+ty+'" text-anchor="middle" dominant-baseline="central" '+
         'font-size="9.5" fill="#fff" style="font-weight:700;font-variant-numeric:tabular-nums">'+it.w.toFixed(0)+'%</text>';
    }
    a0=a1;
  });
  h+='<text x="'+cx+'" y="'+(cy-7)+'" text-anchor="middle" font-size="17" fill="#0e1726" style="font-weight:750;font-variant-numeric:tabular-nums">'+c.nav.toFixed(4)+'</text>';
  h+='<text x="'+cx+'" y="'+(cy+10)+'" text-anchor="middle" font-size="8.5" fill="#7a8798">组合净值</text>';
  h+='<text x="'+cx+'" y="'+(cy+24)+'" text-anchor="middle" font-size="9" fill="'+(c.ret>=0?"#d2373a":"#0d8a5f")+'" style="font-weight:700">'+pct(c.ret*100,2)+'</text>';
  h+='</svg>';

  let lg='<div style="flex:1;min-width:220px">';
  lg+='<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(178px,1fr));gap:2px 14px">';
  items.forEach(it=>{
    lg+='<div style="display:flex;align-items:center;gap:7px;padding:3.5px 0;border-bottom:1px dashed #f0f3f8">'+
      '<i style="width:9px;height:9px;border-radius:2.5px;background:'+it.c+';flex:0 0 auto"></i>'+
      '<span style="font-size:11.5px;font-weight:650;flex:0 0 auto;min-width:52px">'+esc(it.k)+'</span>'+
      '<span class="tiny muted" style="flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+esc(it.n||"")+'</span>'+
      '<span class="num" style="font-size:11.5px;font-weight:650;flex:0 0 auto">'+it.w.toFixed(1)+'%</span>'+
      (it.ret==null?'<span class="tiny muted" style="flex:0 0 54px;text-align:right">—</span>'
        :'<span class="num chg '+sgn(it.ret*100)+'" style="font-size:10.5px;flex:0 0 54px;text-align:right">'+pct(it.ret*100,1)+'</span>')+
      '</div>';
  });
  lg+='</div>';
  lg+='<div class="tiny muted" style="margin-top:8px;line-height:1.7">扇区 = <b>当前权重</b>（价格漂移后自动归一，含现金 '+(PF.cashW/c.nav).toFixed(1)+'%）；右侧小字是各标的<b>建仓以来涨跌</b>。不做再平衡，所以扇区会随时间自己变。</div>';
  lg+='</div>';
  return '<div class="card" style="padding:14px 16px"><div style="display:flex;gap:18px;flex-wrap:wrap;align-items:center">'+h+lg+'</div></div>';
}

/* ---- 03 净值走势：纯 SVG 折线 + 基准叠加 + 区间切换 + hover 读数 ---- */
function pfChart(c){
  const N=pfNavBlob();
  const arr=N?pfSeriesIn(N):[];
  if(arr.length<2){
    return '<div class="card" style="padding:14px 16px"><div class="tiny muted">净值序列还没攒够两个交易日——sync-pf.mjs 每个交易日收盘后追加一个点，攒够后这里自动出图。</div></div>';
  }
  const W=720,H=252,PL=42,PR=58,PT=14,PB=28;
  const iw=W-PL-PR, ih=H-PT-PB, n=arr.length;
  const xs=arr.map((_,i)=>PL+iw*i/(n-1));
  const ser=[{k:"PF",n:"本组合",c:"#1d3a6e",w:2.4,dash:"",v:arr.map(x=>x.nav)}];
  const rows=arr.map((x,i)=>({d:x.d,PF:x.nav}));
  PF_BENCH.forEach(b=>{
    if(!PF_UI.b[b[0]]) return;
    const v=N&&N.bench&&N.bench[b[0]]?pfAlign(N.bench[b[0]].series,arr):null;
    if(!v||v[0]==null) return;
    ser.push({k:b[0],n:b[1],c:b[2],w:1.6,dash:"5 4",v:v});
    v.forEach((y,i)=>{ if(y!=null) rows[i][b[0]]=y; });
  });
  let lo=1,hi=1;
  ser.forEach(s=>s.v.forEach(y=>{ if(y!=null){ if(y<lo)lo=y; if(y>hi)hi=y; } }));
  const pad=(hi-lo)*0.18||0.01; lo-=pad; hi+=pad;
  const Y=v=>PT+ih-(v-lo)/(hi-lo)*ih;
  const X=i=>xs[i];
  const tips=arr.map((x,i)=>x.d).join("|");

  let h='<div class="pf-chart" data-geo=\''+JSON.stringify({W:W,PL:PL,iw:iw,xs:xs,rows:rows}).replace(/'/g,"&#39;")+'\' style="position:relative">';
  h+='<svg class="pf-svg" viewBox="0 0 '+W+' '+H+'" style="width:100%;height:auto;display:block">';
  /* 网格与 y 轴（按收益百分点标注） */
  for(let g=0;g<=4;g++){
    const v=lo+(hi-lo)*g/4, y=Y(v);
    h+='<line x1="'+PL+'" y1="'+y.toFixed(1)+'" x2="'+(W-PR)+'" y2="'+y.toFixed(1)+'" stroke="#eef1f6" stroke-width="1"/>';
    h+='<text x="'+(PL-6)+'" y="'+(y+3.5).toFixed(1)+'" text-anchor="end" font-size="9" fill="#98a2b3" style="font-variant-numeric:tabular-nums">'+((v-1)*100).toFixed(1)+'%</text>';
  }
  /* 净值 1.0 基线 */
  if(lo<1&&hi>1){
    const y0=Y(1);
    h+='<line x1="'+PL+'" y1="'+y0.toFixed(1)+'" x2="'+(W-PR)+'" y2="'+y0.toFixed(1)+'" stroke="#c8d0dd" stroke-width="1" stroke-dasharray="3 3"/>';
  }
  /* x 轴日期（最多 7 个刻度） */
  const step=Math.max(1,Math.ceil(n/7));
  arr.forEach((x,i)=>{
    if(i%step&&i!==n-1) return;
    if(i!==n-1&&(n-1-i)<step*0.6) return;
    h+='<text x="'+X(i).toFixed(1)+'" y="'+(H-8)+'" text-anchor="middle" font-size="9" fill="#98a2b3">'+x.d.slice(5)+'</text>';
  });
  /* 折线 */
  ser.forEach(s=>{
    let d="",open=false;
    s.v.forEach((y,i)=>{ if(y==null){ open=false; return; } d+=(open?"L":"M")+X(i).toFixed(1)+" "+Y(y).toFixed(1)+" "; open=true; });
    h+='<path d="'+d+'" fill="none" stroke="'+s.c+'" stroke-width="'+s.w+'"'+(s.dash?' stroke-dasharray="'+s.dash+'"':'')+' stroke-linejoin="round" stroke-linecap="round"/>';
  });
  /* 组合节点 */
  ser[0].v.forEach((y,i)=>{ h+='<circle cx="'+X(i).toFixed(1)+'" cy="'+Y(y).toFixed(1)+'" r="2.6" fill="#fff" stroke="#1d3a6e" stroke-width="1.8"/>'; });
  /* 末端读数标签（避免两条线末端太近时标签互相压住） */
  const usedY=[];
  ser.forEach(s=>{
    const y=s.v[s.v.length-1];
    if(y==null) return;
    let ly=Y(y), tries=0;
    while(tries<12 && usedY.some(u=>Math.abs(u-ly)<11)){ ly+=(ly<=H/2?-11:11); tries++; }
    ly=Math.max(PT+6,Math.min(ly,H-PB-6));
    usedY.push(ly);
    h+='<text x="'+(W-PR+7)+'" y="'+(ly+3.4).toFixed(1)+'" font-size="9.5" fill="'+s.c+'" style="font-weight:700;font-variant-numeric:tabular-nums">'+((y-1)*100>0?"+":"")+((y-1)*100).toFixed(2)+'%</text>';
  });
  /* 悬浮引导线 */
  h+='<line class="pf-guide" x1="0" y1="'+PT+'" x2="0" y2="'+(PT+ih)+'" stroke="#b9c3d3" stroke-width="1" stroke-dasharray="3 3" opacity="0"/>';
  h+='</svg>';
  h+='<div class="pf-tip" style="position:absolute;pointer-events:none;opacity:0;transition:opacity .12s;background:#fff;border:1px solid var(--line-strong);border-radius:8px;padding:7px 9px;font-size:10.5px;line-height:1.6;box-shadow:0 8px 20px -10px rgba(16,29,54,.35);white-space:nowrap;z-index:5"></div>';
  h+='</div>';

  /* 上方控件：区间 + 基准勾选 */
  let bar='<div style="display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:9px">'+
    '<span class="tiny muted" style="margin-right:1px">区间</span>';
  PF_RNG.forEach(r=>{ bar+='<button class="fchip'+(PF_UI.rng===r[0]?' on':'')+'" data-prng="'+r[0]+'">'+r[1]+'</button>'; });
  bar+='<span style="width:12px"></span><span class="tiny muted" style="margin-right:1px">叠加基准</span>';
  PF_BENCH.forEach(b=>{
    const on=!!PF_UI.b[b[0]];
    bar+='<button class="fchip'+(on?' on':'')+'" data-pbench="'+b[0]+'" style="'+(on?'background:'+b[2]+';border-color:'+b[2]+';color:#fff':'border-style:dashed')+'">'+
      (on?'✓ ':'+ ')+b[1]+'</button>';
  });
  bar+='<span class="tiny muted" style="margin-left:auto">默认只画本组合 · 基准由你手动叠加</span></div>';

  const last=arr[arr.length-1], first=arr[0];
  const seg=(last.nav-first.nav)*100;
  let foot='<div class="tiny muted" style="margin-top:6px;line-height:1.7">'+
    '样本 <b>'+n+'</b> 个交易日（'+first.d+' → '+last.d+'）· 区间内组合 '+
    '<b class="'+(seg>=0?"up":"down")+'">'+pct(seg,2)+'</b>'+
    (N&&N.meta&&N.meta.updated?' · 序列更新于 '+N.meta.updated:'')+
    ' · 口径：权重按建仓比例不再平衡，不含交易成本与汇率波动；基准以 '+PF.base+' 收盘归一为 1。</div>';
  return '<div class="card" style="padding:14px 16px 10px">'+bar+h+foot+'</div>';
}
function bindPfChart(root){
  if(!root) return;
  const box=root.querySelector(".pf-chart"); if(!box) return;
  const svg=box.querySelector("svg.pf-svg"), tip=box.querySelector(".pf-tip"), guide=box.querySelector(".pf-guide");
  if(!svg||!tip||!guide) return;
  let geo=null; try{ geo=JSON.parse(box.dataset.geo); }catch(e){ return; }
  if(!geo) return;
  const hide=()=>{ tip.style.opacity=0; guide.setAttribute("opacity",0); };
  svg.addEventListener("mousemove",e=>{
    const b=svg.getBoundingClientRect();
    const vx=(e.clientX-b.left)/b.width*geo.W;
    let bi=0,bd=1e9;
    geo.xs.forEach((x,i)=>{ const d=Math.abs(x-vx); if(d<bd){ bd=d; bi=i; } });
    const r=geo.rows[bi];
    guide.setAttribute("x1",geo.xs[bi]); guide.setAttribute("x2",geo.xs[bi]); guide.setAttribute("opacity","1");
    let t='<div style="font-weight:700;margin-bottom:2px">'+r.d+'</div>';
    const keyOrder=["PF"].concat(PF_BENCH.map(b=>b[0]));
    keyOrder.forEach(k=>{
      if(r[k]==null) return;
      const nm=k==="PF"?"本组合":((PF_BENCH.filter(b=>b[0]===k)[0]||[])[1]||k);
      const v=(r[k]-1)*100;
      t+='<div style="display:flex;gap:10px;justify-content:space-between">'+
        '<span style="color:'+(k==="PF"?"#1d3a6e":((PF_BENCH.filter(x=>x[0]===k)[0]||[])[2]||"#666"))+'">'+nm+'</span>'+
        '<b style="font-variant-numeric:tabular-nums;color:'+(v>=0?"#d2373a":"#0d8a5f")+'">'+(v>0?"+":"")+v.toFixed(2)+'%</b></div>';
    });
    tip.innerHTML=t; tip.style.opacity=1;
    const pctLeft=geo.xs[bi]/geo.W*100;
    tip.style.top="10px";
    tip.style.left=(pctLeft>62?"calc("+pctLeft+"% - 152px)":"calc("+pctLeft+"% + 12px)");
  });
  svg.addEventListener("mouseleave",hide);
}

/* ---- 07 调仓记录：读 pf-nav.js 的 trades，长期累积，侧边滚动
   理由/纪律默认取 pf-trades.json 原文；人工改写存本机（desk_pf_notes），
   下次自动抓数覆盖 pf-nav.js 后仍然生效；改动可一键复制成 JSON 粘回 pf-trades.json。 ---- */
const PF_NOTES_LS="desk_pf_notes";
let PF_TRADE_DEF={};
function pfNotes(){ try{ return JSON.parse(localStorage.getItem(PF_NOTES_LS)||"{}"); }catch(e){ return {}; } }
function pfNotesSave(o){ try{ localStorage.setItem(PF_NOTES_LS,JSON.stringify(o)); }catch(e){} }
function pfNoteKey(x){ return x.d+"|"+x.t+"|"+x.act; }
function pfTrades(){
  const N=(typeof window!=="undefined"&&window.PF_NAV)||null;
  const arr=(N&&N.trades)?N.trades.slice():[];
  if(!arr.length) return '<div class="card" style="padding:14px 16px"><div class="tiny muted">还没有调仓记录——每次调仓在 pf-trades.json 里追加一条，sync-pf.mjs 会带进净值序列。</div></div>';
  arr.sort((a,b)=>(a.d<b.d?1:(a.d>b.d?-1:0)));
  const NOTE=pfNotes(); PF_TRADE_DEF={};
  const actCls={"建仓":"green","加仓":"add","增配":"add","减仓":"cut","减配":"cut","清仓":"cut","调权":"amber","再平衡":"amber"};
  let h='<div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:7px">'+
    '<span class="tiny muted">理由/纪律 <b>可直接点开改写</b>（存本机浏览器，抓数覆盖数据文件也不会丢）</span>'+
    '<span style="margin-left:auto"></span>'+
    '<button class="btn-ghost" id="pf-note-copy" style="font-size:10.5px">复制全部记录（JSON）</button>'+
    '<button class="btn-ghost" id="pf-note-reset" style="font-size:10.5px">恢复原文</button>'+
    '<span id="pf-note-state" class="tiny" style="color:var(--accent-2);font-weight:650;min-width:48px"></span></div>';
  h+='<div class="card" style="padding:0;overflow:hidden"><div style="max-height:340px;overflow-y:auto;overscroll-behavior:contain">'+
    '<table class="tbl" style="min-width:0"><thead style="position:sticky;top:0;z-index:2;background:var(--surface)"><tr>'+
    '<th style="width:88px">日期</th><th style="width:96px">标的</th><th style="width:62px">动作</th>'+
    '<th class="num" style="width:88px">成交价</th><th class="num" style="width:62px">前权重</th>'+
    '<th class="num" style="width:62px">后权重</th><th>调仓理由 / 纪律 <span class="tiny" style="font-weight:400;color:#a3adbb">可编辑</span></th></tr></thead><tbody>';
  arr.forEach(x=>{
    const k=pfNoteKey(x), def=String(x.note||"");
    PF_TRADE_DEF[k]=def;
    const ov=NOTE[k], val=(ov!=null?ov:def), edited=(ov!=null&&ov!==def);
    h+='<tr'+(x.key?' style="background:#fffafa"':'')+'>'+
      '<td class="num tiny" style="color:var(--muted)">'+esc(x.d)+'</td>'+
      '<td><div class="tk" style="font-size:12px;font-weight:650">'+esc(x.t)+'</div></td>'+
      '<td><span class="tag '+(actCls[x.act]||"")+'" style="font-size:9.5px">'+esc(x.act)+'</span></td>'+
      '<td class="num">'+(x.px==null?'<span class="muted">—</span>':curSym(x.t)+(+x.px).toFixed(2))+'</td>'+
      '<td class="num tiny">'+(x.w0?x.w0.toFixed(0)+"%":"—")+'</td>'+
      '<td class="num tiny" style="font-weight:650">'+(x.w1!=null?x.w1.toFixed(0)+"%":"—")+'</td>'+
      '<td class="tiny" style="color:var(--text-2)">'+
        (x.key?'<span style="color:var(--up);font-weight:700">[关键] </span>':'')+
        '<span class="pf-note" contenteditable="true" spellcheck="false" title="点击直接改写这条理由 / 纪律（自动存本机）" data-k="'+esc(k)+'" data-edited="'+(edited?"1":"0")+'">'+esc(val)+'</span>'+
        '<span class="pf-note-flag'+(edited?" on":"")+'">'+(edited?"已改":"")+'</span></td></tr>';
  });
  h+='</tbody></table></div></div>';
  h+='<div class="tiny muted" style="margin-top:6px;line-height:1.75">共 <b>'+arr.length+'</b> 条 · 记录存在 <code>pf-trades.json</code>，只增不改（调仓当天追加，净值序列随之重算）。'+
     '<b>前权重 → 后权重</b> 是调仓前后的组合权重，现金单独成行；「关键」= 触发纪律或改变组合结构的那一笔。'+
     '人工改写的理由存在本机浏览器；要固化到管道，点「复制全部记录」把 JSON 覆盖进 <code>pf-trades.json</code> 的 items。</div>';
  return h;
}
/* 调仓理由编辑的保存/恢复/复制 */
function bindPfNotes(){
  const flash=(t)=>{ const el=$("#pf-note-state"); if(!el) return; el.textContent=t; setTimeout(()=>{ el.textContent=""; },1600); };
  document.querySelectorAll(".pf-note[contenteditable]").forEach(el=>{
    let tm;
    const save=()=>{
      const k=el.dataset.k, v=String(el.textContent||"").replace(/\s+$/,"").trim(), def=PF_TRADE_DEF[k]||"";
      const o=pfNotes();
      if(v&&v!==def) o[k]=v; else delete o[k];
      pfNotesSave(o);
      const edited=!!(v&&v!==def);
      el.dataset.edited=edited?"1":"0";
      const fl=el.parentElement.querySelector(".pf-note-flag");
      if(fl){ fl.textContent=edited?"已改":""; fl.className="pf-note-flag"+(edited?" on":""); }
      flash("已保存");
    };
    el.addEventListener("input",()=>{ clearTimeout(tm); tm=setTimeout(save,600); });
    el.addEventListener("blur",()=>{ clearTimeout(tm); save(); });
    /* 回车不换行，直接落库（避免把表格撑高） */
    el.addEventListener("keydown",e=>{ if(e.key==="Enter"){ e.preventDefault(); el.blur(); } });
  });
  const rs=$("#pf-note-reset");
  if(rs) rs.onclick=()=>{
    const y=window.scrollY; pfNotesSave({}); route(); window.scrollTo({top:y,behavior:"instant"});
    flash("已恢复原文");
  };
  const cp=$("#pf-note-copy");
  if(cp) cp.onclick=()=>{
    const N=(typeof window!=="undefined"&&window.PF_NAV)||{};
    const NOTE=pfNotes();
    const out=(N.trades||[]).map(x=>{
      const k=pfNoteKey(x), o=Object.assign({},x);
      if(NOTE[k]!=null) o.note=NOTE[k];
      return o;
    });
    const txt=JSON.stringify(out,null,1);
    const done=()=>flash("已复制 JSON");
    if(navigator.clipboard&&navigator.clipboard.writeText){ navigator.clipboard.writeText(txt).then(done).catch(()=>fallbackCopy(txt,done)); }
    else fallbackCopy(txt,done);
  };
  function fallbackCopy(txt,done){
    try{
      const ta=document.createElement("textarea");
      ta.value=txt; ta.style.position="fixed"; ta.style.opacity="0";
      document.body.appendChild(ta); ta.select(); document.execCommand("copy"); document.body.removeChild(ta);
      done();
    }catch(e){ flash("复制失败，请手动选择"); }
  }
}

function riskSnap(){ try{ return JSON.parse(localStorage.getItem("desk_risk_snap")||"null"); }catch(e){ return null; } }

function daysTo(d){ const t=Date.parse(String(d).length===10?d:d+"/01"); return isNaN(t)?null:Math.round((t-Date.parse(DATA.meta.date))/864e5); }
function riskOf(v, trig, near, dir){
  if(v==null) return "正常";
  if(dir==="up") return v>=trig?"触发":(v>=near?"接近":"正常");
  return v<=trig?"触发":(v<=near?"接近":"正常");
}
function riskSt(st){
  return st==="触发"?'<span class="tag red">触发</span>':(st==="接近"?'<span class="tag amber">接近</span>':'<span class="tag green">正常</span>');
}

    act:"买保护改为直接降仓；不再新增长久期成长。"});

  R.push({id:"style", sev:"m", name:"成长 − 价值 20 日差（风格剪刀差）",

    act:"转负时减医疗/必需消费，同时给指数买 put。"});

  /* 6. 量能：无量下跌 */
  const vr=Y.v.ratio!=null?+Y.v.ratio:null;
  R.push({id:"vol", sev:"l", name:"标普量能（成交确认）",
    read:vr!=null?('量比 <b>'+Math.round(vr*100)+'%</b>（20 日均量基准）'):"—",

    impact:"缩量下跌 = <b>卖压真空而非出清</b>，反弹没有成交确认，容易二次探底。",
    act:"不抢反弹；等「缩量止跌 + 次日放量」再谈加仓。"});

  const pool=(DATA.stocks||[]).filter(x=>x.live&&x.live.chg!=null);

  /* 8. 研究池 20 日最大跌幅：趋势性杀估值 */
  const pool20=pool.filter(x=>x.live.d20!=null);
  const worst20=pool20.slice().sort((a,b)=>a.live.d20-b.live.d20)[0];

    impact:"20 日跌幅 >30% 通常意味着<b>商业模式被重新定价</b>，不是波动。抄底前必须看到<b>毛利率或融资成本</b>的边际改善。",
    act:"不加仓；反弹减到可接受回撤以内。"});

    act:"仓位压到可接受回撤；保留有自有电力的 IREN，退出纯融资驱动标的。"});

  /* 10. 事件风险：最近的高影响催化 */

    act:"只跟踪不加仓；有文本（关税豁免/采购）才调整出口链。"});

}

      };
    });
    /* 走势图：区间切换 / 基准叠加 / 悬浮读数（20261115(13)）——只重绘组合页，不整页跳转 */
    const bindPf=()=>{
      document.querySelectorAll("[data-prng]").forEach(b=>{
        b.onclick=()=>{ const y=window.scrollY; PF_UI.rng=b.dataset.prng; route(); window.scrollTo({top:y,behavior:"instant"}); };
      });
      document.querySelectorAll("[data-pbench]").forEach(b=>{
        b.onclick=()=>{ const y=window.scrollY; const k=b.dataset.pbench; PF_UI.b[k]=!PF_UI.b[k]; route(); window.scrollTo({top:y,behavior:"instant"}); };
      });
      const box=document.querySelector(".pf-chart");
      if(box) bindPfChart(box.parentElement);
      bindPfNotes();
    };
    bindPf();
  }

  if(mod.id==="tracks"){
    document.querySelectorAll("[data-t]").forEach(el=>{ el.onclick=()=>{ trackSel=el.dataset.t; route(); }; });
    const ta=$("#track-note"), key="desk_track_"+trackSel;
    const cur=DATA.tracks.find(x=>x.id===trackSel);
    ta.value=localStorage.getItem(key)||cur.think||"";
    let t;
    ta.oninput=function(){
      $("#track-saved").textContent="保存中…";
      clearTimeout(t);
      t=setTimeout(()=>{ try{ localStorage.setItem(key,ta.value); $("#track-saved").textContent="已保存"; }catch(e){} },400);
    };
  }

  if(mod.id==="movers"){
    const H=DATA.highs;
    const today=(H&&H.today)||[];
    const chips=(arr,key,el,label)=>{
      el.innerHTML='<span class="tiny muted" style="margin-right:2px">'+label+'</span>'+
        arr.map(s=>'<button class="fchip'+(HI_ST[key]===s?' on':'')+'" data-k="'+key+'" data-v="'+esc(s)+'">'+esc(s)+'</button>').join("");
    };
    const trkList=["全部"].concat(today.map(x=>x.track||"其它").filter((v,i,a)=>a.indexOf(v)===i));
    const secList=["全部"].concat(today.map(x=>x.sec||"其它").filter((v,i,a)=>a.indexOf(v)===i));
    const f=$("#hi-filters");
    if(f){
      f.innerHTML='<div id="hf-y" class="filters" style="margin:0 0 6px;width:100%"></div>'+
                  '<div id="hf-t" class="filters" style="margin:0 0 6px;width:100%"></div>'+
                  '<div id="hf-s" class="filters" style="margin:0 0 10px;width:100%"></div>';
      const draw=()=>{
        chips(["全部","52w","ath"],"type",$("#hf-y"),"按类型");
        $("#hf-y").querySelectorAll(".fchip").forEach(b=>{ b.textContent = b.dataset.v==="52w"?"52 周新高（含历史）":(b.dataset.v==="ath"?"仅历史新高":"全部类型"); });
        chips(trkList,"trk",$("#hf-t"),"按赛道");
        chips(secList,"sec",$("#hf-s"),"按板块");
        f.querySelectorAll(".fchip").forEach(b=>{
          b.onclick=()=>{ HI_ST[b.dataset.k]=b.dataset.v; draw(); $("#hi-body").innerHTML=hiBody(DATA.highs); bindSort(); };
        });
      };
      const bindSort=()=>{
        $("#hi-body").querySelectorAll("th[data-sort]").forEach(th=>{
          th.onclick=()=>{
            const k=th.dataset.sort;
            if(HI_ST.sort.key===k) HI_ST.sort.dir*=-1; else HI_ST.sort={key:k,dir:1};
            $("#hi-body").innerHTML=hiBody(DATA.highs); bindSort();
          };
        });
      };
      draw(); bindSort();
    }

    /* 03 合并表：类型 / 市场 / 板块 / 赛道筛选 + 表头排序 */
    const follow=(H&&H.follow)||[];
    const f2=$("#hif-filters");
    if(f2){
      const uniq=(arr)=>["全部"].concat(arr.filter((v,i,a)=>a.indexOf(v)===i));
      const trkL2=uniq(follow.map((x)=>x.track||"其它"));
      const secL2=uniq(follow.map((x)=>x.sec||"其它"));
      f2.innerHTML='<div id="hf2-t" class="filters" style="margin:0 0 6px;width:100%"></div>'+
                   '<div id="hf2-m" class="filters" style="margin:0 0 6px;width:100%"></div>'+
                   '<div id="hf2-k" class="filters" style="margin:0 0 6px;width:100%"></div>'+
                   '<div id="hf2-s" class="filters" style="margin:0 0 10px;width:100%"></div>';
      const chip2=(arr,key,el,label,rename)=>{
        el.innerHTML='<span class="tiny muted" style="margin-right:2px">'+label+'</span>'+
          arr.map((s)=>'<button class="fchip'+(HI2_ST[key]===s?' on':'')+'" data-k="'+key+'" data-v="'+esc(s)+'">'+(rename&&rename[s]||esc(s))+'</button>').join("");
      };
      const draw2=()=>{
        chip2(["全部","52w","ath"],"type",$("#hf2-t"),"按类型",{"全部":"全部类型","52w":"52 周新高（含历史）","ath":"仅历史新高"});
        chip2(["全部","US"],"mkt",$("#hf2-m"),"按市场",{"全部":"全部市场","US":"美股"});
        chip2(trkL2,"trk",$("#hf2-k"),"按赛道");
        chip2(secL2,"sec",$("#hf2-s"),"按板块");
        f2.querySelectorAll(".fchip").forEach((b)=>{
          b.onclick=()=>{ HI2_ST[b.dataset.k]=b.dataset.v; draw2(); $("#hif-body").innerHTML=hiFollowBody(DATA.highs); bindSort2(); };
        });
      };
      const bindSort2=()=>{
        $("#hif-body").querySelectorAll("th[data-sort]").forEach((th)=>{
          th.onclick=()=>{
            const k=th.dataset.sort;
            if(HI2_ST.sort.key===k) HI2_ST.sort.dir*=-1; else HI2_ST.sort={key:k,dir:1};
            $("#hif-body").innerHTML=hiFollowBody(DATA.highs); bindSort2();
          };
        });
      };
      draw2(); bindSort2();
    }
  }

  if(mod.id==="tracks"){
    document.querySelectorAll("#dsc .dsc-tab").forEach(function(el){
      el.onclick=function(){ trackSel=el.dataset.tt; route(); };
    });
  }

  if(mod.id==="stocks"){
    const f=$("#stock-filters");
    const keys=["全部"].concat(TRACK_SEQ.filter(t=>DATA.stocks.some(s=>trkOf(s)===t)));
    /* 市场 / 策略建议只在池内实际出现过的选项才渲染，避免空按钮 */
    const mkts=["全部"].concat(["美股","港股","A 股"].filter(m=>DATA.stocks.some(s=>mktOf(s.t)===m)));
    const actOrder=["增配","持有","观察","减配","减持","清仓"];
    const acts=["全部"].concat(actOrder.filter(a=>DATA.stocks.some(s=>(STOCK_ADVICE[s.t]||{}).act===a)));
    const cntOf=(fn)=>DATA.stocks.filter(fn).length;
    const drawStk=()=>{
      $("#stk-body").innerHTML=stkBody(); bindStk();
      const c=$("#stk-cnt");
      if(c){
        const n=$("#stk-body").querySelectorAll("tr[data-i]").length;
        c.textContent=n===DATA.stocks.length?("全部 "+n+" 只"):(n+" / "+DATA.stocks.length+" 只（已筛选）");
      }
    };
    const bindStk=()=>{
      $("#stk-body").querySelectorAll("th[data-sort]").forEach((th)=>{
        th.onclick=()=>{
          const k=th.dataset.sort;
          if(STK_ST.sort.key===k) STK_ST.sort.dir*=-1; else STK_ST.sort={key:k,dir:1};
          drawStk();
        };
      });
      $("#stk-body").querySelectorAll("tr[data-i]").forEach((tr)=>{
        tr.onclick=()=>openStock(+tr.dataset.i);
      });
    };
    const chip=(on,attr,label,extra)=>'<button class="fchip'+(on?' on':'')+'" '+attr+(extra||"")+'>'+label+'</button>';
    const drawChips=()=>{
      f.innerHTML=
        '<div style="display:flex;flex-wrap:wrap;gap:5px;margin-bottom:6px">'+
          '<span class="tiny muted" style="align-self:center;width:44px">市场</span>'+
          mkts.map(k=>chip(STK_ST.mkt===k,'data-m="'+k+'"',k==="全部"?"全部市场":k+' <span class="tiny" style="opacity:.6">'+(k==="全部"?cntOf(()=>true):cntOf(s=>mktOf(s.t)===k))+'</span>')).join("")+
        '</div>'+
        '<div style="display:flex;flex-wrap:wrap;gap:5px;margin-bottom:6px">'+
          '<span class="tiny muted" style="align-self:center;width:44px">赛道</span>'+
          keys.map(k=>chip(STK_ST.trk===k,'data-t="'+k+'"',(k==="全部"?"全部赛道":TRACK_NAME[k])+' <span class="tiny" style="opacity:.6">'+(k==="全部"?cntOf(()=>true):cntOf(s=>trkOf(s)===k))+'</span>')).join("")+
        '</div>'+
        '<div style="display:flex;flex-wrap:wrap;gap:5px">'+
          '<span class="tiny muted" style="align-self:center;width:44px">建议</span>'+
          acts.map(k=>chip(STK_ST.act===k,'data-a="'+k+'"',k==="全部"?"全部建议":k+' <span class="tiny" style="opacity:.6">'+(k==="全部"?cntOf(()=>true):cntOf(s=>(STOCK_ADVICE[s.t]||{}).act===k))+'</span>')).join("")+
          '<span style="width:10px"></span>'+
          chip(STK_ST.near,'data-x="near"','45 天内有催化 <span class="tiny" style="opacity:.6">'+cntOf(s=>{const c=catNext(s.t);const d=c?((c.e-Date.parse(DATA.meta.date))/864e5):null;return d!=null&&d>=-1&&d<=45;})+'</span>')+
          chip(STK_ST.upd,'data-x="upd"','策略有更新 <span class="tiny" style="opacity:.6">'+cntOf(s=>(STOCK_ADVICE[s.t]||{}).upd)+'</span>')+
        '</div>';
      f.querySelectorAll(".fchip").forEach(b=>{
        b.onclick=()=>{
          if(b.dataset.x){ STK_ST[b.dataset.x]=!STK_ST[b.dataset.x]; }
          else if(b.dataset.m!=null){ STK_ST.mkt=b.dataset.m; }
          else if(b.dataset.a!=null){ STK_ST.act=b.dataset.a; }
          else STK_ST.trk=b.dataset.t;
          drawChips(); drawStk();
        };
      });
    };
    const qi=$("#stk-q");
    if(qi){
      qi.value=STK_ST.q||"";
      qi.oninput=()=>{ STK_ST.q=qi.value; drawStk(); };
      qi.onkeydown=(e)=>{ if(e.key==="Escape"){ qi.value=""; STK_ST.q=""; drawStk(); } };
    }
    const rs=$("#stk-reset");
    if(rs){
      rs.onclick=()=>{
        STK_ST.trk="全部"; STK_ST.mkt="全部"; STK_ST.act="全部"; STK_ST.q=""; STK_ST.near=false; STK_ST.upd=false;
        if(qi) qi.value="";
        drawChips(); drawStk();
      };
    }
    drawChips(); drawStk();
  }

  if(mod.id==="strategy"){
    document.querySelectorAll("[data-v]").forEach(el=>{ el.onclick=()=>{ varTab=el.dataset.v; route(); }; });
    bindNotes();
  }

  if(deepSym){
    const di=DATA.stocks.findIndex(x=>x.t===deepSym);
    if(di>=0) openStock(di);
  }
}

/* ---- 数据注入：先核心行情（Yahoo），再 Yahoo/Nasdaq 补缺 + 校验 ---- */
if (typeof window !== "undefined" && window.WIND_LIVE) {
  try { hydrate(window.WIND_LIVE); } catch(e) { console.warn("行情数据注入失败", e); FEED.connected = false; }
}
if (YF) {
  try { hydrateExtra(YF); } catch(e) { console.warn("辅助数据注入失败", e); }
}

$("#side-date").textContent=DATA.meta.date;
$("#side-week").textContent=DATA.meta.week;
$("#hdr-date").textContent=DATA.meta.date;
$("#hdr-week").textContent=DATA.meta.week+" · 北京";
$("#feed-state").textContent=FEED.connected?("Yahoo 已连接 · "+(FEED.lastSync||"已同步")):"Yahoo 未连接";
$("#side-sync").textContent=(function(){
  if(!FEED.connected) return "尚未同步";
  const g=staleGuard(DATA.meta.syncedISO);
  return "最近更新 "+(DATA.meta.updatedPT||"—")+"（北京）"
    +(g&&g.stale?"　⚠ 本场可能未跑":"")
    +" · 下一场 "+(DATA.meta.nextPT||"—");
})();
$("#feed-pill").textContent=FEED.connected?("Yahoo · "+(FEED.lastSync||"已同步")):"行情未连接 · 示例数据";
$("#feed-pill").className=FEED.connected?"pill":"pill warn";
renderNav(); route();
window.addEventListener("hashchange",route);
$("#overlay").onclick=closeDrawer;
$("#btn-print").onclick=()=>window.print();

/* 移动端：侧栏抽屉 */
(function(){
  const sb=document.querySelector(".sidebar"), mk=$("#mask"), bt=$("#btn-menu");
  if(!sb||!mk||!bt) return;
  const openNav=()=>{ sb.classList.add("open"); mk.classList.add("show"); };
  const closeNav=()=>{ sb.classList.remove("open"); mk.classList.remove("show"); };
  bt.onclick=()=>{ sb.classList.contains("open")?closeNav():openNav(); };
  mk.onclick=closeNav;
  $("#nav").addEventListener("click",e=>{
    if(e.target.closest(".nav-item")&&window.innerWidth<=980) setTimeout(closeNav,80);
  });
  window.addEventListener("hashchange",closeNav);
  window.addEventListener("resize",()=>{ if(window.innerWidth>980) closeNav(); });
  document.addEventListener("keydown",e=>{ if(e.key==="Escape") closeNav(); });
})();

document.addEventListener("keydown",e=>{ if(e.key==="Escape") closeDrawer(); });
</script>
</body>
