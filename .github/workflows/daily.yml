name: 投资工作台 · 每交易日更新

# 北京时间 07:00 与 20:30，各跑一次
# GitHub 的 cron 用 UTC，且实际触发常延迟 5–15 分钟，属正常现象
on:
  schedule:
    - cron: "0 23 * * 0-4"    # UTC 周日–周四 23:00 = 北京 周一–周五 07:00
    - cron: "30 12 * * 1-5"   # UTC 周一–周五 12:30 = 北京 周一–周五 20:30
  workflow_dispatch:           # 支持在 Actions 页面手动触发

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: desk-daily
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 准备 Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: 抓核心行情（Yahoo 版 live-data.js）
        run: node sync-core.mjs
        continue-on-error: true

      - name: 抓辅助数据与财报日历（live-extra.js）
        run: node sync-extra.mjs
        continue-on-error: true

      - name: 抓业绩内容（live-news.js，走东方财富）
        run: node sync-news.mjs
        continue-on-error: true

      - name: 校验产物
        run: |
          for f in live-data.js live-extra.js live-news.js; do
            if [ ! -s "$f" ]; then echo "::error::$f 为空或缺失"; exit 1; fi
            node --check "$f" 2>/dev/null || node -e "new Function(require('fs').readFileSync('$f','utf8'))" || { echo "::error::$f 语法错误"; exit 1; }
            echo "✓ $f $(wc -c < $f) 字节"
          done

      - name: 提交数据回仓库
        run: |
          git config user.name "desk-bot"
          git config user.email "desk-bot@users.noreply.github.com"
          # 滚动日志必须一起提交，否则“长期积累”每次都会从零开始：
          # highs-log（52 周新高）/ geo-log（APEC·美伊·俄乌）/ trump-log（川普语录）/ movers-log（盘前盘后异动留档）
          for f in live-data.js live-extra.js live-news.js cal-cache.json \
                   highs-log.json geo-log.json trump-log.json movers-log.json gpu-rent.json \
                   earn-beat-log.json company-zh.json brief-log.json; do
            [ -f "$f" ] && git add "$f" || true
          done
          if git diff --staged --quiet; then
            echo "数据无变化，跳过提交"
          else
            git commit -m "data: $(TZ=Asia/Shanghai date +'%Y-%m-%d %H:%M') 自动更新"
            git push
          fi

      - name: 组装发布目录
        run: |
          mkdir -p _site
          cp index.html _site/
          cp live-data.js live-extra.js live-news.js _site/ 2>/dev/null || true
          ls -la _site

      - name: 给数据文件加版本号（绕开 Pages CDN 的 10 分钟缓存）
        run: |
          V=$(date +%s)
          for f in live-data.js live-extra.js live-news.js; do
            sed -i "s|$f\"|$f?v=$V\"|g" _site/index.html
          done
          echo "--- 版本号已写入 ---"
          grep -o 'live-[a-z]*\.js?v=[0-9]*' _site/index.html

      - name: 上传页面产物
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    # 与 deploy.yml 共用同一并发组，避免两次 Pages 部署互相顶掉
    concurrency:
      group: pages-deploy
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 发布到 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
